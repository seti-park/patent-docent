    #    따라 **재량으로 하지 않고 상신해 승인받은** 입법이다. 앞의 넷(2026-08-18)은 그
    #    기준이 서기 전 총괄 재량으로 집행되었고 감수가 그것을 관할 침범으로 짚었다(H6).
    #    이 둘은 그 선을 지킨 첫 사례이며, 그 사실이 규칙 파일에 남아야 한다.
    #
    #    ★ 설계 방향 = **전수성 > 순도**(재정 S7 의 결정 근거). 배제를 넓히면 순도는 오르지만
    #    **진짜 값을 삼키는 위험**이 따라오고 그 손실은 `skipped[]` 로도 잘 드러나지 않는다.
    #    같은 라운드에서 `boundary-right` 가 진짜 exponent bit-width 넷(`5b·4b·3b·2b`)을 먹고
    #    있던 것이 실측되었다. 그러므로 아래 둘은 **좁게 틀리는 쪽**으로 설계했고, 넓히는
    #    입법이므로 **반례 golden 을 동반한다**
    #    (`ledgers/regression/golden/rc-0005-harvest-exclusion-counterexamples`).
    # =====================================================================
    - id: figure-or-table-number-list
      tag: "[가설]"
      match: enclosing-pattern
      pattern: '(?i)\b(?:figures?|figs?|tables?)\.?\s*\*{0,2}\s*\d+\b\*{0,2}(?:\s*(?:,\s*and|,|and)\s*\*{0,2}\d+\b\*{0,2}(?!\.\d|\s*\*{0,2}\s*[A-Za-z°%µ×]))+'
      reason_label: figure-or-table-number
      basis: >-
        재정 2026-08-19 S7 (정규 선상신-승인). 실측 = 감수 C′-1 독립 재계수 **M87** —
        통주 3 `[0186]` *"…beyond those listed in Tables 1 and 2."* 의 **뒤 항 `2`** 가
        활성 `fact` 로 남아 있었다(`value_span` 117:118 · `unit: null`). 기존
        `figure-or-table-number` 봉투가 `Tables 1` 까지만 잡아 둘째 번호가 스칼라로 샜다.
      reason_label_why: >-
        새 라벨을 만들지 않고 `figure-or-table-number` 를 **공유한다**. 잃은 자리의 **사유**가
        같기 때문이다 — 문서 내부 참조의 번호이지 발명의 사실이 아니다. 다른 것은 어형뿐이며,
        `skipped[]` 는 봉투 **전문**을 함께 싣기 때문에 `Table 2` 와 `Tables 1 and 2` 는 기록에서
        여전히 구별된다. 라벨을 쪼개면 CP1 §12.3 의 사유별 계수가 어형 수를 세게 되고, 계수의
        단위는 패턴이 아니라 **잃은 자리**다(`enclosing_exclusions.counting_note`).
      why: >-
        한 지시가 두 번호를 드는 어형(`Tables 1 and 2` · `FIGS. 7 and 8`)에서 **첫 번호만**
        봉투에 들던 것을 꼬리까지 연다. 다만 무조건 열지 않는다 — 기존 항목의 `open_question`
        이 이미 경고했듯 맨 꼬리 `(?:\s*(?:,|and)\s*\d+)*` 는 `FIG. 3 and 4 mm` 같은 자리에서
        **진짜 수치를 먹는다**. 그래서 꼬리의 각 수에 가드를 단다: 그 수 뒤에 **소수점+숫자**가
        오거나 (마크다운 강조를 건너뛰어도) **글자·단위 기호·곱셈 기호가 오면 그 꼬리는 봉투에
        들지 않는다.**
        ★ **소수점 절은 2026-08-19 에 더해졌다(가드의 버그 수정).** 가드의 선언된 뜻은
        *"단위·문자가 뒤따르지 않는 **맨 정수**"*인데, `\d+\b` 가 `4.5` 의 `4` 에서 끝나고
        가드의 문자 집합에 `.` 이 없어 `4` 가 맨 정수로 통과했다 — 그 결과
        `FIG. 3 and 4.5 mm of clearance remains` 에서 진짜 `4.5 mm` 가 통째로 사라졌다
        (감수 C′-1 실측). 배제를 넓힌 것이 아니라 **선언한 뜻대로 좁힌 것**이므로 입법이 아니다.
        반증 = golden `rc-0005` 의 `hx-08`(보존) · `hx-09`(단위 기호 가드 대조군).
        `\d+\b` 로 자릿수를 최대로 못 박는 것도 같은 이유다 — 못 박지 않으면 정규식이 숫자
        가운데서 되돌아가 `FIG. 3 and 45 mm` 의 `4` 까지만 삼키고, 그 부분 겹침이 `45 mm`
        전체를 배제로 끌고 간다(설계 중 실측).
      measurement: >-
        ★ 실측으로 고른 폭이다(통주 특허 원천 **293,068 characters / 293,362 bytes** 전수 스캔 —
        구 표기 `293,068 B` 는 단위가 틀렸다, 2026-08-19 감수 실측). 이 패턴이 잡는 30구간은
        **전부** 도면·표 번호 나열이었고 진짜 수치는 **0건**이었다. 가드가 없는 판은 35구간을
        잡았고 그중 `FIG. **1**, 1×32 dot products` 의 `1×32` 를 부분 잠식했다 — 곱셈 기호
        `×` 를 가드 문자에 넣은 근거가 그 한 자리다.
      open_question: >-
        ★ **닫힌 것 먼저**(2026-08-19) — 꼬리의 소수점 자리가 닫혔다. `FIG. 3 and 4.5 mm` 가
        진짜 `4.5 mm` 를 잃던 것은 가드의 버그였고, 그 수정은 위 `why` 에 적혀 있다.
        ★ 미결 3건. ① **꼬리 뒤에 낱말이 오는 어형은 여전히 첫 번호까지만 든다**
        (`FIGS. 3 and 4 illustrate …` → `4` 가 스칼라로 샌다). 실물에서 가장 흔한 형태인데도
        일부러 포기했다 — 그 자리를 열면 `FIG. 3 and 4 mm` 가 같이 열리기 때문이다. 새는 것은
        도면 번호이므로 **순도의 손실**이고, 여는 것은 **전수성의 손실**이다. 재정 S7 이 둘
        중 앞엣것을 골랐다(golden `rc-0005` 의 `hx-07` 이 이 자리를 기록한다).
        ★ **[빈도 실측 등재 — 2026-08-31 · 재정 Q4 의 「허용」 칸에 따른 기록. 어형도 가드도
        고치지 않았다.]** 구 문언은 *"빈도는 첫 런 실측으로 상신한다"* 였고 아래가 그 실측이다.
        통주 3 원천(`runs/openai-us20260147854a1-cim-fp-3/00-source/patent.md` · 293,068자 /
        293,362바이트) 전수 스캔 — **나열형 총 37회 · 그중 낱말 후행 10종.**
        **★ 10종은 전부 오염이 아니다. 9 + 1 이다.**
        도면 번호 누수 **9종**(순도 손실) — `FIGS. **7** and **8** depict` → `8` ·
        `FIGS. **2** and **3** can` → `3` · `FIGS. **17** and **18** illustrates` → `18` ·
        `FIGS. **20**, **21**, **22** illustrate` → `22` ·
        `FIGS. **23**, **24**, **25** illustrate` → `25` ·
        `FIGS. **46**, **47**, **48** illustrate` → `48` ·
        `FIGS. **15**, **16**, **17**, **18** illustrate` → `18` ·
        `FIGS. **34**, **35**, **36**, and **37** illustrate` → `37` ·
        `FIGS. **61**, **62**, **63**, and **64** illustrate` → `64`.
        **진짜 수량 보존 1종** — `FIG. **41**, **32** wordline signals wl0, wl1, . . . wl31
        are provided to the column cells` 에서 `32` 는 **도면 번호가 아니라 진짜 수량**
        (wordline 신호 32개)이다. **가드가 꼬리를 끊었기 때문에 그 값이 정답지에 살아남았다** —
        결함이 아니라 **가드가 제대로 일한 자리**다.
        ★ **이것은 결함 상신이 아니라 자료이며, 오히려 재정 S7 을 지지한다** — S7 이
        *"새는 것은 도면 번호이므로 순도의 손실이고, 여는 것은 전수성의 손실이다"* 로 고른 거래가
        **가정이 아니라 실측으로 확인되었다**(순도 9건을 잃고 전수성 1건을 지킨다).
        ★ **고치려 할 때의 함정을 미리 적어 둔다** — 「단위-한정 가드」(`known_units` 63종에만
        가드를 걸어 낱말 후행을 닫는 안)는 **폐기해야 한다.** `wordline` 은 단위가 아니므로
        가드가 발동하지 않고, 봉투가 `FIG. 41, 32` 를 통째로 먹어 **진짜 값 `32` 가 소실된다.**
        더 근본적으로, **이 어형의 누수 계수는 건별로 「그 수가 무엇인가」를 원문 맥락에서
        확인하지 않으면 무의미하다** — 봉투 밖으로 나온 수가 도면 번호인지 진짜 값인지는
        패턴이 아니라 **문맥**이 정한다. 그리고 그 판정은 이 층이 할 수 없는 종류다
        (`exclusions_freeze.why` 의 `FIG. 41` ↔ `FIG. 32` 결정 불가능성).
        ★ **측정 함정 3건**(전부 실제로 밟혔다) — ⓐ 이 원천은 도면 번호를 마크다운 강조로
        싼다(`FIG. **1**`). 강조를 넘지 못하는 정규식은 **0건이라는 틀린 답**을 낸다.
        ⓑ **집계는 성질이 아니다.** 「전부 오염」처럼 깨끗한 수가 나오면 건별 확인을 건너뛰기
        쉽다 — 100%는 검증의 종료 신호가 아니라 **개시 신호**이며, 여기서도 건별 확인이
        `FIG. 41, 32` 하나를 오염 아님으로 갈랐다.
        ⓒ **옥스퍼드 쉼표를 빠뜨리면 계수가 줄어든다.** 분리자를 `,` 와 `and` 로만 두고
        `,\s*and` 를 넣지 않으면 `FIGS. 34, 35, 36, and 37` 꼴 **2종을 통째로 놓친다**
        (2026-08-31 총괄 재실측이 발주 자료의 「35회·8종」을 **37회·10종**으로 정정한 사유가
        정확히 이것이다). 실측 재현 정규식은 아래 ② 에 적었다.
        ② 나열
        중간에서 가드가 걸리면 봉투가 **거기서 끊긴다**
        (`FIGS. 15, 16, 17, 18 illustrate` → `FIGS. 15, 16, 17` 까지). 끊긴 뒤의 번호는 샌다.
        ★ **[빈도 실측 등재 — 2026-08-31 · 기록만]** 구 문언은 *"빈도는 첫 런 실측으로
        상신한다"* 였다. 위 ① 의 낱말 후행 10종과 **별개로**, 낱말이 뒤따르지 않는 27종 중
        **3종**이 다른 사유로 샌다 — ⓐ `FIGS. **26**, **27**A, **27**B, **27**C illustrate`
        → `27` 샘 · ⓑ `FIGS. **51** and **52**B, two non-overlapping` → `52` 샘. 둘 다
        **꼬리 수 뒤에 글자가 붙은 도면 하위 번호**(`27A`·`52B`)라 글자 가드가 발동해 봉투가
        그 앞에서 끊긴 것이며, 새는 것은 도면 번호이므로 ① 과 같은 순도 손실이다.
        ⓒ `FIG. **1**, 1×32 dot products` → `1` 샘 — **이것은 결함이 아니다.** 곱셈 기호 `×`
        가드가 발동해 진짜 값 `1×32` 를 지킨 자리이며(`measurement` 절이 그 가드의 근거로 든
        바로 그 한 자리다), 봉투 밖으로 나온 `1` 은 그 진짜 값의 앞 항이다.
        **즉 원천 전체의 누수는 도면 번호 11자리이고 그 대가로 진짜 값 2자리를 지킨다.**
        실측 재현 정규식(옥스퍼드 쉼표 포함 · 마크다운 강조 대응) =
        `(?i)\b(?:figures?|figs?|tables?)\.?\s*\*{0,2}\s*\d+\b\*{0,2}(?:\s*(?:,\s*and|,|and)\s*\*{0,2}\d+\b\*{0,2})+`
        ③ ★ **첫 번호 쪽에는 같은 가드가 없다 — 재정 종결 2026-08-31: 구성 입력 한정 재현,
        실물 어형 아님.** (구 표기 = 「상신 대기」. 재정 2026-08-31 **Q2 = ⓔ** 가 이 자리를
        **「결함 아님」으로 종결**했다 — 원장 = `docs/decisions/ruling-20260831-01-Q1-Q4.md`.)
        **결함의 서술은 그대로 유효하다** — 실측(2026-08-19): 지시 바로 뒤의
        수에 소수가 오면 이 어형과 위 `figure-or-table-number` 둘 다 **정수부까지만** 봉투에
        들고, 남은 소수 조각은 겹침 때문에 **기록조차 없이** 사라진다 —
        `Table 2.5 mm of clearance` → 수확 0건 · `skipped[]` 에 `Table 2` 한 줄뿐(진짜
        `2.5 mm` 가 침묵으로 소실). 꼬리와 달리 **재량으로 고치지 않았다**: 여기서 `(?!\.\d)`
        를 달면 `FIG. 3.5` 같은 **정당한 소수 도면 번호**가 정답지에 값으로 오르고,
        `\d+(?:\.\d+)?` 로 늘리면 `Table 2.5 mm` 를 통째로 먹는다. 어느 쪽이든 **정답 집합이
        움직이므로 재정 사항이다**(재정 S2 · CLAUDE.md 규율 11).
        ★ **종결 근거 — 사전 등록 후 실행한 실측 2종**(입력과 판정 규칙을 결과 보기 전에
        고정했다). **① 원천 전수 스캔**(`runs/openai-us20260147854a1-cim-fp-3/00-source/patent.md`
        · 293,068자): 소수 도면·표 번호(`FIG. 3.5`·`Table 2.1` 꼴) **0건** · 문제 어형
        (`Table 2.5 mm` 꼴) **0건**. 대조 = `Table` 낱말 37회 · `FIG` 계열 288회 —
        **지시어는 325회인데 소수형이 하나도 없다.**
        **② 엔진 프로브**(`harvest_numeric_facts` 직접 호출 · 사전 등록 입력 10건 · 3군):
        군1 구성 재현 `Table 2.5 mm of clearance` → **침묵 소실 1건**(결함은 실재한다) ·
        군2 **자연 문장 7건** → **침묵 소실 0건**(`As shown in FIG. 2, 2.5 mm…` ·
        `Table 2 lists the 2.5 mm…` · `Referring to FIG. 3, a 0.08 mm gap…` ·
        `The results in Table 4 show 12.5 mm…` · `Tables 2 and 3 report 4.5 mm and 6.0 mm…`
        전부 값 보존. `FIG. 2.5 illustrates…` 는 값 수확 0 — 소수 도면 번호를 값으로 올리지
        않는다) · 군3 실물 대조군(M91 `between 1 and 2` · M92 `60 columns and 60 rows`) 정상.
        **사전 등록한 판정 규칙** = 군2에서 침묵 소실 ≥1이면 기계를 단다 / 0이면 종결.
        **결과 0.**
        ★ **기제** — 결함이 발동하려면 라벨과 숫자가 **붙어 있어야** 한다(`Table 2.5 mm`).
        자연스러운 특허 산문은 쉼표·동사·관사를 반드시 끼워 겹침을 끊는다. **원천 0건은 우연이
        아니라 구조적이다.**
        ★ **한계를 함께 적는다** — 군2의 자연 문장 7건은 **발주자가 지은 것**이며 실제 코퍼스가
        아니다. 가장 센 근거는 여전히 **실특허 전수 스캔 0건**이다.
        ★ **재상신의 재현 조건**(실물에서 이 어형을 만나면 즉시 상신하라) — **도면·표 지시
        라벨과 소수 수치가 사이에 아무 토큰 없이 인접**할 때다(`Table 2.5 mm` · `FIG. 3.5 mm`).
        라벨과 수 사이에 쉼표·동사·관사가 하나라도 끼면 겹침이 끊겨 이 결함은 발동하지 않는다.
        판별식 = `(?i)(?:figs?|figures?|tables?)\.?\s*\*{0,2}\d+\.\d` 가 원천에서 매치되는가.

    - id: row-column-coordinate
      tag: "[가설]"
      # ★ 봉투가 아니라 **토큰 조건 규칙**이다(2026-08-19 보수 — 형태 교체).
      #   `match:` 키가 없다는 것이 곧 그 선언이며, 선례는 같은 목록의 `figure-numeral` 이다.
      condition:
        - "소수점 없는 정수"
        - "단위 없음"
        - "그 수 **바로 앞**이 `preceding_pattern` 에 걸림(행·열 낱말이 수 앞에 온다)"
      preceding_pattern: '(?i)\b(?:rows?|columns?|cols?)\s*\*{0,2}\s*$'
      reason_label: row-column-coordinate
      basis: >-
        재정 2026-08-19 S7 (정규 선상신-승인). 실측 = 감수 C′-1 독립 재계수 **M88·M89** —
        통주 3 `[0140]` *"…e.g., in Row 0 and Col 0 of the CIM macro…"* 의 **행 좌표 `0`**
        (`value_span` 36:37)과 **열 좌표 `0`**(46:47)이 활성 `fact` 로 남아 있었다.
      why: >-
        `Row 0` · `Col 0` 은 CIM 매크로 안의 **자리**이지 값이 아니다. 도면부호 배제가 이것을
        잡지 못하는 이유는 `0` 이 `figures[].numerals` 에 없기 때문이고, 경계 기각이 잡지
        못하는 이유는 앞이 공백이라 토큰 내부가 아니기 때문이다 — 두 기존 방어 사이의 틈이다.
      form_change: >-
        ★ **이 항목은 봉투(`match: enclosing-pattern`)였고 2026-08-19 에 토큰 조건 규칙으로
        바뀌었다.** 사유는 하나 — **봉투가 진짜 값을 삼켰다.** 봉투는 낱말부터 수까지의
        **구간 전체**를 표시하고 그 구간과 겹치는 수확을 전부 버리므로, `a column 12 mm wide`
        에서 `column 12` 를 표시하는 순간 그 구간과 겹치는 `12 mm` 가 통째로 사라졌다
        (감수 C′-1·D 가 독립으로 실증: `column 12 mm` · `each column 5 mm` · `a row 60 mm`).
        이것은 재정 S7 의 **결정 근거(전수성 > 순도)와 승인 조건(배제가 진짜 값을 먹지 않는
        반례 golden 동반)을 정면으로 어긴다** — 그러므로 현행 어형은 S7 이 승인한 것이 아니고,
        좁히는 보수는 입법이 아니라 **이행 충실화**다(재정 S2 의 판별선: 값 공간을 넓히는
        판단만 재정 사항이다).
        조건 규칙은 그 손실이 원리적으로 불가능하다 — 판정 대상이 **수확 후보 하나**이고,
        `단위 없음`(`unit is None`)이 곧 `12 mm` 를 살리는 한 줄이기 때문이다.
        ★ 단위표를 이 항목에 **복제하지 않는다**. 수확기가 이미 단위를 판정하므로 조건은
        그 판정 결과를 읽을 뿐이며, 복제하면 두 벌 중 한 벌은 반드시 낡는다
        (`unit_detection.accept_why` 가 같은 자리에서 같은 이유를 든다).
      safety_rail: >-
        ★ **이 항목의 핵심 안전판 — 낱말이 수 앞에 오는 형태만 잡는다.** 수가 낱말 앞에 오는
        `60 columns and 60 rows` · `12 columns and 12 rows` 는 **개수**이고 진짜 값이다
        (감수 C′-1 이 M91·M92 를 GENUINE 으로 판정한 바로 그 자리). 어순 하나가 좌표와 개수를
        가른다. 그래서 `preceding_pattern` 은 낱말을 **선행 요건**으로만 두고 뒤따르는 낱말은
        보지 않는다 — 뒤를 막으면 `Col 0 of the CIM macro` 의 `of` 때문에 M89 를 놓친다.
        패턴이 `$` 로 끝나는 것은 "**바로 앞**"의 기계 표현이다(수확 후보 시작점 왼쪽 문자열의
        꼬리에 걸린다). `\*{0,2}` 를 남긴 것은 원천이 마크다운이라 `Row **0**` 형태가 가능하기
        때문이고(구 봉투 패턴이 이미 들고 있던 폭이다 — 폭을 줄이면 그만큼 배제가 좁아진다),
        `\.?` 를 넣지 않은 것은 `…rows. 8` 처럼 **문장이 끝난 뒤의 수**를 삼키지 않기
        위함이다(원천 실측 1건). 소수 배제(`column 12.5`)는 이제 패턴이 아니라 조건 ①
        (`소수점 없는 정수`)이 진다.
      measurement: >-
        ★ 실측으로 고른 폭이다(통주 특허 원천 **293,068 characters / 293,362 bytes** 전수 스캔 —
        구 표기 `293,068 B` 는 단위가 틀렸다, 2026-08-19 감수 실측). 구 봉투가 잡던 31구간은
        **전부** 행·열 좌표 라벨이었다 — `Col 0`·`Col 31`·`Row 0`·`Row 31`·`Col0`·`Row31`·
        `row 0`·`column 0`. 진짜 수치는 **0건**이며, 같은 문장의 `32 columns`·`32 rows` 는
        어순 덕에 한 건도 걸리지 않았다.
        ★ 형태 교체 후의 계수 차이를 숨기지 않는다 — 공백 없는 형태(`Col0`·`Row31` 등 7건)는
        이제 이 배제가 아니라 **왼쪽 경계 기각**(`boundary-left`)이 잡는다. 수확 결과는 같고
        (둘 다 정답지에 오르지 않는다) `skipped[]` 의 사유 라벨만 갈린다. 침묵이 아니라
        라벨의 이동이며, CP1 §12.3 의 사유별 계수에서 그대로 보인다.
      open_question: >-
        ★ 미결 3건. ① **좌표 나열의 꼬리**는 첫 좌표까지만 든다
        (`Col 0, Col 1, Col 2` 는 낱말이 매번 붙어 셋 다 잡히지만, `columns 0, 1, 2` 형태라면
        `columns 0` 만 잡힌다). 실물에서는 낱말이 매번 붙는 형태만 관측되었다.
        ② **낱말 범위**를 `row`·`column`·`col` 셋으로 두었다. `bank`·`bitline`·`wordline`
        처럼 같은 격의 좌표 낱말이 실물에 더 있으나 **넓히지 않았다** — 어형 확대는
        `legislation_path` 에 속하고, 실물 아티팩트를 만나면 그 실물을 상신한다.
        ③ ★ **형태 교체가 연 자리 하나 — 복합 어형은 이 조건에 걸리지 않는다.**
        `Rows 0 and 1.` 은 `set` 어형이 `0 and 1` 을 한 값으로 거두므로 조건 ①(정수)에서
        빠지고, 그 결과 좌표 `0` 이 정답지로 돌아온다(구 봉투에서는 `Rows 0` 이 배제되고
        뒤 항 `1` 이 새던 자리다 — 감수 D 가 그 잔류를 지적했다). 반례 golden `rc-0005` 의
        `hx-10` 이 이 자리를 **기대값으로 못 박아** 기록한다. 열려면 조건이 복합 어형의
        구성원까지 들여다봐야 하는데 그것은 `not_a_parser` 규율에 닿으므로 **재정 사항**이다.
        통주 3 원천에는 이 어형이 0건이었다(전수 스캔 실측 — 관측된 31구간 전부가 단일 좌표).
      absence_is_not_a_pass: >-
        `preceding_pattern` 이 사라지면 이 배제는 조용히 꺼진다. 그래서 로더는 **토큰 조건
        배제 중 선행 문맥 패턴을 든 것이 하나도 없으면 죽는다**(`reader/lib/rules.py`).
        세는 것은 개수가 아니라 존재이며(목록의 신설·폐기는 재정의 일이지 로더의 일이 아니다),
        같은 규율이 `enclosing_exclusions.required` 에 이미 서 있다.

  # -- 봉투 배제의 공통 규율 (위 `match: enclosing-pattern` 5종에 걸린다) ------
  #    `figure-numeral` 과 `row-column-coordinate` 는 봉투가 아니라 토큰 조건 규칙이므로
  #    이 절의 규율(구간 표시·겹침 해소·구간 전문 기록)에 걸리지 않는다.
  enclosing_exclusions:
    required: true
    required_why: >-
      ★ **로더가 요구하는 것은 개수가 아니라 존재다.** `match: enclosing-pattern` 항목이
      **하나도 없으면** 로드에서 죽고(`reader/lib/rules.py#_compile_harvest_envelopes`),
      특정 수를 요구하지는 않는다 — 목록의 신설·폐기는 재정의 일이지 로더의 일이며, 로더에
      수를 박으면 재정이 항목을 더할 때마다 로더가 함께 낡는다. 구 문언이 *"현재 6종이며
      그중 하나라도 없으면 로드에서 죽는다"*로 시작해 **여섯 전부가 개별로 강제되는 것처럼**
      읽혔고(2026-08-19 감수 지적), 그것은 이 리포가 반복해 벌해 온 형태 — 강제의 범위를
      실제보다 넓게 말하는 것 — 이다. 실제로 죽는 조건은 **전부 부재** 하나뿐이다.
      계수는 아래 `census` 가 **사실의 기록으로만** 든다.
      부재를 통과로 읽으면 규칙 파일에서 한 줄을 지우는 것만으로 배제가 조용히 꺼지고, 그
      순간 통주 2 가 실측한 23건이 아무 신호 없이 정답지로 돌아온다. 같은 회차의
      `bibliography.priority_window` 가 세운 선례를 그대로 따른다 — 계약의 부재는 통과가
      아니라 오류다.
    census: >-
      ★ **사실의 기록이며 강제가 아니다**(위 `required_why`). 현재 `match: enclosing-pattern`
      은 **5종**이다 — 2026-08-18 넷(`fp-format-triple` · `bit-slice` ·
      `figure-or-table-number` · `subscript-index`) + 재정 2026-08-19 S7 하나
      (`figure-or-table-number-list`). S7 이 함께 세운 `row-column-coordinate` 는 같은 날
      후속 보수로 **토큰 조건 규칙**이 되어 이 계수에서 빠졌다(그 항목의 `form_change`).
      토큰 조건 규칙은 `figure-numeral` 과 `row-column-coordinate` 2종이다.
    mechanism: >-
      **토큰 규칙이 아니라 구간 규칙**이다. 인용문에서 좌표 표현 **전체를 먼저 표시**하고,
      표시된 구간과 겹치는 수확을 배제한다. 왜 토큰 단위로 고칠 수 없는가 — `FP8 (1-5-2)` 의
      셋째 필드는 매칭이 **생성조차 되지 않는다**: 선행 부호를 포함한 `scalar` 가 `-2` 로
      잡히고 왼쪽 이웃이 숫자라 기각되므로, 토큰 규칙이 심사할 대상이 애초에 존재하지 않는다.
      닿지 않는 것을 고치려면 **먼저 표시**하는 수밖에 없다.
    not_a_parser: >-
      ★ `dependency_citation.not_a_parser` 의 규율을 그대로 잇는다 — 이 목록은 좌표를
      **해석하지 않고 있는지만 본다**. 그룹 포획도, 전개(`(1-5-2)` → 부호 1 · 지수 5 ·
      가수 2)도 붙이지 마라. 전개를 붙이는 순간 이 목록은 FP 표기법·비트 슬라이스 표기법의
      **의미론을 입법**하게 되고, 그것은 재정 없이 수확기가 자기 법을 갖는 일이다(D7).
      우리가 아는 것은 하나뿐이다 — 그 구간의 숫자들은 **값이 아니라 자리**다.
    overlap_resolution: >-
      두 봉투가 겹치면 **먼저 시작하는 것**을 남기고, 시작이 같으면 **긴 쪽**을 남긴다.
      임의 선택이 아니라 결정론이 필요해서 정한 순서다 — 집합 반복 순서에 기대면 같은 명세가
      두 번 다른 `skipped[]` 를 내고, `value.harvest-parity` 가 서는 결정론이 무너진다.
    recording: >-
      표시된 구간은 `skipped[]` 에 `{locator, token(=구간 전문), reason(=reason_label)}`
      **한 줄**로 기록한다. 구간 안의 토큰마다 한 줄씩 적지 않는 이유는
      `token_boundary.rejection_recording_scope` 와 같다 — 기록의 단위는 잃은 자리다.
    counting_note: >-
      ★ 구간 수와 잃은 수확 수는 **다르다**(통주 2 실측: 봉투 18개 ↔ 사라진 quoted 23건).
      FP 3항 표기는 봉투 1개당 수확 1건이었지만 비트 슬라이스는 봉투 1개가 2~3건을 낳았다.
      CP1 §12.3 이 두 수를 함께 보이지 않으면 "배제 18건"이 "23건이 사라진 사실"을 가린다.
    scope_limit: >-
      ★ 이 배제는 **정답지에서 빼는 일**이지 "본문이 그 수치를 써도 되는가"를 정하는 일이
      아니다. 뒤엣것은 `numeric.unreviewed-use`(CP2 게이트 러너 소관 · M4 · 아직 구현 없음 —
      `contracts/glossary.md` §2.2)의 관할이며, 여기서 흉내 내면 구현 경계가 흐려진다.

  # -- 산출 항목의 형태 -----------------------------------------------------
  value_span: >-
    quote 문자열 내부의 **문자 오프셋**(0-based, end exclusive). 단위를 인정한 경우 단위까지
    포함한다. `value_raw == quote[start:end]` 바이트 동일이 보장되어야 한다.
  label_template: "numeric value at {locator}"
  label_note: >-
    라벨은 결정론 생성이며 `_en` 슬롯이므로 한글을 쓰지 않는다(재정 R2). 수확기는 값이
    무엇을 뜻하는지 모른다 — 모르는 것을 아는 척하는 라벨을 지어내지 않는다.
  emitted_fields:
    origin: quoted
    machine_verifiable: true
    status: active
    superseded_by: null
    source: "{locator, quote, value_span}"
  id_template: "M{n}"
  id_note: >-
    `id_start` 부터 등장 순으로 발번하는 **임시 ID** 다. 최종 번호는 조립기가 다시 매긴다
    (engine/stages/read.py 의 재번호).
  emission_order: [quoted, bibliographic]
  dedupe_key: [locator, quote, value_span.start, value_span.end]
  dedupe_note: >-
    같은 인용문이 두 접지 항목에 실려도 값은 한 번만 수확한다. quote 를 키에 넣는 이유는
    같은 로케이터가 서로 다른 인용 스팬을 가질 수 있기 때문이다.
  locator_fallback: grounding-item-id
  locator_fallback_why: >-
    `spec_refs[].locator` 가 빈 문자열이면 좌표가 사라진다. 지어내지 않고 그 인용을 든
    접지 항목의 ID 를 좌표로 쓴다(어디서 왔는지는 여전히 되짚을 수 있다).

  # -- 서지 수확 -----------------------------------------------------------
  bibliographic_fields:
    - field: patent.number
      path: [number]
      expect_kind: identifier
    - field: patent.dates.priority
      path: [dates, priority]
      expect_kind: date
    - field: patent.dates.filing
      path: [dates, filing]
      expect_kind: date
    - field: patent.dates.publication
      path: [dates, publication]
      expect_kind: date
  bibliographic_label_template: "bibliographic field {field}"
  bibliographic_note: >-
    `expect_kind` 는 §4 `origin_kind_binding` 과 같은 답을 내야 한다 — origin 이 값의 종류를
    결정하므로 문법이 추측하지 않는다(순전히 숫자로 된 공개번호가 scalar 로 읽히면 정답지에
    없는 수가 하나 는다).

  # -- 실패 처리 -----------------------------------------------------------
  on_parse_failure: skip-and-record
  on_parse_failure_note: >-
    토큰이 정규식에 걸렸으나 값 문법으로 파싱되지 않으면 **수확하지 않고** `skipped[]` 에
    `{locator, token, reason}` 로 기록한다. 시끄럽게 실패하되 스테이지를 죽이지 않는다 —
    수확은 검사가 아니다. 그 목록은 `numeric_inventory.skipped` 로 CP1 에 오른다.

  # -- 대조 범위 (★ 2026-08-18 총괄 검수 결함 처분) --------------------------
  answer_scope:
    kind: fact
    origin: [quoted, bibliographic]
    status: active
    governs: [value.harvest-parity, numeric_inventory]
    basis: >-
      `contracts/l0-format.yaml` §9 `answer_sources.frozen_facts` 의 정답지 정의와 **같은 범위**다 —
      *"items[] 중 `kind == fact` && `status == active` 의 `value_normalized` + `unit`"*.
      parity 가 재는 것은 **정답지의 전수성**이므로 정답지가 보는 것과 같은 것을 봐야 한다.
    why: >-
      ★ 초판은 `status` 를 보지 않아 **철회된 항목을 정답지로 셌다**(2026-08-18 총괄 검수 실측:
      접지 밖 수치라는 이유로 정당하게 `retracted` 된 항목을 "심은 값"으로 신고했다).
      그것은 이 리포의 **append-only 규율과 정면으로 싸운다** — 항목은 지워지지 않고
      `retracted` 로 남는 것이 규율인데(`freeze.payload-immutable`·`lifecycle.no-id-loss`),
      대조가 상태를 무시하면 **규율을 지킨 명세가 반드시 실패**한다. `parse.unclassified-not-an-escape`
      의 구 기준과 **같은 형태의 모순**이었다: 규칙이 규율과 싸우는 자리.
      SPEC §2.4 가 `retracted` 를 "근거가 잘못이었음(대체물 없음)"으로 정의했으므로, 철회된
      항목이 정답지에 남아 있는 것이 결함이고 우리 검사는 그 반대를 벌하고 있었다.
    superseded_too: >-
      `superseded` 도 같은 처분이다 — 대체된 항목은 정답지가 아니다(대체물이 정답지를 진다).
      `status == "active"` 하나로 둘 다 걸리므로 조건을 따로 적지 않는다.
    contract_binding: >-
      ★ `reader/` 는 `contracts/` 를 읽지 않는다(이식 단위 — SPEC §6.2 판별식 1). 그러므로 이
      범위는 l0-format 의 **사본이 아니라 대조**로 묶인다 — 정규화 표가
      `tests/test_m1_reader.py::test_normalization_table_matches_l0_contract` 로 묶인 것과 같은
      방식이며, 두 문언의 동치를 대조하는 테스트가 **아직 없다**(테스트 레인 인계 사항).
    on_retracted_but_harvestable: >-
      접지 인용 안의 수치를 `retracted` 로 내려도 수확기는 그 값을 계속 요구하므로 **누락**으로
      잡힌다. 그것이 옳다 — 수확 대상에서 빼려면 상태를 바꿀 것이 아니라 **접지가 그 문장을
      인용하지 않아야** 한다. 상태는 정답지 소속을 정하지 수확 여부를 정하지 않는다.

  # -- 대조 키 (value.harvest-parity 의 동일성 판정) ------------------------
  parity_key:
    quoted: [origin, source.locator, source.quote, source.value_span, value_raw]
    bibliographic: [origin, bib_source.field, value_raw]
  parity_key_note: >-
    ★ 서지 수확에는 인용 스팬이 없다(스키마가 `origin == "bibliographic"` 에 `source` 를
    금지한다). 그래서 그 갈래의 좌표는 `bib_source.field` 가 대신한다 — 같은 자리를
    가리키는 다른 이름이며, 없는 스팬을 지어내지 않는다.
  identity_key: [origin, source.locator, source.quote, source.value_span]
  identity_key_note: >-
    좌표만으로 된 키. 좌표가 같은데 `value_raw` 가 다르면 그것은 누락+추가가 아니라
    **변조**이며, 그 구별이 있어야 결함 보고가 "무엇이 바뀌었는가"를 말할 수 있다.

  rules:
    - id: value.harvest-parity
      rule: >-
        명세의 `origin ∈ {quoted, bibliographic}` fact 집합의 `parity_key` 튜플 집합이,
        같은 명세로 수확기를 다시 돌려 얻은 집합과 **정확히 일치**해야 한다.
        불일치 3종(누락·추가·변조)을 각각 별도 결함으로 낸다.
      why: >-
        "수확 누락은 회귀 변조본(숫자 심은 판)으로 상시 테스트"(재정 P-B)의 상시 집행자다.
        전수라는 말이 이름뿐이 되지 않게 하는 유일한 장치이며, 레인이 원문 스팬 수치를
        손으로 만들어 넣는 경로도 이 대조가 함께 막는다.
    - id: value.origin-ownership
      rule: >-
        `origin ∈ {quoted, bibliographic}` 는 **수확기 소유**, `origin ∈ {derived,
        figure-sourced}` 는 레인 소유다.
      enforcement: >-
        별도 규칙을 두지 않는다 — 레인 산출에 `quoted`·`bibliographic` 이 섞이면
        `value.harvest-parity` 가 "추가"로 자동 검출한다. 같은 사실을 두 규칙이 판정하면
        어느 검사가 그 결함을 지키는지 확정할 수 없어진다.

  open_question: >-
    ★ 남은 미결 2건(① 은 1차 상신이 처분되어 **범위가 좁아진 채로** 남는다).
    ① **단위 어휘** — 구 미결: 현행 `UNIT_ALIASES` 4항으로는 실물 특허의 단위 대부분이
    인정되지 않아 수치가 단위 없는 스칼라로 수확된다. 이 항목이 지정한 경로(l0-format 과 함께
    가는 입법)대로 **상신이 이루어졌고 재정 2026-08-19 Q4 가 `b`(bits) 하나만 승인**했다 —
    `contracts/l0-format.yaml` §9 rank 9 의 단위 대안 목록이 같은 회차에 함께 움직였다.
    **하지 않은 것 둘을 명기한다**: 철자형 `bit`·`bits` 의 인식 어휘 편입과 `UNIT_ALIASES`
    (정규화 표) 확장. 재정 문언이 `b` 하나만 말했고 정규화 매핑 신설은 별개의 입법이기
    때문이며(둘의 역할 구분 = `unit_detection.accept_why`), 다음 실물 상신의 대상으로 남긴다 —
    근거 자료는 여전히 같다(런의 무단위 수확 비율). ② **접지 밖 수치** —
    어떤 접지 인용에도 담기지 않은 수치는 구조상 수확되지 않는다. 그것이 "전수"의 정확한
    범위(접지 스팬 전수)이며, 접지 범위 자체가 좁으면 수확도 함께 좁아진다는 사실을
    CP1 이 드러내야 하는지(= 접지 커버리지와 수확 총량의 병기)가 미결이다.

