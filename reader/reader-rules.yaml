# 7. 서지 확장 대조 — 목록형 서지가 서지면에서 결정론 복사되었는가
#    처분 대상: M0.6 재감수 M-05(서지 구조의 빈곤) / C18 최우선일 요건
#    편입 근거: Owner 재정 2026-08-18 P-2 ⓐ
#    ★ 2026-08-18 증축 — sol 독립 감수 P-2 ⓐ 부분 판정(우선권 **관할** 미대조)의 처분으로
#      근접 대조 2종(`bib.priority-jurisdiction-in-source`·`bib.priority-year-in-source`)을
#      더했다. 규칙 7종 → 9종.
# ===========================================================================
bibliography:
  tag: "[가설]"
  source_of_law: "Owner 재정 2026-08-18 P-2 ⓐ — 서지 확장 6종은 전부 서지면에서 결정론 복사."
  enforced_by: read.bibliography
  implemented_by: reader/lib/bibliography.py
  purpose: >-
    스키마는 형태만 닫는다 — `^[A-Z]{2}$` 를 만족하는 관할 코드는 무한히 지어낼 수 있고,
    발명자 이름 목록은 문자열이기만 하면 통과한다. "결정론 복사"가 검사 없이 남으면
    그것은 **자유 기입**이다. 이 검사가 그 말을 사실로 만든다.
  scope_note: >-
    검사 대상은 서지 확장분과 그 정합뿐이다. `number`·`title`·`assignee` 등 구 필드는
    이 검사의 관할이 아니다(각각 다른 자리에서 다뤄진다).

  # 원천 바이트 정확 부분문자열 대조의 대상.
  source_substring_targets:
    - patent.inventors[]
    - patent.applicants[]
    - patent.classifications.ipc[]
    - patent.classifications.cpc[]
    - patent.priority_claims[].number
  dates_excluded_from_source_match: true
  dates_excluded_why: >-
    ★ `dates.*` 와 `priority_claims[].date` 는 **정규화 값**(`YYYY-MM-DD`)이다. 서지면의
    표기는 `March 11, 2024`·`2024/03/11`·`11.03.2024` 등 발행 기관마다 다르며, 정규화된
    문자열이 원천에 그대로 나타날 이유가 없다. 그런 값에 부분문자열 대조를 걸면 정직한
    복사가 실패하고, 그 실패를 피하려면 정규화를 포기해야 한다 — 그래서 날짜는 대조에서
    빼고, 대신 **날짜들 사이의 관계**(최우선일 = 우선권 목록의 최소값)를 본다.
    "원천에 있는가"를 못 보는 자리에서 "서로 맞는가"를 보는 것이 이 검사의 형태다.

    ★ **범위 정정(2026-08-18 — sol 독립 감수 P-2 ⓐ 부분 판정의 처분).** 위 문언은 지우지
    않는다. 날짜 **전체**를 대조에서 빼는 근거는 그대로 유효하며, 정정되는 것은 그 **범위**뿐이다
    — **연 4자리는 예외다.** `March 11, 2024`·`2024/03/11`·`11.03.2024`·`20240311` 어느
    표기에서도 `2024` 네 글자는 그대로 나타나므로, 연도에 한해서는 "정규화 값이라 원천에
    없다"가 성립하지 않는다. 실측이 그것을 확인했다 —
    `runs/openai-us20260147854a1-cim-fp-2/00-source/patent.md` 39~42행의
    `us-provisional-application US [63724151 20241122](tel:63724151 20241122)` 는 **관할
    코드도 연도도 우선권 번호 바로 곁에** 담고 있다. 그 자리에 서는 규칙이
    `bib.priority-year-in-source` 이고, 같은 실측이 `bib.priority-jurisdiction-in-source`
    의 근거이기도 하다.

  # 우선권 근접 대조의 창(문자 수) — `bib.priority-jurisdiction-in-source` ·
  # `bib.priority-year-in-source` 가 쓰는 유일한 수치.
  #
  # ★ 이 값을 **이 파일이 소유한다.** 코드는 읽기만 하며, 키가 없거나 정수가 아니면 검사는
  #   통과가 아니라 입력 오류로 죽는다 — 코드에 기본값을 두면 창 폭이 조용히 코드로 이주하고,
  #   그것이 B-04 가 적발한 "계약 어디에도 없는 수로 판정한" 형태다.
  priority_window:
    tag: "[가설]"
    before: 32
    after: 32
    include_number_span: true
    match_any_occurrence: true
    why: >-
      ★ **근접성이 이 검사의 전부다.** 관할 코드를 원천 전역에서 찾으면 검사가 공허해진다 —
      `US`·`KR` 두 글자는 긴 명세서 어딘가에 반드시 나타나므로 어떤 코드로 바꿔도 통과한다.
      그래서 대조 범위를 **그 우선권 번호가 나타나는 자리 둘레**로 좁힌다.
    width_basis: >-
      실측 2건에서 필요한 폭(2026-08-18). ① 실특허
      `runs/openai-us20260147854a1-cim-fp-2/00-source/patent.md` 39~42행 — 관할 코드는 번호
      시작의 **4자 앞**(`US [`), 연도는 번호 끝의 **5자 뒤**(` 2024…`). ② 픽스처
      `tests/fixtures/reader/base/patent.md` — 관할은 번호 끝의 **1자 뒤**(` (XX,`), 연도는
      번호 문자열 **안**. 32 는 관측 최대 필요폭의 6배 이상 여유다. 상한 쪽 근거는 실특허
      우선권 행의 길이(약 75자)다 — 32/32 창은 이웃 우선권 기록을 통째로 삼키지 못하므로,
      옆 행의 관할·연도를 빌려 통과하는 경로가 열리지 않는다.
    include_number_span_why: >-
      창은 번호 문자열 자체를 포함한다. `XX-2024-000101`·`KR10-2024-0000001` 처럼 관할
      코드와 연도가 **번호 안에** 실리는 표기가 실재하며, 그것도 정직한 복사의 증거다.
    match_any_occurrence_why: >-
      번호가 원천에 여러 번 나타나면 **어느 한 자리에서라도** 창 안에 있으면 통과다. 실특허
      원천은 마크다운 `tel:` 링크 때문에 같은 번호가 링크 텍스트와 href 에 두 번 나오고,
      두 번째 자리에서는 관할 코드가 창 밖으로 밀린다. "모든 출현 자리에서"를 요구하면
      마크다운 변환의 부산물이 정직한 복사를 벌하게 된다.

  rules:
    - id: bib.jurisdiction-prefix
      rule: "`patent.number` 가 `patent.jurisdiction` 으로 시작한다."
      why: "관할이 번호와 어긋나면 둘 중 하나는 다른 문서의 것이다."
    - id: bib.kind-code-suffix
      rule: "`patent.number` 가 `patent.kind_code` 로 끝난다."
      why: >-
        종별이 서지면에 따로 있는데도 번호 문자열 안에만 묻혀 있으면 "이것이 공개공보인가
        등록공보인가"를 기계가 답할 수 없다. 두 자리가 서로를 증명한다.
    - id: bib.inventors-in-source
      rule: "각 `patent.inventors[]` 문자열이 원천의 **바이트 정확 부분문자열**이다."
    - id: bib.applicants-in-source
      rule: "각 `patent.applicants[]` 문자열이 원천의 바이트 정확 부분문자열이다."
    - id: bib.classification-in-source
      rule: "각 `patent.classifications.ipc[]`·`cpc[]` 코드가 원천의 바이트 정확 부분문자열이다."
    - id: bib.priority-number-in-source
      rule: "각 `patent.priority_claims[].number` 가 원천의 바이트 정확 부분문자열이다."
    - id: bib.priority-jurisdiction-in-source
      tag: "[가설]"
      rule: >-
        각 `patent.priority_claims[].jurisdiction` 코드가 **그 주장의 `number` 가 나타나는
        자리의 창**(`priority_window`) 안에 바이트 정확 부분문자열로 존재한다.
      why: >-
        ★ 감수가 실측으로 뚫은 자리다(2026-08-18 sol 독립 감수 P-2 ⓐ). 우선권 관할을 **전부
        `KR` 로 바꿔도** 검사는 `pass`·`checked=16` 이었다 — 스키마는 `^[A-Z]{2}$` 형태만
        보고, 상위 `bib.jurisdiction-prefix` 는 `patent.jurisdiction` 만 보며, 우선권 목록의
        관할은 아무도 보지 않았다. 어느 나라에 무엇을 걸었는가는 우선권 주장의 절반이므로,
        그 절반이 자유 기입으로 남으면 목록이 있다는 사실만 남는다.
      abstains_when: >-
        `number` 가 원천에 없으면 **판정하지 않는다**. 그 결함은
        `bib.priority-number-in-source` 의 관할이며, 한 결함을 두 규칙이 판정하면 어느 검사가
        그것을 지키는지 확정할 수 없어진다(`value.origin-ownership` 이 이미 내린 판단과 같다).
      vacuity_note: "`priority_claims` 가 비거나 번호가 전건 원천 밖이면 대상 0건이며 그 사실은 checked 에 드러난다."
    - id: bib.priority-year-in-source
      tag: "[가설]"
      rule: >-
        각 `patent.priority_claims[].date` 의 **연 4자리**가 위와 **같은 창** 안에 바이트 정확
        부분문자열로 존재한다. 대조 대상은 연도뿐이며 월·일은 보지 않는다.
      why: >-
        `dates_excluded_why` 의 범위 정정이 여는 자리다. 날짜 전체는 정규화 값이라 원천 표기와
        다르지만 **연 4자리는 모든 표기 형식에서 그대로**이므로, 연도만은 원천에 있는지 물을 수
        있다. 이 규칙이 없으면 **두 날짜를 정합적으로 함께 위조하는 경로**가 열린다 —
        `priority_claims[].date` 와 `dates.priority` 를 나란히 `1900-01-01` 로 바꾸면
        `bib.earliest-priority` 는 등식이 서므로 통과한다(2026-08-18 실측). 관계만 보는 검사는
        관계를 지킨 거짓을 막지 못한다.
      abstains_when: "위와 같다 — `number` 가 원천에 없으면 판정하지 않는다."
      vacuity_note: "위와 같다."
    - id: bib.earliest-priority
      rule: >-
        `priority_claims` 가 비어 있지 않으면 `dates.priority == min(priority_claims[].date)`.
      why: >-
        C18(최우선일의 정확성)이 요구하는 유일한 기계 판정이다. 우선권 목록 없이는 검증조차
        성립하지 않았고, 목록이 생긴 지금 이 등식이 서지 않으면 목록과 날짜 중 하나가 틀렸다.
      vacuity_note: "`priority_claims` 가 비면 이 규칙의 대상이 0건이며 그 사실은 checked 에 드러난다."

  # 대조 없이 정규화 없이 — 검사 1 과 같은 규율.
  comparison: byte-exact-substring
  comparison_note: >-
    공백 접힘·대소문자 무시 같은 "친절한" 정규화를 넣지 않는다(SPEC §2.6 검사 1 보조 규정).
    NBSP 가 섞인 원천에서 이름을 눈으로 옮겨 적으면 반드시 실패하며 그 실패가 정상 동작이다.

  open_question: >-
    ★ 재정 대기 2건. ① **발명자 표기의 재배열** — 서지면이 `SMITH, John` 으로 적고 명세가
    `John Smith` 로 적는 형태가 실재한다. 지금은 실패이며(정직한 복사가 아니므로) 그것이
    옳지만, 원천 정본 생성 규약이 어느 표기를 싣는지에 따라 전건 실패가 될 수 있다.
    ② **분류 코드의 공백** — `H01L 23/34` 처럼 그룹 사이에 공백이 있는 표기와 없는 표기가
    갈린다. 정본 형태의 선택은 §4 `unsupported_forms` 의 식별자 규정과 같은 뿌리이며,
    첫 런의 실물 서지면과 함께 상신한다.

    ★ 우선권 근접 대조(2026-08-18 신설 2종)의 미결 4건을 여기 함께 적는다. **어형도 창 폭도
    실물 없이 넓히지 않는다** — 아래는 넓힐 근거가 생길 때까지 열어 두는 목록이다.
    ③ **실측 근거가 실특허 1건뿐이다.** 창 폭 32/32 와 "관할·연도가 번호 곁에 있다"는 관찰은
    `US20260147854A1` 한 건과 픽스처 1건에서 나왔다. 두 번째 실특허가 들어오는 즉시 그
    서지면의 우선권 행에서 필요 폭을 다시 재고, 32 가 모자라면 **값을 이 파일에서** 올린다.
    ④ **외국 우선권이 코드가 아니라 국명으로 적히는 서지면.** `(JP)` 대신 `Japan` ·
    `United States` 로 적는 형식이 실재한다. 그 판에서 `bib.priority-jurisdiction-in-source`
    는 정직한 복사를 실패시킨다. 국명 → 코드 대응표를 두는 것은 이 검사에 **번역**을
    들이는 일이므로(대조가 아니다) 재정 없이는 하지 않는다.
    ⑤ **연호 표기의 연도.** 일본 원호(`令和6年`)·중화민국력 등은 서기 4자리를 담지 않는다.
    그 판에서 `bib.priority-year-in-source` 도 정직한 복사를 실패시키며, 처방은 ④ 와 같은
    성질의 재정 사항이다(환산은 대조가 아니다).
    ⑥ **같은 번호를 든 우선권 주장이 둘 이상일 때.** 두 규칙은 번호가 나타나는 자리를 기준으로
    보므로, 두 주장이 같은 번호를 들면 창 증거를 주장별로 나눌 수 없다. 실물에서 그런 목록은
    그 자체가 결함일 가능성이 크지만(같은 출원에 두 번 우선권을 걸 수 없다), 어느 규칙이 그
    중복을 잡을지는 아직 정해지지 않았다.
