# 독해층 규칙 계약 (reader-rules/v0)
#
# 지위 — 이 파일은 **이식 단위(`reader/`)에 속하는 계약**이다(재정 2026-08-18 N8 ①).
#   historian 이 재료 명세를 해석하려면 이 규칙이 함께 있어야 한다: 청구항을 어디서 끊는가,
#   종속 인용을 어떻게 읽는가, 항목의 생애가 어떻게 흐르는가, 수치 문자열을 어떤 타입으로
#   읽는가. 넷 다 "특허를 읽는 일"이며 출력 채널(X 스레드)을 모른다.
#
# 왜 코드가 아니라 데이터인가 — 두 근거가 겹친다.
#   ① D7: 판정 규칙의 입법은 재정 사항이다. 규칙이 코드에 박히면 재정 없이 조용히 바뀌고,
#      그 순간 검사가 자기 입법이 된다. 파일로 두면 diff 가 곧 개정 이력이다.
#   ② SPEC §4.8 자기매칭 격리 요건 2항: 탐지 패턴은 코드에서 분리한다.
#
# 출처 태그 — `contracts/format-parameters.yaml` 과 같은 3종 체계를 쓴다(재정 N-D11).
#   `[물리]`  대상 자체가 강제하는 값. 우리 판단의 여지가 없다.
#   `[전승]`  이미 재정·스펙 문언으로 내려온 규칙. 여기서는 전사일 뿐이다.
#   `[가설]`  총괄이 잠정 정의한 규칙. **재정 대기이며 환류 검증 1순위다.**
#
# ★ `[가설]` 항목의 성격(재정 N14 조건 ①의 이행 방식) — 재정 N14 는 청구항 인벤토리·payload
#   불변성·재료 수치 문법을 M1 요구사항으로 편입하라고 명했으나, 그 **세부 규칙까지 정하지는
#   않았다**. SPEC §9.26 은 "파싱 규칙 없이 검사만 만들면 그 검사가 곧 자기 입법이 된다"고
#   경고한다. 그 경고를 지키는 방법은 검사를 만들지 않는 것이 아니라(N14 가 만들라고 했다)
#   **규칙을 재정 가능한 형태로 밖에 내놓는 것**이다. 아래 `[가설]` 블록이 그 형태이며,
#   각각 `open_question` 을 달아 무엇이 미결인지 밝힌다.

schema: reader-rules/v0
version: "0"
reader_version_introduced: "0.4.0"

meta:
  basis: >-
    헌장 D5(독해론 5단계)·D6 규율 ③(결정론의 위치)·D7(입법은 재정) +
    Owner 재정 2026-08-17 R1 · 2026-08-18 N9 · N14 · N15 +
    M0.6 재감수 M-07(인벤토리·구조 수렴)·M-08(payload 불변)·M-09(수치 문법) 처분.
  consumed_by:
    - reader/lib/inventory.py
    - reader/lib/dependency_parse.py
    - reader/lib/freeze_integrity.py
    - reader/lib/value_grammar.py
    - reader/lib/convergence.py
    - reader/lib/harvest.py          # 재정 P-B (전수 수치 수확)
    - reader/lib/bibliography.py     # 재정 P-2 ⓐ (서지 확장 대조)
    - reader/lib/derivation.py       # value.harvest-parity
  not_consumed_by: >-
    engine/** 은 이 파일을 직접 읽지 않는다. 독해층 검사는 전부 reader/lib 을 거친다 —
    구현 이중화가 생기면 두 벌 중 하나는 반드시 낡는다(SPEC §8.4 M1).

# ===========================================================================
# 1. 청구항 인벤토리 — 원천에서 청구항 목록을 뽑는 규칙
#    처분 대상: M0 M12 / M0.6 재감수 M-07 / SPEC §9.26 (인벤토리 축)
#    편입 근거: 재정 N14 ①
# ===========================================================================
claim_inventory:
  tag: "[가설]"
  purpose: >-
    "전 청구항 분해"(D5 ①)가 실제로 전량인지 확인하려면 원천 쪽 정답 목록이 있어야 한다.
    현행 커버리지 검사는 **등재된 것들 사이의** 접지만 보므로, 청구항 하나가 통째로 빠져도
    남은 것들이 서로 잘 접지되어 있으면 통과한다(SPEC §9.26).
  enforced_by: read.claim-inventory

  # 청구항 구간의 경계. 원천 정본 생성 규약(SPEC §1.3)이 이 형태를 보장한다.
  section:
    # 시작 = 아래 정규식 중 하나에 매칭되는 마크다운 헤더 행.
    headings:
      - '^#{1,6}\s+Claims?\s*$'
      - '^#{1,6}\s+What is claimed is\s*:?\s*$'
      - '^#{1,6}\s+CLAIMS?\s*$'
    # 끝 = 같거나 더 높은 수준의 다음 헤더, 또는 파일 끝.
    ends_at: next-heading-of-same-or-higher-level
    # 구간을 찾지 못하면 통과가 아니라 **입력 오류**다(exit 2 계열).
    on_missing: environment-error

  # 한 청구항의 시작을 알리는 행. 번호를 감싼 마크다운 강조(`**1**.`)를 허용한다 —
  # USPTO 전문을 마크다운으로 변환한 원천에서 실제로 쓰이는 형태다(2026-08-18 실측).
  claim_start: '^[ \t]*(?:\*\*|__)?(?P<number>[0-9]+)(?:\*\*|__)?[ \t]*[.)][ \t]+(?P<head>\S)'
  # 청구항 본문 = 시작 행부터 다음 시작 행 직전까지(구간 끝 포함).
  body_extent: until-next-claim-start-or-section-end
  # 본문 끝의 공백·마크다운 하드브레이크(줄 끝 두 칸·NBSP)는 구간 경계 계산에서만 무시한다.
  # `text_verbatim` 대조는 잘라내기 **전** 원문 바이트로 한다 — 검사 1 의 바이트 정확성이
  # 여기서 느슨해지면 그 아래 전부가 느슨해진다.
  trailing_trim_scope: boundary-only

  # ★ 실측 함정 (2026-08-18, US20260147854A1 원문에서 확인).
  observed_hazards:
    - hazard: "청구항 구간 **직전**에 청구항처럼 생긴 `Clause N:` 블록이 60여 개 있다."
      why_we_survive: >-
        구간을 헤더(`### Claims`)로 먼저 자르고 그 **안에서만** `claim_start` 를 찾기 때문이다.
        "파일에서 첫 번호 목록을 찾는다"는 구현이었다면 통째로 오인했을 자리다.
    - hazard: "원천 마지막 줄에 개행이 없다(마지막 청구항이 미종단)."
      why_we_survive: "`body_extent` 의 끝은 개행이 아니라 구간 끝이다."
    - hazard: "NBSP(U+00A0)가 공백처럼 보이는 자리에 1,700회 넘게 섞여 있다."
      why_we_survive: >-
        검사 1 은 정규화 없이 바이트 비교한다(SPEC §2.6 검사 1 보조 규정). 인용을 눈으로 옮겨
        적으면 반드시 실패하며, **그 실패가 정상 동작이다** — 관대한 정규화를 넣는 순간
        검사가 반증할 수 있는 대상이 줄어든다.

  # 취소·삭제 청구항. 인벤토리에는 오르되 등재 의무에서 면제된다.
  canceled_body: '^\s*[\(\[]?\s*(?:[Cc]anceled|[Cc]ancelled|[Dd]eleted)(?:\s*[-–—]\s*.*)?\s*[\)\]]?\s*[.]?\s*$'

  # 판정 규칙 (전부 필수 실패 조건).
  rules:
    - id: inventory.non-empty
      rule: "파싱된 청구항 수가 0이면 실패한다."
      why: >-
        대상이 0건이면 아래 대조가 전부 공허하게 통과한다. 공허 통과는 통과가 아니다
        (재정 N5 — 공허 2종 자동 가시화). 청구항 없는 특허는 원천 결함이므로 escalate 다.
    - id: inventory.unique-numbers
      rule: "같은 번호가 두 번 시작하면 실패한다."
    - id: inventory.ascending
      rule: "청구항 번호는 등장 순서대로 **증가**해야 한다(건너뜀은 허용, 되돌아감은 실패)."
      why: "번호가 되돌아가면 구간 분할이 틀렸다는 뜻이지 특허가 그런 것이 아니다."
    - id: inventory.registered-superset
      rule: "취소 청구항을 제외한 모든 원천 청구항 번호가 `claims` 에 `CL-<n>` 으로 등재되어야 한다."
    - id: inventory.no-phantom
      rule: "`claims` 에 등재된 모든 `CL-<n>` 이 원천 인벤토리에 존재해야 한다."
    - id: inventory.type-agrees
      rule: >-
        원천 청구항 본문을 `dependency_citation` 규칙으로 읽어 인용 청구항이 검출되면
        그 번호는 `dependents[]` 에, 검출되지 않으면 `independent[]` 에 등재되어야 한다.
      why: "독립/종속 분류가 원천과 어긋나면 트리의 뿌리 자체가 틀린다."
    - id: inventory.text-in-own-claim
      rule: >-
        각 청구항의 `text_verbatim` 은 **그 청구항 본문 구간 안의** 바이트 정확 부분문자열이어야
        한다(파일 전체가 아니라 자기 구간).
      why: >-
        일반 verbatim 검사(검사 1)는 파일 전체에서 찾으므로, CL-5 의 전문 자리에 CL-7 의 문장을
        적어도 통과한다. 구간 한정이 그 교차 오염을 막는다.

  open_question: >-
    ★ 재정 대기. 위 규칙은 총괄이 잠정 정의한 것이며 재정 N14 는 "인벤토리 검증을 구현하라"까지만
    정했다. 미결 3건 — ① 마크다운 헤더가 아닌 원천 형식(평문 `CLAIMS`, `What is claimed is:` 뒤
    개행 없음)을 어디까지 받아들이는가 ② 한 줄에 두 청구항이 이어 붙은 원천의 처리 ③ 다항
    번호 표기(`1a.`·`1-1.`)의 정규화. 셋 다 `read.claim-inventory` 의 통과 여부를 바꾸고 그 검사는
    런을 중단시키므로, 첫 런 전에 실물 원천과 함께 상신한다. 그 전까지는 위 규칙으로 읽되
    **파싱 불능은 침묵 통과가 아니라 환경 오류**로 낸다.

# ===========================================================================
# 1-b. 도면 캡션 — 3중 접지의 세 번째 축(도면부호)이 서는 자리
#    처분 대상: M1 실특허 스모크 실측(합성 픽스처가 가린 실물 표기 변이)
# ===========================================================================
figure_captions:
  tag: "[가설]"
  purpose: >-
    D5 ③ 3중 접지는 "구성요소 ↔ 명세서 문단 ↔ **도면부호**" 셋을 요구한다. 캡션을 찾지
    못하면 접지 레인이 볼 도면이 없고, 그러면 전 구성요소가 `not-depicted` 로 신고된다 —
    **도면이 64장 있는 특허에서 그것은 거짓 예외**다. 예외를 날조하지 않는다는 재정 R3의
    규율은 예외를 **과소 신고**하지 않는 것만큼 **과대 신고**하지 않는 것도 뜻한다.
  enforced_by: "engine/read_view.py (레인 슬라이스). 검사가 아니라 입력 준비의 규칙이다."

  # 캡션 행을 찾는 패턴. 실물 공개공보는 아래 셋이 겹친다.
  #   ① 행 머리에 문단 로케이터가 붙는다        — `[0019] FIG. 1 illustrates …`
  #   ② 강조가 **번호만** 감싼다                — `FIG. **1**`
  #   ③ 복수형과 범위 표기가 쓰인다             — `FIGS. **7**-**8** illustrate …`
  # 구 구현은 `^(?:\*\*)?FIG…` 로 **행 머리의 FIG** 와 **전체를 감싼 강조**만 보았고,
  # 셋 중 어느 것도 실물과 맞지 않아 64장짜리 특허에서 캡션 0건을 냈다(2026-08-18 실측).
  caption_line: '^(?:\[(?P<locator>[0-9]{3,6})\]\s*)?(?P<label>FIGS?(?:URES?)?)[.]?\s*(?P<numbers>(?:\*\*)?[0-9]+[A-Za-z]?(?:\*\*)?(?:\s*(?:-|–|—|and|to)\s*(?:\*\*)?[0-9]+[A-Za-z]?(?:\*\*)?)*)'
  # ★ 재정 2026-08-31 T7 — 대소문자 무시로 집행한다.
  #   원장 = docs/decisions/ruling-20260831-06-T7.md · 상신 = docs/decisions/D-20260831-03-wo-preflight.md
  #   계기: WO2026-128750(PCT 공보)이 `Figure N` 을 110회 쓰는데 위 어형은 대문자만 적혀 있어
  #   캡션 적중이 **0** 이었다(대조군 US20260147854A1 = 77). 도면 21개가 실재하는데 전 구성요소가
  #   `not-depicted` 로 신고되는 상태이며, 그것이 이 블록 purpose 가 경고한 **거짓 예외**다.
  #   ★ 이것은 어형의 신설이 아니라 **폭의 정렬**이다 — 같은 파일의
  #   numeric_harvest.exclusions#figure-or-table-number 는 `(?i)(?:figures?|figs?|tables?)` 로
  #   이미 그 어형을 알고 있었다. 두 규칙이 같은 단어를 두고 서로 다른 폭을 보던 자리다.
  #   반례 golden = ledgers/regression/golden/rc-0006-figure-caption-case-counterexamples
  case_insensitive: true
  # 캡션 번호에서 도면 id 를 만들 때 강조 표기를 벗긴다.
  number_strip: '\*\*'
  # 번호 사이의 연결어·구분자를 하이픈 하나로 정규화한다.
  # ★ 2026-08-18 실측 적발. `caption_line` 은 `FIGS. 7 and 8` 을 캡션으로 받는데, 그 번호를
  #   그대로 id 로 쓰면 `FIG-7 and 8` 이 되어 스키마의 figure_id 패턴
  #   `^FIG-[A-Za-z0-9-]+$` 을 **통과하지 못한다** — 캡션을 인식하는 규칙과 그 캡션에
  #   id 를 주는 규칙이 서로 다른 문자 집합을 전제한 계약 불일치였다. 접지 레인이 이
  #   2건(`FIG-7 and 8`·`FIG-17 and 18`)을 쓸 수 없어 회피하고 보고했다.
  #   부수 효과로 `FIGS. 7-8` 과 `FIGS. 7 and 8` 이 같은 id 로 접힌다 — 같은 도면 묶음을
  #   원천이 두 표기로 부르는 것이므로 접히는 편이 옳다.
  id_separator: '\s*(?:and|to|-|–|—)\s*'
  id_separator_replacement: '-'
  # 범위·열거 표기를 개별 도면으로 전개할 것인가 — **하지 않는다**.
  range_expansion: false
  range_expansion_why: >-
    `FIGS. 7-8` 이 도면 둘을 가리키는지 한 쌍을 가리키는지는 캡션 문언만으로 판정되지 않으며,
    전개 여부는 전시물 후보 산정식(`contracts/stages/source.yaml#exhibit_candidates`)의 미결
    3논점과 같은 뿌리다. 지금은 **캡션 행을 있는 그대로 넘기고** 도면 id 배정은 하류가 한다 —
    세지 않고 보여 준다.
  open_question: >-
    ★ 재정 대기. 위 패턴은 실물 1건(US20260147854A1)의 표기를 보고 잡은 것이며, 다른 발행
    기관·다른 변환 도구의 표기는 실측되지 않았다. 캡션을 **하나도 찾지 못한 경우**를 조용한
    0건으로 두지 말고 상신 대상으로 삼을지(= 새 검사 `source.figure-captions` 의 신설)가
    미결이며, 그 신설은 런을 중단시키는 관문의 추가이므로 재정 사항이다.

# ===========================================================================
# 2. 종속 인용 파싱 — SPEC §2.3 의 5종 어형 (전사)
#    편입 근거: 재정 2026-08-17 R1. 여기서는 코드 밖으로 옮긴 것뿐이다.
# ===========================================================================
dependency_citation:
  tag: "[전승]"
  source_of_law: "docs/SPEC.md §2.3 — 자기 검증 = read.dependency-parse"
  enforced_by: read.dependency-parse
  case_insensitive: true

  # 우선순위 순으로 시도한다. 먼저 매칭된 구간은 소비하고 다음 규칙은 남은 구간만 본다
  # (`claims 1 to 3` 이 `claim 1` 로 부서지지 않게 하는 유일한 장치다 — 긴 어형 우선).
  forms:
    - rank: 1
      id: range
      spec_rule: 4
      pattern: '\bany\s+(?:one\s+)?of\s+claims?\s+(?P<lo>\d+)\s*(?:-|–|—|to|through)\s*(?P<hi>\d+)'
      expands: "lo..hi 전 정수"
      implies_type: multiple-or
    - rank: 2
      id: bare-range
      spec_rule: 4
      pattern: '\bclaims\s+(?P<lo>\d+)\s*(?:-|–|—|to|through)\s*(?P<hi>\d+)'
      expands: "lo..hi 전 정수"
      implies_type: multiple-or
    - rank: 3
      id: or-list
      spec_rule: 3
      pattern: '\bclaims?\s+(?P<nums>\d+(?:\s*(?:,|,?\s*or)\s*(?:claim\s+)?\d+)+)'
      requires_literal: "or"
      expands: "nums 안의 전 정수"
      implies_type: multiple-or
    - rank: 4
      id: and-list
      spec_rule: 2
      pattern: '\bclaims?\s+(?P<nums>\d+(?:\s*(?:,|,?\s*and)\s*(?:claim\s+)?\d+)+)'
      requires_literal: "and"
      expands: "nums 안의 전 정수"
      implies_type: multiple-and
    - rank: 5
      id: single
      spec_rule: 1
      pattern: '\bclaims?\s+(?P<n>\d+)'
      expands: "n"
      implies_type: single

  rules:
    - id: parse.set-equals
      rule: "파싱 집합 == `depends_on` 집합(순서 무시). 불일치 = 실패."
      scope: "`dependency_type != \"unclassified\"` 인 종속항(재정 P-1)."
    - id: parse.type-agrees
      rule: "어형이 함의하는 `dependency_type` 과 선언값이 다르면 실패."
      scope: "`dependency_type != \"unclassified\"` 인 종속항(재정 P-1)."
    - id: parse.no-silent-pass
      rule: "5규칙 어디에도 매칭되지 않으면(파싱 불능) **실패**하고 결함 메시지에 원문을 첨부한다."
      scope: "`dependency_type != \"unclassified\"` 인 종속항(재정 P-1)."
    - id: parse.unclassified-excluded
      rule: >-
        `dependency_type == "unclassified"` 인 종속항은 위 세 판정의 대상에서 제외하고,
        판정 행의 `checked` 에서도 빼며, 미분류 목록(`extras.unclassified`)에 등재한다.
      why: >-
        미분류는 결함 신고가 아니라 **구조를 읽지 못했다는 표지**다. 판정 대상에 남기면
        읽을 규칙이 없는 구조가 매번 실패로 계상되어, 실제 결함과 규칙의 공백이 같은
        모양이 된다. 계수에서 빼되 목록에서는 빼지 않는 것이 그 둘을 가른다(재정 P-1).
    - id: parse.unclassified-not-an-escape
      rule: >-
        `dependency_type == "unclassified"` 인데 그 청구항의 `text_verbatim` 에
        **구조 표지 어형이 하나도 없으면** 실패한다(어형 목록 = `unclassified.structure_markers`).
      why: >-
        표지가 판정 면제를 주므로, 그 면제가 무조건이면 어려운 종속항 전부를 `unclassified`
        로 적어 검사를 통과하는 경로가 열린다. 미분류는 규칙이 못 읽는 구조를 위한 것이지
        읽기 귀찮은 구조를 위한 것이 아니다(재정 P-1).
      superseded_criterion: >-
        ★ 구 판정 기준 **폐기**(2026-08-18 총괄 정정). 구 문언은 "5종 어형으로 파싱이 되고
        그 집합이 `depends_on` 과 일치하는데도 `unclassified` 를 선언하면 실패"였고, 그 기준은
        **재정과 싸웠다**. 재정 P-1 원문은 "Markush·조건부·수단항·카테고리 전환 … **이 4구조를
        만나면** `unclassified` 표지"이므로 표지의 대상은 **청구항 본문의 구조**인데, 구 가드는
        **인용 어형의 파싱 가능성**을 기준으로 삼았다. 두 기준이 다르므로 `of claim 1` 로
        정상 인용하는 Markush 종속항은 **재정을 따르면 반드시 실패**했다 — 재정이 명한 사용이
        벌받는 상태였고, 그 가드는 재정이 아니라 총괄이 지어낸 것이었다. 기준을
        **본문의 구조 표지 유무**로 옮겨 가드의 목적(회피 봉쇄)만 남긴다.

  # ★ 구조 미분류 표지 (재정 2026-08-18 P-1 의 전사).
  #   구 `unreachable_values`(도달 불능 enum `alternative-form` 의 기록)를 **폐기**하고
  #   이 블록이 그 자리를 대신한다. 폐기 근거: P-1 이 typed operator 신설을 N14 범위에서
  #   제외하면서, 그 4구조는 "틀린 형태"가 아니라 **구조 미분류**가 되었고 도달 불능 값의
  #   기록은 존재 이유를 잃었다. `alternative-form` 은 스키마 enum 에서도 폐기되었다.
  unclassified:
    tag: "[전승]"
    value: unclassified
    covers: [Markush, 조건부, 수단항, 카테고리 전환]
    ruling: "재정 2026-08-18 P-1 — typed operator 신설은 N14 범위에서 제외한다."
    treatment:
      - "전문은 이미 보존된다(재정 R1) — 표지는 손실을 만들지 않는다."
      - "판정 제외: parse.set-equals·parse.type-agrees 의 대상에서 뺀다."
      - "판정 행 계수: checked 에서 제외하고 별도로 센다(extras.unclassified)."
      - "CP1 미분류 목록에 전건 노출한다."
    legislation_path: "실물 축적 시 건별 재정(배치 리뷰 상신 경로)."

    # ★ 구조 표지 어형 — `parse.unclassified-not-an-escape` 의 판정 근거.
    #   재정 P-1 이 이름 붙인 4구조에 각각 어형을 단다. 대소문자는 무시한다.
    structure_markers:
      tag: "[가설]"
      case_insensitive: true
      not_a_parser: >-
        ★ 이것은 **파서가 아니다**. 우리가 하는 일은 구조를 **파싱**하는 것이 아니라 그것이
        **있는지 보는** 것이다. 재정 P-1 은 typed operator 신설을 N14 범위에서 **제외**했고,
        이 목록을 파서로 키우는 순간 그 제외가 무효가 된다 — 어형이 무엇을 뜻하는지,
        Markush 군의 원소가 무엇인지, 조건절의 조건이 무엇인지는 여기서 읽지 않는다.
        다음 사람이 이 목록에 그룹 포획과 전개 규칙을 붙이고 싶어질 것이다. 붙이지 마라.
        그것이 필요해지는 날의 경로는 코드가 아니라 `legislation_path` 다.
      forms:
        - structure: Markush
          patterns:
            - 'selected from the group consisting of'
            - 'selected from the group of'
        - structure: 조건부
          ruling: >-
            재정 2026-08-19 Q5 ② = ⓑ — 맨 `\bwhen\b`·`\bif\b` 두 **나표지를 뺀다**.
            조건부 구조는 아래 **명확 구문으로만** 인정한다.
          ruling_confirmed: >-
            ★ **재정 2026-08-19 S3 = ⓑ 조건부 승인** — 이 열 어형 목록이 **확정되었다**.
            승인의 범위는 **목록 전체**이고 교정된 것은 그중 **셋의 앵커**다 — 어형을 더하지도
            빼지도 않았다. Owner 의 선행 지적 원문: *"패턴이 일부 깨진 것 같은데?"* 그 지적이
            없었으면 조건부 승인의 **조건이 무엇인지 정해지지 않았다**(원장 §1 ★ ③).
            원장 = `docs/decisions/ruling-20260819-03-S1-S9.md` §2 S3.
          ruling_provenance: >-
            ★ **이 목록은 한동안 초안이었다 — 그 이력을 지우지 않는다.** 위 `ruling`(Q5 ②)이
            선 뒤 총괄은 열 어형을 `docs/decisions/D-20260819-02-m17-close.md` §2 에
            *"Owner 확인용 입법 초안"* 으로 올렸다. 그런데 초안인 채로 이 파일에 실려 이미
            `parse.unclassified-not-an-escape` 의 판정 공간을 바꾸고 있었고, C′-2 감수가 그
            상태를 **과잉**으로 짚었다 — *"원장이 10종을 'Owner 확인용 입법 초안' 으로 남겼는데
            확인 전에 운영 규칙이 되었다."* S3 은 그것을 되돌리지 않고 **확인으로 닫았다.**
            이 리포는 닫힌 것도 **어떻게 닫혔는지**를 남긴다.
          anchor_defect: >-
            ★ **왜 셋만 앵커가 없었는가 — 데이터로 남긴다.** 열 어형 중
            `in response to`·`responsive to`·`provided that` **셋만** 단어 경계(`\b`) 없이
            적혀 있었다. 나머지 일곱은 전부 `\b` 를 들고 있었으므로 이것은 설계가 아니라
            **초판 집필의 누락**이다 — 여러 낱말로 된 구문은 그 자체로 경계가 선다는 착각이
            이 셋에서만 작동했다. 대가는 실측되었다: `unresponsive to` 가 `responsive to` 에
            **부분 문자열로 매칭**된다. 부정 접두사가 붙은 낱말이 조건부 표지로 읽히면,
            표지가 판정 면제를 주는 구조에서 **회피 통로가 하나 열린다** — `unresponsive`
            하나로 어려운 종속항을 `unclassified` 로 적어 검사를 통과할 수 있었다.
            즉 초판의 설계 원리 ①(*"낱말이 아니라 구문을 본다"*)이 이 셋에서만 지켜지지
            않았고, 교정은 그 원리를 열 어형 **전체에** 되돌린 것이다.
            반례 golden = `ledgers/regression/golden/rc-0004-conditional-marker-counterexamples`
            (오탐 부재 = `unresponsive to` · 미탐 부재 = `in response to` 를 한 표본이 함께 진다).
          patterns:
            - '\bin response to\b'
            - '\bresponsive to\b'
            - '\bprovided that\b'
            - '\bunless\b'
            - '\bonly (?:if|when)\b'
            - '\bif\b[^;.]{0,240}?\bthen\b'
            - '\bin (?:a|the) case (?:where|in which|of)\b'
            - '\b(?:conditioned|contingent) (?:on|upon)\b'
            - '\b(?:depending|based) on whether\b'
            - '\bupon determining\b'
          why: >-
            ★ CL-9 실측이 근거다(2026-08-19 통주 3). 맨 `when` 은 조건이 아니라 **시간 용법**
            으로도 실재하며("… when the module is assembled …"), 그 한 자리 때문에 두 독립
            실행이 **규율을 어기지 않고 갈렸다** — 한쪽은 표지를 보고 `unclassified` 를,
            다른 쪽은 구조를 보고 종속 어형을 선언했고 둘 다 계약대로였다. 통주 3 의
            `dependent-set` 이 0.8889 로 미달했다가 재분해 후 1.0000 으로 수렴했으며 갈린
            자리는 CL-9 **하나**였다. 나표지는 표지가 아니라 낱말이었다.
            남은 열 어형은 전부 **조건절 자체를 지목하는 구문**이라 시간·관계 용법으로
            읽히지 않는다. `\bif\b[^;.]{0,240}?\bthen\b` 만 두 낱말을 잇는 형태인데, 그것도
            `if …` 하나가 아니라 `then` 과의 쌍을 요구하므로 조건절을 지목한다(구간 상한은
            문장 부호를 넘지 않게 두어 옆 문장의 `then` 을 빌리지 못하게 한다).
        - structure: 수단항
          patterns:
            - 'means for'
            - 'step for'
        - structure: 카테고리 전환
          patterns:
            - 'A method of (?:using|making|operating) (?:the|an?)\b'
            - 'A (?:non-transitory )?computer-readable'
          note: >-
            인용 대상과 카테고리가 갈리는 전제부 어형이다. 위 둘은 실물에서 가장 흔한 두
            형태일 뿐이며 전개는 미결이다(아래 `open_question`).
      open_question: >-
        ★ 미결 2건 · 해소 3건(2026-08-19 재정 Q1·Q5 ② · S3). 이 어형 목록은 **실물 축적 전의
        잠정**이다. 재정 P-1 이 남긴 입법 경로가 그대로 이 목록의 확정 경로다 —
        *"입법은 실물 축적 시 건별 재정(배치 리뷰 상신 경로)."* 해소된 항목도 번호를 비우지
        않고 그 자리에 남긴다 — 무엇을 놓고 판단했는가가 사료이기 때문이다.
        ① **[미결]** 카테고리 전환 전제부의 어형 전개(현행 2형태로는 `An apparatus for
        performing the method of claim 5` 류를 놓친다).
        ② **[해소 — 재정 2026-08-19 Q5 ② = ⓑ]** 구 미결 = `\bwhen\b`·`\bif\b` 가 조건부
        종속이 아닌 평범한 한정절에도 나타나는 **과대 탐지**를 "회피를 허용할 뿐 정직한 선언을
        벌하지 않으므로 받아들인다"고 둔 잠정. 재정이 그 잠정을 **뒤집었다** — 두 나표지를
        목록에서 빼고 조건부는 **명확 구문으로만** 인정한다(실측 근거 = 아래 `forms` 의 조건부
        블록 `why`). 귀결을 숨기지 않는다: 목록이 좁아지면 회피 통로도 좁아지지만 **정직한
        미분류 선언이 벌받을 여지가 는다** — 조건부 종속인데 명확 구문이 하나도 없으면
        `parse.unclassified-not-an-escape` 가 그 선언을 실패시킨다. ★ 그러므로 후속 트리거가
        하나 남는다: **명확 구문 없는 실물 조건부 종속항을 만나면 어형을 여기서 넓히지 말고
        그 실물을 상신하라**(`legislation_path`).
        ③ **[미결]** 관할별 표기 차이(EPO 의 `characterized in that` 계열).
        ④ **[해소 — 재정 2026-08-19 Q1 = 기각]** 구 미결 = Markush 어형의 실물 미도달
        (2026-08-18 실특허 통주 실측). **실측 데이터는 지우지 않고 그대로 남긴다** — 실물 어형
        = `comprises/is at least one of A, B, C and D` 형태(통주 특허 청구항 10·11·19)이고,
        현행 2형태(`selected from the group (consisting) of`)로는 이 어형에 **도달하지
        못한다**. 그래서 통주 레인은 집행 가능한 유일한 선택인 `single` 로 선언하고 그 사실을
        상신했다. 총괄은 그것을 "선택지를 열거하고 그중 하나 이상을 고르게 하는 실질적 폐쇄
        선택군이므로 재정 P-1 의 Markush 구조에 해당한다"고 판단해 어형 신설을 올렸고,
        **재정은 그 판단을 기각했다** — Owner 재정 원문: *"(b). 저 형식은 Markush 청구항이
        아닌 것 같아."* 그러므로 어형을 넓히지 않는다(Markush `patterns` 는 2형태 그대로).
        귀결 셋: ⓐ 감수 지적은 "재정이 실행되지 않았다"가 아니라 **대상이 없었다**로 정리되고
        `docs/SPEC.md` §8.4 M1 요구사항표의 **P-1 은 해소로 닫힌다** ⓑ 통주 레인의 처리는
        규약 위반이 아니었다 — 표지가 설 자리가 아니었으므로 `single` 이 옳았다
        ⓒ **법이 바뀌지 않았으므로 통주 재실행은 불요**이며
        `runs/openai-us20260147854a1-cim-fp-3` 의 CP1 상신물이 그대로 선다(행위시법 — 같은
        회차의 개정 Q4·Q5 ② 는 그 뒤에 오는 법이므로 **다음 런부터** 적용된다).
        ★ 남은 둘(①·③)은 실물 없이는 정할 수 없으며, 그때까지 이 목록으로 읽되 **파서로 키우지
        않는다**(`not_a_parser`). 어형 확정은 `legislation_path` 에 속하고, 총괄이 넓히면
        그것이 재정 없는 입법이다. 이 항목의 임무는 목록을 고치는 것이 아니라 **배치 리뷰
        상신의 재료를 데이터로 남기는 것**이다(SPEC §9.33 ③ 이 같은 실측을 문서 쪽에 등재한다).
        ⑤ **[해소 — 재정 2026-08-19 S3 = ⓑ 조건부 승인]** 구 미결이 아니라 **결함**이었다 —
        조건부 열 어형 중 셋(`in response to`·`responsive to`·`provided that`)이 단어 경계
        앵커 없이 적혀 `unresponsive to` 에 부분 문자열로 매칭되고 있었다. Owner 가 먼저
        짚었고(*"패턴이 일부 깨진 것 같은데?"*) 재검이 실측으로 확정했다. 셋의 앵커를 교정해
        닫혔으며 **어형 목록 자체는 열 그대로**다(위 조건부 블록 `anchor_defect`).
        무엇이 남았는가: 이 교정은 **부분 문자열 매칭**을 닫았을 뿐이고, 명확 구문 없는 실물
        조건부 종속항의 문제(②의 후속 트리거)는 여전히 열려 있다.
      why_this_shape: >-
        규칙을 재정 가능한 형태로 코드 밖에 내놓는 방법이다(SPEC §9.26). `claim_inventory` 의
        파싱 규칙을 `[가설]` + `open_question` 으로 낸 것과 **같은 방법**이며, 검사를 만들지
        않는 것이 아니라 검사의 근거를 데이터로 두어 재정이 닿을 수 있게 한다.

# ===========================================================================
# 3. 항목 생애주기 — 동결 항목 payload 의 불변성
#    처분 대상: M0 M13 / M0.6 재감수 M-08 / SPEC §9.27
#    편입 근거: 재정 N14 ①
# ===========================================================================
item_lifecycle:
  tag: "[가설]"
  purpose: >-
    `freeze.id-monotonic` 은 **ID 의 존재**만 본다. 따라서 개정본에서 기존 `active` 항목의
    내용이 조용히 바뀌어도 통과한다. 항목 ID 의 시간 안정성(SPEC §2.4)은 ID 가 아니라
    **의미**가 고정되어야 성립하는데, 지금 고정되는 것은 ID 뿐이었다.
  enforced_by: freeze.payload-immutable

  # (a) 정본 payload — 무엇이 "내용"인가.
  payload_canonicalization:
    tag: "[가설]"
    excluded_fields: [status, superseded_by]
    excluded_why: >-
      이 둘은 **생애 상태**이며 아래 전이표가 그 변경을 허용한다. payload 에 넣으면
      정상적인 철회·교체가 전부 불변성 위반으로 잡혀 검사가 사용 불가가 된다.
    serialization:
      form: json
      sort_keys: true
      separators: [",", ":"]
      ensure_ascii: false
      encoding: utf-8
      newline: none
    digest: "sha256(직렬화 바이트)"
    open_question: >-
      정본 직렬화 형태는 재정 밖이다. JSON 키 정렬은 결정론을 주지만 유일한 선택은 아니며
      (JCS RFC 8785 채택 여부가 대안), historian 이 같은 해시를 재현해야 하는 시점에
      상호 확인이 필요하다. 지금은 `reader/lib` 한 곳에만 구현이 있으므로 표류하지 않는다.

  # (b) 상태 전이 — 단방향.
  transitions:
    active: [retracted, superseded]
    retracted: []
    superseded: []
  terminal_states: [retracted, superseded]
  rules:
    - id: lifecycle.one-way
      rule: "위 표에 없는 전이는 실패한다(종단 상태에서 되돌아오는 경로 없음)."
    - id: lifecycle.superseded-by-iff
      rule: "`superseded_by` 가 non-null ⟺ `status == \"superseded\"`."
      note: "스키마 $comment (7) 의 검증기 몫."
    - id: lifecycle.no-id-loss
      rule: "`v<N-1>` 의 모든 항목 ID 가 `v<N>` 에 존재한다(append-only, SPEC §1.6 freeze.id-monotonic)."
    - id: lifecycle.payload-frozen
      rule: >-
        두 판에 공통으로 존재하는 ID 의 정본 payload 해시가 다르면 실패한다.
        내용을 고치려면 **새 ID 를 추가하고 옛 항목을 `superseded` 로 표시**해야 한다.

  # (c) 승계 사슬 — 2차 승계에서 무너지던 규칙의 교체.
  supersession_chain:
    tag: "[가설]"
    old_rule_retired: >-
      구 규칙 "`superseded_by` 는 `status: active` 인 동일 kind 항목을 가리킨다"는 **폐기**한다.
      2차 승계(A→B→C)에서 B 가 `superseded` 가 되는 순간 A 의 링크를 C 로 다시 써야 하고,
      그것은 동결본을 고치는 일이기 때문이다(SPEC §9.27).
    # ★ 사슬의 정의를 먼저 못 박는다(M1 코퍼스 레인이 지적한 경계 불명확).
    chain_definition: >-
      사슬은 **`superseded_by` 가 non-null 인 항목에서 출발**해 그 링크를 따라간 경로다.
      `superseded_by: null` 인 항목은 사슬의 **시작점이 아니다** — 따라서 대체물 없이 폐기된
      단독 `retracted` 항목은 종단 규칙의 대상이 아니며 정상이다. 구 문언("종단의 status 는
      active")은 이 구별을 적지 않아 단독 철회 항목까지 위반으로 읽힐 여지가 있었다.
      두 상태의 뜻이 애초에 다르다 — `retracted` = 근거가 잘못이었음(대체물 없음),
      `superseded` = 같은 대상에 대한 더 나은 항목이 생김(대체물 있음, SPEC §2.4).
    new_rule:
      - "`superseded_by` 는 **같은 kind** 의 항목을 가리킨다(불변)."
      - "사슬은 **비순환**이어야 한다(자기참조 포함)."
      - "사슬을 끝까지 따라간 **종단 항목의 status 는 `active`** 여야 한다."
      - "단독 `retracted`(`superseded_by: null`) 항목은 사슬이 아니므로 위 규칙의 대상이 아니다."
    why: >-
      링크는 그대로 두고 해소를 사슬 추적으로 바꾼다. A→B→C 에서 A 는 B 를 계속 가리키고,
      `[M_A]` 를 인용한 문장의 수정 지시는 종단 C 를 지목한다. 동결본을 고치는 경로가 없다.

# ===========================================================================
# 4. 재료 측 수치 문법 — 범위·부등호·공차·과학표기를 담을 자리
#    처분 대상: M0 M14 / M0.6 재감수 M-09 / SPEC §9.28
#    편입 근거: 재정 N14 ① + 재정 N15(0.x 미동결이므로 계약 확장 자유)
# ===========================================================================
value_grammar:
  tag: "[가설]"
  purpose: >-
    `fact` 가 `value_normalized` **문자열 하나**만 갖던 탓에 범위(`0.05–0.10 mm`)·부등호·
    "약(about)"·공차(`±5%`)·과학표기·음수를 구별해 담을 자리가 없었다. 그 결과 게이트의
    `numeric.exhaustive` 는 그런 값에서 문자열 일치 여부밖에 판정할 수 없었다(SPEC §9.28).
  enforced_by: read.value-derivation
  schema_home: "reader/schemas/material-spec.schema.json — fact_item.value_type"

  # 십진 토큰. 과학표기·음수·선행 부호를 포함한다. 분수는 지원하지 않는다(아래 참조).
  decimal: '[+-]?(?:[0-9]+(?:[.][0-9]+)?|[.][0-9]+)(?:[eE][+-]?[0-9]+)?'

  # "약/about" 표지 — kind 와 직교하는 별도 불리언(`approximate`).
  approximate_markers:
    - '\babout\b'
    - '\bapproximately\b'
    - '\bapprox[.]?\b'
    - '\baround\b'
    - '~'
    - '≈'

  # ★ 전처리 — 형태 매칭 **전에** 1회 적용한다. 순서가 중요하다.
  preprocess:
    - id: strip-unit
      rule: "`unit_strip` 규칙 적용(아래)."
    - id: thousands-separator
      rule: "`(?<=[0-9]),(?=[0-9]{3}(?![0-9]))` 에 걸리는 쉼표만 제거한다."
      why: >-
        ★ M1 자체 감사 적발. 구 규칙은 "천단위 구분자 `,` 제거"를 무조건으로 적었는데, `set`
        형태가 `,` 를 원소 구분자로 쓰므로 같은 블록의 두 조항이 서로를 무효화했다
        (`1,200` 이 집합 {1, 200} 으로 읽혔다). 위치 조건이 둘을 가른다 — 쉼표 뒤에 **정확히
        세 자리 숫자**가 붙으면 천단위이고, 공백이 오면 원소 구분자다. 그래서 `set` 형태는
        구분자에 **공백을 필수로** 요구한다(아래).
      examples:
        - { input: "1,200", after: "1200", parses_as: scalar }
        - { input: "4, 8, 16", after: "4, 8, 16", parses_as: set }
        - { input: "1,2345", after: "1,2345", parses_as: "파싱 실패(시끄럽게)" }

  # 파싱 우선순위. 앞선 것이 매칭되면 뒤는 시도하지 않는다.
  # ★ 호출자가 `expect_kind` 를 지정하면 그 형태만 시도한다 — 서지 복사 사실처럼 **origin 이
  #   이미 종류를 결정하는** 경우에 쓴다(순전히 숫자로 된 공개번호가 scalar 로 읽히는 것을
  #   문법의 추측이 아니라 호출자의 지식으로 막는다).
  forms:
    - rank: 0
      kind: date
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
      fields: [value]
      note: >-
        범위 형태보다 먼저 시도한다. ISO 날짜의 하이픈이 범위 구분자로 오독될 여지를 없앤다
        (현행 십진 토큰으로는 실제로 매칭되지 않으나, 순서로 못 박아 두는 편이 싸다).
    - rank: 1
      kind: tolerance
      pattern: '^(?P<center>DEC)\s*(?:±|\+/-|\+-)\s*(?P<tol>DEC)\s*(?P<pct>%)?$'
      fields: [center, tolerance, tolerance_unit]
    - rank: 2
      kind: range
      pattern: '^(?P<low>DEC)\s*(?:-|–|—|~|to)\s*(?P<high>DEC)$'
      fields: [low, high, low_inclusive, high_inclusive]
      inclusivity_default: [true, true]
      inclusivity_default_why: >-
        특허 문언의 범위 표기는 관용상 양끝 포함이다. 배타 경계는 부등호 어형으로 적히므로
        `range` 로 오지 않는다.
    - rank: 3
      kind: inequality
      pattern: '^(?P<op>≥|≤|>=|<=|>|<|at least|at most|no less than|no more than|greater than|less than|not exceeding)\s*(?P<bound>DEC)$'
      fields: [bound, direction]
      direction_map:
        "≥": at-least
        ">=": at-least
        "at least": at-least
        "no less than": at-least
        "≤": at-most
        "<=": at-most
        "at most": at-most
        "no more than": at-most
        "not exceeding": at-most
        ">": greater-than
        "greater than": greater-than
        "<": less-than
        "less than": less-than
    - rank: 4
      kind: set
      pattern: '^(?P<members>DEC(?:(?:\s*,\s*(?:and|or)\s+|\s*,\s+|\s+(?:and|or)\s+)DEC)+)$'
      fields: [members]
      min_members: 2
      separator_note: >-
        ★ 구분자에서 `/` 를 뺐고 쉼표 뒤 **공백을 필수**로 했다(M1 자체 감사 적발).
        ① `/` 를 두면 분수 `1/2` 가 집합 {1, 2} 로 읽혀 `unsupported_forms` 의 "분수는 파싱
        실패" 규정이 **도달 불가능한 문언**이 된다. ② 쉼표 뒤 공백을 요구해야 천단위 구분자와
        갈린다(위 `preprocess`).
      oxford_note: >-
        ★ 마지막 원소 앞의 연결어를 받아들인다(M1 실특허 스모크 적발). 청구항의 실제 어형은
        `2, 3, 4 and 5` 와 `2, 3, 4, or 5` 인데 구 패턴은 **둘 다 파싱 실패**였다. 그 결과
        독해 레인이 "수치를 지어내지 마라"와 "수치 사실을 등재하라" 사이에서 후자를 포기했고,
        **원문에 실재하는 값이 정답지에서 빠졌다**. 계약의 구멍이 결함이 아니라 **산출물의
        조용한 축소**로 새는 자리이며, 어떤 검사도 빠진 사실을 결함으로 보지 않는다.
        연결어 앞 쉼표(옥스퍼드 콤마)는 있어도 없어도 받는다.
    - rank: 5
      kind: scalar
      pattern: '^(?P<value>DEC)$'
      fields: [value]
    - rank: 6
      kind: identifier
      pattern: '^(?=[A-Za-z0-9/.-]*[A-Za-z])[A-Za-z0-9][A-Za-z0-9/.-]*$'
      fields: [value]
      note: >-
        마지막 순위이며 **문자를 최소 1개 요구**한다 — 그러지 않으면 모든 수치를 삼킨다.
        순전히 숫자로만 된 공개번호(예: `20260147854`)는 이 패턴에 걸리지 않으므로,
        그런 값은 호출자가 `expect_kind: identifier` 로 지정해 파싱한다. 문법이 추측하지
        않고 origin 이 결정한다.

  # `DEC` 는 위 `decimal` 로 치환해 컴파일한다(패턴 중복 기입 금지).
  placeholder: DEC

  # 값 문자열에서 단위를 떼어내는 규칙. 단위는 `fact.unit` 이 이미 들고 있으므로,
  # 파싱 전에 꼬리 단위를 잘라낸다.
  unit_strip:
    rule: "`value_raw` 끝에서 `fact.unit` 문자열이 일치하면 그만큼 잘라내고 공백을 정리한다."
    on_mismatch: >-
      `unit` 이 non-null 인데 `value_raw` 꼬리와 다르면 **실패**한다 — 단위가 값과 어긋나면
      정답지 자체가 틀린다. `unit: null` 이면 자르지 않는다.

  # 정규화 렌더 — value_type 에서 value_normalized 를 결정론으로 만든다.
  render:
    rule: "`value_normalized == render(value_type)`. 불일치 = 실패."
    forms:
      scalar: "{value}"
      range: "{low}-{high}"
      inequality:
        at-least: ">={bound}"
        at-most: "<={bound}"
        greater-than: ">{bound}"
        less-than: "<{bound}"
      tolerance:
        absolute: "{center}+-{tolerance}"
        percent: "{center}+-{tolerance}%"
      set: "{m1};{m2};…"
      date: "{value}"
      identifier: "{value}"
    set_separator_note: >-
      ★ 렌더 구분자가 `|` 가 아니라 `;` 인 이유(M1 자체 감사 적발): l0-format §9 의
      `match_key` 가 `"{value_normalized}|{unit or ''}"` 이므로, 집합값을 `|` 로 이으면
      `1|2|mm` 이 되어 값과 단위의 경계가 파싱 애매해진다. 대조 키를 만드는 문자는
      값 안에 나타나면 안 된다.
    approximate_prefix: "~"
    approximate_prefix_why: >-
      `approximate` 가 true 면 렌더 앞에 `~` 를 붙인다. "약 0.08" 과 "0.08" 은 다른 주장이며,
      MATCH_KEY 가 같아지면 게이트가 그 차이를 영원히 보지 못한다.
    number_normalization:
      - "천단위 구분자 `,` 제거"
      - "후행 0 제거(0.80 → 0.8), 정수부 단독 0 보존"
      - "선행 `.` 보정(.8 → 0.8)"
      - "선행 `+` 제거, 선행 `-` 보존"
      - "과학표기는 지수를 전개해 십진으로 편다(1.2e3 → 1200). 전개 자릿수가 30 을 넘으면 실패"
      - "유니코드 숫자는 ASCII 로 정규화"
    normalization_note: >-
      이 표는 `contracts/l0-format.yaml` §9 `numeric.normalization`(본문 쪽 정본)과 **같은 답을
      내야 한다** — 두 쪽이 같은 MATCH_KEY 를 만들지 못하면 숫자 전수 대조가 성립하지 않는다.
      구현은 `reader/lib/normalize.py` **한 벌뿐**이고(SPEC §8.4 M1: 게이트·계기가 이를 import),
      두 문언의 동치는 `tests/test_m1_reader.py::test_normalization_table_matches_l0_contract` 가
      매 실행 대조한다. 사본이 아니라 **대조**로 묶는 이유는 reader/ 가 `contracts/` 를 읽으면
      이식 단위가 깨지기 때문이다(SPEC §6.2 판별식 1).

  # ★ origin ↔ kind 결속. 스키마는 유니온의 **구조**만 닫고, 어느 origin 이 어느 kind 를
  #   써야 하는지는 참조를 해소해야 알 수 있으므로 검증기 몫이다.
  origin_kind_binding:
    - when: 'origin == "bibliographic" and bib_source.field == "patent.number"'
      require_kind: identifier
      expect_kind_for_parse: identifier
    - when: 'origin == "bibliographic" and bib_source.field in {patent.dates.priority, patent.dates.filing, patent.dates.publication}'
      require_kind: date
      expect_kind_for_parse: date
    - when: "그 밖의 전 origin"
      require_kind: null
      expect_kind_for_parse: null
      note: "rank 순으로 파싱한다."
  binding_why: >-
    서지 복사 사실은 **origin 이 이미 값의 종류를 결정**한다. 그것을 문법의 추측에 맡기면
    순전히 숫자로 된 공개번호가 scalar 로 읽히고, 그 순간 정답지에 '수치'가 하나 늘어난다.

  unsupported_forms:
    - form: 분수(`1/2`)
      handling: >-
        파싱 실패로 처리한다. 유한소수로 떨어지지 않는 분수의 정규화는 반올림 재정을
        요구한다. **조용히 근사하지 않고 시끄럽게 실패한다.**
      reachability: >-
        ★ 이 규정은 이제 실제로 도달한다. 초판은 `set` 구분자에 `/` 가 있어 `1/2` 가
        집합 {1, 2} 로 파싱되었고, 그래서 "파싱 실패" 문언이 **한 번도 발동할 수 없는
        죽은 규정**이었다(M1 자체 감사 적발). `/` 를 구분자에서 뺀 것이 이 규정을 살렸다.
    - form: 혼합 단위 범위(`1 mm to 2 cm`)
      handling: "파싱 실패. 단위 환산은 정규화가 아니라 값의 변경이다(l0-format 의 같은 규율)."
    - form: 공백이 낀 식별자(`US 2026/0147854 A1`)
      handling: >-
        파싱 실패. 구분자를 제거한 정본 형태(`US20260147854A1`)로 저장한다(§7.1 pubnum 규칙과
        같은 방향). 같은 번호의 두 표기가 정답지에 들어가면 숫자 전수 대조가 갈라진다.
  open_question: >-
    ★ 재정 대기. SPEC §9.28 은 이 확장을 "historian 부트스트랩 시점의 minor 확장(§9.19)과 함께
    재정하는 편이 싸다"고 적었고, 재정 N15 가 `0.x` 미동결을 선언해 지금 넣을 수 있게 했다.
    남은 미결은 **비교 의미론**이다 — 본문이 "약 0.08 mm"이고 재료가 `0.05–0.10 mm` 일 때
    게이트가 정합으로 볼 것인가. 현행은 `match_policy: exact-only`(l0-format §9)이므로
    **불일치로 읽는다**. 포함 관계 대조로 바꾸는 것은 게이트 관할의 확장이므로 재정 사항이다.

# ===========================================================================
# 5. 재독해 수렴 — 구조까지 비교한다
#    처분 대상: M0 M12 / M0.6 재감수 M-07 (수렴 축) / SPEC §9.26
#    편입 근거: 재정 N14 ①
# ===========================================================================
convergence:
  enforced_by: read.convergence
  purpose: >-
    구 검사는 **독립항 수와 element `text_verbatim` 집합**만 봤다. 집합 비교이므로 같은 문자열
    집합이 서로 다른 계층으로 조립되어도, 종속항이 통째로 흔들려도 수렴한 것으로 판정됐다.

  # ★ 축별 정책 (재정 2026-08-18 P-3). Owner 원리의 전사:
  #   "결정론적으로 유일해야 하는 구조 사실(개수·종속항 서명)은 완전 일치를 트리거로,
  #    해석 여지가 있는 부분(구성요소 입도·트리 조직)은 결함이 아니라 각 독해의 특성으로
  #    기록·관찰한다."
  #   종전 6축은 전부 같은 무게의 pass/fail 이었다. 이제 셋은 **법**, 둘은 **계기**,
  #   하나는 **관찰**이다 — 그래서 `read.convergence` 는 단일 판정이 아니라 세 층의 보고서를 낸다.
  policies:
    - id: exact-match
      meaning: "결정론적으로 유일해야 하는 구조 사실. 미달 = 판정 행 fail(법)."
      threshold_required: true
      status_on_pass: pass
      status_on_miss: fail
    - id: escalation-trigger
      meaning: >-
        해석 여지가 있는 축. 미달은 fail 이 **아니라** `escalations[]` 등재 → Owner 상신(계기).
      threshold_required: true
      status_on_pass: pass
      status_on_miss: escalate
    - id: measure-only
      meaning: "판정 제외·측정 전용. 아무 판정도 하지 않고 값만 기록한다(관찰)."
      threshold_required: false
      status_on_pass: measured
      status_on_miss: measured
  policy_note: >-
    `threshold_required: true` 인 정책의 축에 `threshold` 가 없으면 판정하지 않고
    `convergence.threshold-missing` 결함을 낸다(B-04 보수 유지 — 코드가 기본값을 지어내지
    않는다). `measure-only` 는 threshold 부재가 **정상**이다.
    ★ 단 `comparison: count` 축은 유사도를 재지 않고 **같은가 다른가**만 보므로 임계를 둘
    자리가 애초에 없다 — 임계 요구는 `comparison: jaccard` 축에만 걸린다. B-04 가 적발한
    것은 "유사도로 판정하면서 임계를 계약 밖에서 가져온" 자리였지 "개수를 비교한" 자리가
    아니다.

  axes:
    - id: independent-count
      tag: "[전승]"
      policy: exact-match
      comparison: count
      rule: "독립항 수가 다르면 Jaccard 와 무관하게 즉시 실패."
      basis: "SPEC §2.6 검사 4 · 재정 P-3(구조 사실)"
      threshold_note: "개수 축은 집합 유사도를 재지 않는다 — 같거나 다르거나이므로 임계가 없다."
    - id: element-set
      tag: "[전승]"
      policy: escalation-trigger
      comparison: jaccard
      rule: "element `text_verbatim` 집합의 Jaccard ≥ 0.95 미달 시 **상신**."
      basis: "SPEC §2.6 검사 4 (재정 R1 이전부터의 문언) · 재정 P-3(해석 여지)"
      threshold: 0.95
      why: >-
        구성요소 입도는 두 독해가 다르게 끊을 수 있는 자리다. 그 차이는 결함이 아니라 각
        독해의 특성이므로 실패가 아니라 관찰·상신으로 처리한다(재정 P-3).
    - id: tree-edges
      tag: "[가설]"
      policy: escalation-trigger
      comparison: jaccard
      rule: >-
        트리 간선 집합의 Jaccard ≥ 0.95 미달 시 **상신**. 간선 = `(부모 text_verbatim,
        자식 text_verbatim)` 이며 최상위 element 의 부모는 소속 독립항의 `text_verbatim` 이다.
      threshold: 0.95
      why: "트리 조직도 해석 여지가 있는 축이다(재정 P-3) — 갈림을 프로파일로 기록한다."
    - id: dependent-count
      tag: "[전승]"
      policy: exact-match
      comparison: count
      rule: "종속항 수가 다르면 즉시 실패."
      basis: "재정 P-3 — 개수는 구조 사실이다."
      threshold_note: "개수 축은 임계가 없다(위와 같은 이유)."
    - id: dependent-set
      tag: "[전승]"
      policy: exact-match
      comparison: jaccard
      rule: >-
        종속항 서명 집합의 Jaccard **== 1.0**(완전 일치). 서명 = `(text_verbatim,
        sorted(depends_on), dependency_type)`.
      threshold: 1.0
      threshold_note: >-
        ★ 0.95 → 1.0 **승격**(재정 P-3). 종속항 서명은 결정론적으로 유일해야 하는 구조
        사실이며, 0.95 는 "몇 건은 갈려도 좋다"를 뜻해 다중 종속의 논리 형태가 조용히
        갈리는 것을 허용했다.
      why: "다중 종속의 논리 형태가 두 독해에서 갈리면 그 특허의 종속 구조는 재현되지 않는다."
    - id: addition-attachment
      tag: "[가설]"
      policy: measure-only
      comparison: jaccard
      threshold: null
      threshold_note: >-
        ★ 임계 **없음이 정상**이다(재정 P-3 — 판정 제외·측정 전용). 이전 판의 0.95 는
        B-04 보수 때 코드의 조용한 기본값을 계약으로 끌어올린 것이었고, P-3 이 그 축을
        아예 판정 밖으로 옮기면서 임계를 둘 근거가 사라졌다. 부착 관례가 입법되기 전까지
        이 축은 값만 기록한다 — 계약 어디에도 없는 수로 판정하지 않는다는 B-04 의 규율은
        "지어내지 않는다"이지 "무엇이든 판정한다"가 아니다.
      rule: >-
        부가 한정 부착 집합의 Jaccard 를 **측정만** 한다. 원소 = `(addition text_verbatim,
        attaches_to 가 가리키는 element 의 text_verbatim)`.
      why: "부착 지점이 흔들리면 누적 트리가 달라진다 — 다만 부착 관례가 아직 입법되지 않았다."

  # ★ 상신 서식 (재정 P-3) — 축별 값 + 갈린 항목. 프레임이 문언의 일부다.
  profile:
    tag: "[전승]"
    frame_label: 독해 프로파일
    frame_note: >-
      이 보고는 "결함 후보 목록"이 아니라 **두 독해가 어떻게 갈렸는가의 기술**이다.
      갈림 자체가 실패를 뜻하지 않으며, Owner 는 그 실물을 보고 계속·중단을 정한다.
    max_items_per_direction: 20
    truncate_chars: 200
    truncation_suffix: " …"
    directions: [only_in_canonical, only_in_peer]
    directions_note: >-
      정본(canonical) = `ctx.spec`, 대조본(peer) = `ctx.peer_spec`. 방향을 나누는 이유는
      "빠졌는가 늘었는가"가 Owner 판단을 가르기 때문이다 — 합집합 차이만으로는 알 수 없다.

  id_free_comparison_why: >-
    전 축이 **id 가 아니라 원문 문언**으로 비교한다. 두 독립 실행은 같은 id 를 쓸 이유가 없고
    (`CL-1/e2` 가 양쪽에서 같은 대상이라는 보장이 없다), id 로 비교하면 번호 매기기 관습이
    같다는 사실만 확인하게 된다.
  open_question: >-
    ★ 임계 문제의 절반은 재정 P-3 이 **정책 차등**으로 처분했다 — 구조 사실 3축은 완전 일치,
    해석 여지 2축은 0.95 상신 트리거, `addition-attachment` 는 판정 제외. 남은 미결은 둘이다:
    ① `addition-attachment` 의 **부착 관례 입법**(그것이 서기 전에는 이 축에 임계를 둘 근거가
    없다) ② 두 상신 축(element-set·tree-edges)의 임계 **실측** — 0.95 는 여전히 실측 근거 없이
    옮겨온 값이며, 첫 런의 프로파일이 그 재정의 근거 자료가 된다. 그때까지 미달은 품질 결함이
    아니라 절차 신호로 올린다(재정 P-3 — 미달 = 실패가 아니라 Owner 상신).
    ★ **미결 ③ 신설(재정 2026-08-19 Q5 ① 의 재검토 트리거).** 재정은 **전제부를 element 로
    만들지 않는다**고 확정했고(입법 = `reader/procedure/10-decompose.md` 경계 규약 ⑦),
    그 확정은 *전제부가 짧고 형식적이다* 라는 가정 위에 선다. **전제부가 길고 실질 한정을
    여럿 담은 실물**(전제부 안에서 구성요소를 도입하고 그것을 다시 한정하는 형태)을 만나면
    레인은 **규약대로 비요소로 처리하고 그 사실을 상신한다** — 규약을 자의로 넓히지 마라.
    이 축(`tree-edges`)이 그 갈림을 재는 자리이므로 트리거를 여기 둔다: 청구항 전문이
    최상위 element 의 부모 문언이므로 전제부의 취급이 갈리면 **최상위 간선이 통째로**
    어긋난다. 상신 경로는 배치 리뷰이며 총괄이 규약을 넓히면 그것이 재정 없는 입법이다.

# ===========================================================================
# 6. 전수 수치 수확 — 접지 스팬에서 수치를 기계가 남김없이 거둔다
#    처분 대상: 구 ⑤단계 "중요 수치 선별 등재"(서사 편향 수확)
#    편입 근거: Owner 재정 2026-08-18 P-B
# ===========================================================================
numeric_harvest:
  tag: "[전승]"
  source_of_law: "Owner 재정 2026-08-18 P-B — 수치 사실은 **접지 스팬 기반 전수 기계 수확**."
  enforced_by: read.value-derivation      # 규칙 value.harvest-parity
  implemented_by: reader/lib/harvest.py
  purpose: >-
    ⑤단계 레인의 **서사 편향 수확을 폐지**한다. 구 규정은 독해 레인이 "중요한 수치"를 골라
    등재하게 했고, 그것은 서사가 정답지를 고르는 구조였다 — 선택이 생성보다 앞서면 선택되지
    않은 것은 존재조차 하지 않게 되고, 나중에 필요해졌을 때 되돌아갈 자리가 없다(D12 전량
    선편집의 논리를 수치로 확장한 것이 재정 P-B 다). 그래서 수확은 **전수**이고,
    고르는 일은 `numeric_refs` **역참조**가 한다.
  significance: "함의·포지셔닝의 numeric_refs 역참조"
  significance_note: >-
    중요분은 LLM 의 중요도 판단이 아니라 "함의·포지셔닝이 실제로 참조했는가"로 도출된다.
    CP1 은 참조분을 펼치고 미참조분을 접되 **전량 카운트를 상시 표기**한다(재정 P-B).

  # -- 무엇을 훑는가 -------------------------------------------------------
  scan_scope: grounding.spec_refs[].quote
  scan_scope_note: >-
    원천 파일 전체가 아니라 **인용 스팬**을 훑는다. 근거 = 재정 P-B 문언 "접지 스팬 기반".
    원천을 통째로 훑으면 접지되지 않은 문단의 수치까지 정답지에 오르고, 그 값들은
    `read.verbatim`·`read.coverage` 어느 쪽으로도 뒷받침되지 않는 사실이 된다.

  # ★ 이 범위의 귀결 — **결함이 아니라 설계다**(2026-08-18 러너 통주 실측 ⓑ 처분).
  scan_scope_consequence:
    fact: >-
      접지되지 않은 문단(예 `[0014]`)의 수치는 **수확되지 않는다**. 접지되지 않은 문단은 어떤
      구성요소와도 결속되지 않은 자리이고, 거기서 수치를 끌어오면 "전수"의 기준이 접지가
      아니라 **문서 전체**가 된다. 그 순간 정답지가 명세서 전문으로 넓어져
      `numeric.exhaustive` 가 사실상 무력해진다.
    correct_remedy: >-
      그 수치가 필요하면 **수확 범위를 넓히지 말고 접지를 넓혀라** — 접지가 그 문단을
      인용하면 수확은 자동으로 따라온다. 이 방향을 뒤집으면 재정 P-B 의 기준선이 무너진다.
    derived_input_path: >-
      `derived` fact 가 접지 밖 수치를 입력으로 써야 할 때의 경로는 이미 열려 있다 —
      스키마가 허용하는 **인라인 스팬 입력**(`derivation.inputs[]` 의 `{name, locator, quote,
      value_span}` 형태)이다. 참조가 아니라 원문 스팬 직접 지정이므로 깊이 1 규율을 지키며,
      `convergence/v0` 의 `fact_classification.derived[].inputs[].origin` enum 이 `inline-span`
      을 담고 있는 이유가 정확히 이 자리다.
    do_not_misread: >-
      ★ 이것을 결함으로 오인해 수확 범위를 넓히지 마라. 다음 사람이 "수치가 빠진다"는 관찰만
      보고 스캔을 원천 전체로 넓히면 정답지가 조용히 무너진다 — 그때 무너지는 것은 수확기가
      아니라 숫자 게이트 전체다.
  # -- 어떤 어형을 찾는가 (★ 2026-08-18 총괄 검수 결함 ① 처분) ---------------
  scan:
    source: value_grammar.forms
    order: rank                       # tolerance → range → inequality → set → scalar
    consumption: longest-first-consumed
    anchors: strip                    # `^…$` 를 벗겨 **스캔용**으로 파생 컴파일한다
    exclude_kinds: [identifier]
    why: >-
      ★ 초판은 `value_grammar.decimal` **낱개 십진**만 훑었고, 그 결과 복합 어형이 통째로
      사라지거나 평평해졌다(2026-08-18 총괄 검수 실측): `0.05 to 0.10 mm`(range) 소멸 ·
      `at least 12 mm`(inequality) → `12` 로 뭉갬 · `50 ±5 %`(tolerance) 소멸 ·
      `320, 340, 360 °C`(set) → 스칼라 셋으로 분해. 그것은 **재정의 목적을 무효화한다** —
      `value_type` 판별 유니온은 "범위·부등호·공차를 담을 자리가 없다"(M0 M14 · 재감수 M-09 ·
      SPEC §9.28)를 처분한 결과인데, 수확기가 형태를 펴면 P-B 가 그 처분을 되돌린다.
      형태를 잃은 수확은 전수가 아니다.
    anchors_why: >-
      §4 의 어형 패턴은 값 문자열 **전체**를 판정하므로 `^…$` 앵커가 걸려 있다. 스캔은 문장
      안에서 찾는 일이라 앵커를 벗겨야 하며, 그 파생은 **같은 패턴에서** 한다 — 패턴을 두 벌
      적으면 한 벌은 반드시 낡는다(§4 `placeholder` 규율과 같은 이유).
    exclude_why: >-
      `identifier` 어형은 문자를 포함한 거의 모든 토큰에 매칭되므로 스캔에 넣으면 산문
      전체를 삼킨다. 식별자는 origin 이 결정하는 값이며(서지 수확), 인용문 안에서 찾을
      대상이 아니다.
    scalar_note: >-
      `scalar` 가 마지막 순위이므로 앞선 어형이 소비하지 않은 낱개 십진은 전부 수확된다 —
      전수 성질은 이 마지막 순위가 진다.

  # -- 토큰 경계 (★ 총괄 검수 결함 ⓐ 처분 — 입법이 아니라 토큰화 규율) --------
  token_boundary:
    left_forbidden: '[A-Za-z0-9]'
    right_letter: '[A-Za-z]'
    right_rule: unit-or-reject
    why: >-
      ★ 실측(2026-08-18 러너 통주): `25 cm3` 가 `25`(unit=null)와 **`3`** 두 수치로 수확됐다.
      `3` 은 영숫자 토큰 `cm3` 의 **내부**이며, 그것을 수치 사실로 올리면 정답지에 없는 값이
      하나 생긴다 — 도면부호 오염과 정확히 같은 형태다. 그래서 매칭 **직전** 문자가
      영문자·숫자이면 그 매칭을 버리고(문자열 머리는 허용), 매칭 **직후** 문자가 영문자이면
      그 자리가 **단위로 인정되는 경우에만** 살린다(단위로 소비된다).
    not_a_unit_table_matter: >-
      이 규율은 단위표와 무관하다. `cm3` 이 단위표에 없어 `25` 가 `unit: null` 로 남는 것은
      정상이며, 표의 확장은 여전히 재정 대상이다. 고치는 것은 "토큰 내부를 수치로 읽는 일"
      하나뿐이다.
    unit_null_visibility: >-
      단위표에 없어 단위를 붙이지 못한 수확은 `skipped` 가 아니라 **정상 수확**이다. 다만
      `unit: null` 인 채로 남았다는 사실은 지워지지 않는다 — CP1 수치 인벤토리가 각 항목의
      단위를 그대로 싣고, 단위 없는 수치는 `match_key` 에서 `"{value}|"` 로 드러난다.
      값을 잃는 것과 단위를 못 붙이는 것은 다른 사건이며, 뒤엣것은 보이는 채로 남는다.
    # ★ 2026-08-18 통주 2 실측 처분 — 경계 기각은 **기록 없이** 일어나고 있었다.
    rejection_labels:
      left: boundary-left
      right: boundary-right
    rejection_labels_why: >-
      ★ 두 경계 기각은 지금까지 `continue` 하나였고 `skipped[]` 에 아무것도 남기지 않았다.
      그래서 `FP8 (1-5-2)` 의 셋째 필드(`-2`)는 **오파싱이 아니라 소리 없이 사라졌다** —
      선행 부호를 포함한 scalar 가 `-2` 로 잡히고 왼쪽 이웃이 숫자라 기각되는데, 그 기각이
      어디에도 적히지 않았다. 이 모듈이 내건 "시끄럽게 실패한다"가 **이 자리에서만** 지켜지지
      않았다는 뜻이며, 침묵으로 줄어든 전수는 전수가 아니다. 라벨을 코드가 아니라 여기에 두는
      이유는 `reason_label` 과 같다 — CP1 §12.3 이 사유별로 세는 어휘가 곧 계약이다.
    rejection_recording_scope: >-
      한 구간에 대해 **한 번만** 기록한다. 기각된 스팬은 배제 구간에 더해지고, 뒤에 오는 낮은
      순위 어형이 같은 자리를 다시 매칭해도 그 매칭은 조용히 버린다 — 그러지 않으면
      `abc12-34` 하나가 `12-34`·`12`·`-34` 세 줄로 불어나 "몇 건이 빠졌는가"를 오히려 흐린다.
      기록의 단위는 토큰이 아니라 **잃은 자리**다.

  # -- 단위 인정 (★ 총괄 검수 결함 ② 처분) ----------------------------------
  unit_detection:
    pattern: '[ ]?(?P<unit>[A-Za-zµΩ%°/·]+)'
    boundary: '(?=$|[^A-Za-z0-9µΩ%°/·])'
    boundary_why: >-
      단위 토큰 뒤에는 글자가 이어지지 않아야 한다. 이 경계가 없으면 긴 낱말의 앞머리가
      단위로 읽힌다(`12 mmol` 의 `mm`). 뒤에 오는 것이 구두점·공백·문자열 끝인 경우는
      정상이며, 초판이 `0.08 mm,` 처럼 **구두점으로 끝나는 자리**에서 단위를 잃은 것이
      이 항목의 신설 이유다(2026-08-18 총괄 검수 실측).
    max_length: 12
    accept: "아래 `vocabulary` ∪ reader/lib/normalize.py#UNIT_ALIASES 의 키와 값(대소문자 무시)"
    accept_why: >-
      ★ 두 표는 역할이 다르다. `UNIT_ALIASES` 는 **정규화 표**(같은 단위의 두 표기를 하나로
      접는다)이고 그 확장은 `contracts/l0-format.yaml` §9 와 함께 가는 입법이다. 아래
      `vocabulary` 는 **인식 어휘**(어떤 꼬리 문자열을 단위로 볼 것인가)이며 정규화 매핑을
      만들지 않는다 — `mm` 을 인식해도 `normalize_unit("mm") == "mm"` 이라 MATCH_KEY 의
      의미는 바뀌지 않는다. 인식 어휘가 없으면 `0.08 mm` 가 단위를 잃고, 단위를 잃은 수치는
      `l0-format §9` 의 `match_key`(`"{value_normalized}|{unit or ''}"`)에서 **다른 키**가 되어
      숫자 전수 대조가 같은 값을 서로 다른 것으로 읽는다. 그것이 조용한 오염이다.
    vocabulary:
      # 길이
      - mm
      - cm
      - km
      - nm
      - pm
      - mil
      # 질량
      - mg
      - kg
      - ng
      # 시간·주파수
      - ms
      - ns
      - ps
      - hz
      - khz
      - mhz
      - ghz
      - thz
      - rpm
      # 온도
      - °c
      - °f
      # 전기
      - mv
      - kv
      - ma
      - na
      - kw
      - mw
      - ω
      - kω
      - mω
      - mah
      - wh
      - kwh
      # 압력·힘
      - pa
      - kpa
      - mpa
      - gpa
      - bar
      - psi
      - mn
      - kn
      # 부피·유량
      - ml
      - sccm
      - slm
      # 비율
      - "%"
      - ppm
      - ppb
      - wt%
      - vol%
      - at%
      # 에너지
      - kj
      - ev
      - kev
      - mev
      # 기타
      - db
      - deg
      - dpi
      # 정보량 (재정 2026-08-19 Q4)
      # ★ 단일 문자 단위의 **명시적 예외**다 — 바로 아래 `vocabulary_ambiguous_excluded` 가
      #   단일 문자를 일부러 뺀 자리이므로, 여기 한 글자를 넣는 것은 그 원칙을 뒤집는 일이
      #   아니라 재정이 연 한 자리다. 실측 근거 = 통주 특허 `[0189]` 의
      #   `… exponents with 5b, 4b, 3b or 2b …` — 네 값이 전부 `boundary-right` 로 기각되고
      #   있었다(뒤따르는 `b` 가 단위로 인정되지 않으면 그 자리는 토큰 내부로 읽히고, 값
      #   자체가 사라진다). 단위를 못 붙이는 사건이 아니라 **값을 잃는 사건**이었다.
      # ★ 넓히지 않은 것 둘: 철자형 `bit`·`bits` 와 `UNIT_ALIASES` 정규화 매핑. 재정 문언이
      #   `b` 하나만 말했고, 정규화 매핑 신설은 별개의 입법이다(`accept_why` 의 역할 구분).
      - b
    vocabulary_ambiguous_excluded:
      - values: [m, s, a, v, w, f, k, l, g, j, h, c, t, "in", n]
        why: >-
          단일 문자·영어 낱말과 겹치는 단위는 **일부러 뺐다**. `12 in the channel` 의 `in`,
          `5 m of` 의 `m` 을 단위로 읽으면 값 스팬이 문장을 삼키고, 그것은 단위를 잃는 것보다
          나쁜 오염이다(잃은 단위는 `unit: null` 로 드러나지만, 지어낸 단위는 정답지에
          거짓 단위를 심는다). 이 배제로 잃는 단위는 첫 런의 실측으로 상신한다.
        exception: >-
          ★ 이 원칙에 **명시적 예외가 하나 생겼다** — `b`(bits). 재정 2026-08-19 Q4 가 위
          `vocabulary` 에 단일 문자 단위 하나를 열었다(근거·실측은 그쪽 주석). 원칙은 그대로이며
          바뀐 것은 그 한 자리뿐이고, 예외가 더 는다면 그것도 재정으로만 는다.
    on_unknown: "단위로 인정하지 않는다 — `unit: null` 이고 값 스팬에 포함하지 않는다."

  # -- 배제 (★ 총괄 검수 결함 ③ 처분) ---------------------------------------
  #
  # ██ 이 목록은 동결되어 있다 — 고치기 전에 아래 `exclusions_freeze` 를 읽어라. ██
  #
  exclusions_freeze:
    ruling: "재정 2026-08-31 Q4"
    ledger: docs/decisions/ruling-20260831-01-Q1-Q4.md
    status: frozen
    frozen_on: "2026-08-31"
    scope: >-
      재정 문언 그대로 = 아래 `exclusions` **6종 전부와 그 가드**(꼬리 가드·토큰 조건 포함).
      어형 목록만이 아니라 가드의 폭까지 포함한다 — 가드를 좁히거나 넓히는 것이 곧 정답 집합을
      움직이는 일이다.
      ★ **재정의 「6종」은 낡은 계수이며, 동결의 실제 범위는 이 목록의 항목 전부다.**
      실측(2026-08-31) = `exclusions` 항목은 **7**이고 내역은 `match: enclosing-pattern` **5종**
      + 토큰 조건 규칙 **2종**(`figure-numeral` · `row-column-coordinate`)이다. 계수의 정본은
      `enclosing_exclusions.census` 이며 그것이 같은 수를 든다. 「6」은
      `contracts/glossary.md` 가 **`row-column-coordinate` 가 아직 봉투이던 시점**에 적은 수가
      전해진 것이다(같은 날 후속 보수로 토큰 조건 규칙이 되었다 — 그 항목의 `form_change`).
      **범위를 좁게 읽지 마라** — 재정의 괄호가 *"토큰 조건 포함"* 을 명시하므로 동결의 뜻은
      **목록 전부**이고, 어긋나는 것은 뜻이 아니라 숫자 하나다. 이 어긋남을 조용히 고치지
      않고 여기 적는 이유는 원장 문언을 총괄이 개서할 수 없기 때문이다(재정 N6 규율 2).
    forbidden: >-
      어형 추가·삭제 · 가드 폭 변경. **좁히는 것도 넓히는 것도 금지**다.
      ★ 이 「좁히는 것도」가 이 동결의 요점이다 — 앞선 네 바퀴는 전부 **좁히는 방향**이었고,
      좁힐 때마다 경계가 하나 더 생겨 다음 결함이 거기서 났다.
    allowed: >-
      기록 전량 — `open_question` 갱신 · 빈도·관찰 등재 · golden 표본 추가(기대값을 **현행
      동작대로** 적는 것). 즉 **무엇이 어떻게 새고 있는지 적는 일은 계속하되 고치지 않는다.**
    exception: >-
      좁은 구멍 하나 — **선언된 뜻과 실제 동작의 어긋남**을 고치는 것. 단 **그 어긋남이 실물
      원천 어형에서 재현될 때만**이다. **구성 입력으로 만든 재현은 자격이 없다.**
      (선례 = `row-column-coordinate` 의 `form_change` 와 `figure-or-table-number-list` 의
      소수점 절. 둘 다 「선언한 뜻대로」의 보수였으나 **재현이 구성 입력이었다** — 이 단서가
      그 회전을 닫는다.)
    release_condition: >-
      PD-M4 의 `numeric.exhaustive` 와 `numeric.unreviewed-use` 가 **둘 다 구현되고 실물 런
      1회를 통과**한 뒤. 둘의 현황 = `contracts/glossary.md` §2.2(계약에만 있고 구현 없음).
    release_measurements: >-
      해제 후 거래에 쓸 실측 2종(사전 지정) — ① **플래그 건수**(= 오염이 Owner 에게 지우는
      검토 부하) ② **소실 건수**(= 정답지에 오르지 못한 진짜 값).
      **이 둘이 손에 들어오기 전에는 거래가 성립하지 않는다.**
    why: >-
      **결정 불가능성이 실물로 증명되었다.** 통주 3 원천의
      `In the example in FIG. **41**, **32** wordline signals wl0, wl1, . . . wl31 are provided`
      에서 `32` 는 wordline 신호 **개수**인데, **같은 특허에 FIG. 32 도 실재한다**(원천 3회 ·
      도면 1~63). 같은 수가 같은 특허 안에서 도면 번호이기도 하고 진짜 수량이기도 하므로
      **패턴도 못 가르고 도면 번호 목록 대조도 못 가른다 — 문장의 뜻만 가른다.**
      이 층은 **의미 판정을 문법 도구로** 하고 있으며, 규칙을 하나 더할 때마다 경계가 하나 더
      생기고 다음 결함이 거기서 난다.
      **구조적 원인**: 배제 봉투는 정답지를 깨끗이 유지하려 있는데 **그 오염을 흡수하도록
      설계된 층이 아직 없다** — `numeric.exhaustive`(거부권 O)와 `numeric.unreviewed-use`
      (거부권 X · Owner 판정)가 둘 다 PD-M4 미구현이라, SPEC §4.4.4 가 규정한 짝이 미완이고
      **지어진 층 하나가 두 몫을 지고 있다.**
      **비대칭이 방향을 정한다**: 소실은 되돌릴 수 없고(정답지에 없는 값은 영영 인용 불가 ·
      흔적도 없음) 오염은 되돌릴 수 있다(보이고 · 플래그가 잡고 · 최악이라도 CP1 에서 사람이
      걷어낸다). 재정 S7 의 「전수성 > 순도」가 옳으며, 다만 그 원칙이 **좁은 배제를 계속
      좁히는 방식**으로 집행되어 원칙과 집행이 반대로 가고 있었다.
    rotation_record: >-
      동결의 근거가 된 회전 4바퀴 — 넷 다 **실물 원천이 아니라 구성 입력**이었다.
      S7 배제 2종 신설 → 감수: 진짜 값 먹는다(4.5mm·12mm) → 고침 → 머리 쪽 구멍
      (Table 2.5mm) → 재봄 → 7+1 분해 → 고치려 함 → 그 수정이 1을 깨뜨림.
    not_a_value_space_change: >-
      ★ 이 선언은 값 공간을 바꾸지 않는다 — **값 공간을 언제까지 바꾸지 않는지**를 정한다.
      규율 11(CLAUDE.md §1)의 대상이 아니지만 실질이 재정급이라 Owner 재가로 세웠다.
    audit_note: >-
      ★ 감수자에게 — **배제 어형의 반례를 드는 것은 정당한 지적이며 등재된다.** 다만 이
      라운드의 처분은 **「등재하고 고치지 않음」**이다. 지적이 틀려서가 아니라 고칠 층이
      아직 없어서다(`release_condition`). 처분 어휘는 `기각`이 아니라 **`이연`**이다.
  exclusions:
    - id: figure-numeral
      condition:
        - "소수점 없는 정수"
        - "단위 없음"
        - "그 문자열이 `figures[].numerals` ∪ 전 `grounding.figure_refs[].numerals` 에 속함"
      reason_label: figure-numeral
      basis: "SPEC §2.5 · 재정 P-B"
      why: >-
        SPEC §2.5 는 `numerals` 를 **숫자 전수 대조의 정답지에 포함하지 않는다**고 이미 정했다.
        도면부호는 본문에 등장할 이유가 없고, 등장한다면 그것 자체가 도슨트 실패다(D2 독자상).
        도면부호를 정답지에 넣으면 `numeric.exhaustive` 가 그만큼 관대해지고, 그것은 P-B 가
        `numeric.unreviewed-use` 로 막으려던 구멍을 오히려 넓힌다. 본문에 도면부호를 쓰려면
        `fact` 로 **별도 등재**한다(§2.5 의 기존 규정 그대로).
      recording: >-
        **조용히 버리지 않는다.** 배제한 토큰은 `skipped[]` 에 `reason: "figure-numeral"` 로
        기록해 `numeric_inventory.skipped` 를 통해 CP1 이 "무엇이 수확에서 빠졌는가"를 보게
        한다 — 이 리포의 규율은 침묵이 아니라 시끄러운 기록이다.

    # =====================================================================
    # ★ 봉투 배제 첫 4종 — `match: enclosing-pattern` (2026-08-18 통주 2 실측 처분)
    #    통주 2 의 `origin: quoted` 30건 중 **23건이 오파싱 아티팩트**였다(M87~M109).
    #    그 라운드에서 관측된 계열은 넷뿐이었고 아래 넷이 그 넷이다.
    #    ★ 2026-08-19 재정 S7 이 **2종을 더했다**(아래 둘째 배너) — 통주 3 이 남긴 아티팩트
    #    M87~M89 의 건별 처분이다. 그중 `row-column-coordinate` 는 같은 날 후속 보수로 봉투가
    #    아니라 **토큰 조건 규칙**이 되었으므로(그 항목의 `form_change`), 지금 이 목록의
    #    `match: enclosing-pattern` 은 **5종**이고 토큰 조건 규칙은 `figure-numeral` 과
    #    `row-column-coordinate` **2종**이다. 이 배너의 "넷"은 2026-08-18 시점의 사실이지
    #    현재의 계수가 아니다(계수의 정본 = `enclosing_exclusions.required_why`).
    # =====================================================================
    - id: fp-format-triple
      tag: "[가설]"
      match: enclosing-pattern
      pattern: '\(\s*\d+\s*-\s*\d+\s*-\s*\d+\s*\)'
      reason_label: coordinate-triple
      basis: >-
        통주 2 실측 — `origin: quoted` 9건(M87~M93·M96·M97)이 전부 이 어형에서 나왔다.
        실물: `FP8 (1-5-2)` · `FP8(1-3-4)` · `FP (1-1-2)` · `FP6 (1-3-2)`.
      why: >-
        FP 형식의 3항 표기(부호-지수-가수 비트 폭)는 **수치가 아니라 형식 이름**이다. 그런데
        `range` 어형이 앞의 두 항을 `1-5` 로 집어 삼키고 셋째 항은 왼쪽 경계에서 소리 없이
        사라졌다 — 즉 이 어형은 **거짓 수치를 만들면서 동시에 진짜를 잃는** 두 겹의 결함이다.
        `1-5` 를 "1 이상 5 이하"로 읽은 정답지는 원문 어디에도 없는 주장을 담는다.
      open_question: >-
        ★ 미결 2건. ① **날짜꼴 오검출** — `(2020-01-15)` 같은 괄호 안 3항 정수는 이 패턴에
        걸린다. 실물에서 아직 만나지 않았고(통주 2 오검출 0건), 만나면 그 값은 서지 수확이
        따로 들고 있을 가능성이 높다. 첫 런 실측으로 상신한다. ② **괄호 없는 3항 표기** —
        `FP8 1-5-2` 처럼 괄호가 없는 표기는 잡지 못한다. 괄호를 요건으로 남긴 이유는 그것을
        떼는 순간 `2018-2020-2022` 같은 산문 나열까지 삼키기 때문이며, 좁게 틀리는 쪽을
        골랐다(넓게 틀리면 진짜 수치가 사라지고, 그 손실은 `skipped[]` 로도 드러나지 않는다).

    - id: bit-slice
      tag: "[가설]"
      match: enclosing-pattern
      pattern: '(?:\b\d+\s+)?<\s*\d+\s*:\s*\d+\s*>'
      reason_label: bit-slice
      basis: >-
        통주 2 실측 — `origin: quoted` 8건(M99~M106). 실물: `Act 0 <6:3>` → `0`·`<6`·`3` ·
        `Wdata 0 <4:2>` · `W0 <4:2>`.
      why: >-
        `<6:3>` 은 비트 [6:3] 구간의 지정이며 값이 아니다. `inequality` 어형이 `<6` 을
        "6 미만"으로 읽었고, 이것은 정답지에 **원문이 하지 않은 부등호 주장**을 심는다.
        앞의 신호 인덱스(`Act 0` 의 `0`)까지 봉투에 넣는 이유는 그것이 슬라이스가 붙는
        신호의 번호이지 독립된 수치가 아니기 때문이다 — `W0` 처럼 문자에 붙은 형태는
        토큰 경계가 이미 막고 있으므로 선행 인덱스는 **선택 항**으로 둔다.
      open_question: >-
        선행 인덱스를 봉투에 넣는 폭이 미결이다. `at least 12 <3:0>` 처럼 **진짜 수치가
        슬라이스 앞에 오는** 문장은 그 수치를 함께 삼킨다. 통주 2 에서 그런 자리는 0건이었고,
        삼킨 사실은 `skipped[]` 에 봉투 전문으로 남아 눈에 보인다 — 보이는 손실이므로
        잠정 채택하고 첫 런 실측으로 상신한다.

    - id: figure-or-table-number
      tag: "[가설]"
      match: enclosing-pattern
      pattern: '(?i)(?:figures?|figs?|tables?)\.?\s*\*{0,2}\s*\d+\*{0,2}'
      reason_label: figure-or-table-number
      basis: >-
        통주 2 실측 — `origin: quoted` 4건(M94·M95·M98·M109). 실물: `Table 2` ·
        `FIG. **60**` · `FIG. **3**` · `FIG. **1**`.
      why: >-
        도면·표의 **번호**는 도면부호(`figures[].numerals`)와 다른 것이다 — 도면부호는 부품을
        가리키고 이것은 그림 자체를 가리킨다. 그래서 기존 `figure-numeral` 배제가 이것을
        잡지 못했고, `FIG. 60` 의 `60` 이 스칼라 수치로 정답지에 올랐다. 문서 내부 참조는
        발명의 사실이 아니라 **문서의 배선**이며, 어떤 서사도 그것을 근거로 삼지 않는다.
      markdown_bold_note: >-
        `\*{0,2}` 는 원천이 마크다운이라 붙는다 — 실물 인용이 `FIG. **60**` 이다. 강조 표기를
        패턴에서 빼면 봉투가 `FIG. ` 에서 끊겨 숫자에 닿지 못한다(통주 2 실측).
      open_question: >-
        ★ **[부분 해소 — 재정 2026-08-19 S7]** 구 문언 = *"`FIGS. 3 and 4` 처럼 **한 지시가
        두 번호**를 드는 어형은 첫 번호까지만 봉투에 든다. 둘째 번호는 여전히 스칼라로
        수확된다. 나열까지 삼키려면 `(?:\s*(?:,|and)\s*\d+)*` 를 붙여야 하는데, 그 꼬리는
        `FIG. 3 and 4 mm` 같은 자리에서 진짜 수치를 먹는다. 실물 어형의 빈도를 첫 런에서 세어
        상신한다."* 그 예고가 그대로 실현되어 **M87** 이 되었고(감수 C′-1 독립 재계수), 재정
        S7 이 건별 배제를 명했다. **이 항목은 고치지 않는다** — 꼬리는 가드를 단 별도 어형
        `figure-or-table-number-list` 가 든다(아래). 두 봉투는 같은 자리에서 겹치며 겹침 규율
        (`enclosing_exclusions.overlap_resolution`)상 **긴 쪽**이 남으므로 기록은 한 줄이다.
        **닫힌 것** = 꼬리의 수가 **단위·문자가 뒤따르지 않는 맨 정수**일 때(`Tables 1 and 2.`).
        **남은 것** = 꼬리 뒤에 낱말이 오는 흔한 어형(`FIGS. 3 and 4 illustrate …`)은 여전히
        첫 번호까지만 든다 — 가드가 그 자리를 **일부러 포기**했다(그것을 열면 `FIG. 3 and 4 mm`
        가 함께 열린다). 좁게 틀리는 쪽을 골랐고, 새는 것은 도면 번호이지 진짜 수치가 아니다.

    - id: subscript-index
      tag: "[가설]"
      match: enclosing-pattern
      pattern: '\.sub\.\s*[A-Za-z]?\s*[−+\-]\s*\d+'
      reason_label: subscript-index
      basis: >-
        통주 2 실측 — `origin: quoted` 2건(M107·M108). 실물: `C.sub.j−1` · `CIN.sub.j−1`.
      why: >-
        `.sub.` 는 원천(USPTO 전문)의 **아래첨자 마크업**이고 `j−1` 은 첨자 인덱스 식이다.
        `1` 이 수치로 새어 나온 이유는 앞 문자가 U+2212(빼기 기호)라 ASCII 하이픈을 보는
        왼쪽 경계 기각을 **피해 갔기** 때문이다 — 같은 형태의 글자가 두 벌 존재한다는 사실
        하나로 토큰 경계가 뚫렸다. 인덱스는 자리이지 값이 아니다.
      why_two_minus_signs: >-
        패턴이 `[−+\-]` 로 두 벌을 다 드는 것은 관용이 아니라 **실측 요건**이다. U+2212 만
        적으면 ASCII 하이픈 표기(`C.sub.j-1`)를 놓치고, ASCII 만 적으면 통주 2 의 실물을
        놓친다. 어느 한쪽만 적는 것은 원천 표기 변이를 모르는 척하는 일이다.
      open_question: >-
        `X.sub.i` 처럼 **연산이 없는** 첨자는 이 패턴에 걸리지 않는다. 걸릴 필요도 없다 —
        숫자가 없으므로 수확 대상이 아니다. 다만 `X.sub.12` 같은 **숫자 첨자**는 봉투 밖이며
        스칼라로 수확된다. 그것이 값인지 자리인지는 첨자 관례의 문제라 실물 없이 정할 수
        없다(통주 2 에는 없었다).

    # =====================================================================
    # ★ 배제 2종 추가 — 재정 2026-08-19 S7 (정규 선상신-승인)
    #    ★ 형태는 **봉투 1 + 토큰 조건 1** 이다. 신설 당시에는 둘 다 봉투였고, 같은 날
    #    후속 감수(C′-1·D)가 `row-column-coordinate` 봉투가 **진짜 값을 삼키는 것**을
    #    실증해 그 항목만 토큰 조건 규칙으로 바뀌었다(항목의 `form_change`). 재정이 승인한
    #    것은 "M87~M89 를 건별로 배제한다"이지 특정 정규식이 아니므로, 좁히는 형태 교체는
    #    이행 충실화다(재정 S2 의 판별선).
