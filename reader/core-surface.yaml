# 공유 코어 표면 승인 목록 (K8 판정 8 의 참조 데이터 — 재정 2026-08-18 P-2 ⓑ)
#
# ── 이 파일이 왜 있는가 ────────────────────────────────────────────────────────
# `reader/schemas/material-spec.schema.json` 의 공유 코어(11키)는 patent-docent 와
# patent-historian 이 **같은 의미로 읽는 계약면**이다. 재정 P-2 ⓑ 는 그 계약면에 한 줄을
# 그었다 — "공유 필수 필드는 프로젝트 간 동일 의미, 프로젝트 고유 판단은 확장 블록에만."
#
# 문제는 기계가 "이 키가 프로젝트 판단인가" 를 **의미로** 판정할 수 없다는 것이다. 그래서
# 검사기는 오래 금칙 이름 목록(확장 전용 키)만 들고 있었고, sol 독립 감수(2026-08-18)가
# 그 구멍을 실물로 보였다: `patent.marketing_verdict` 라는 순전한 편집 판단을 `[공유 코어]`
# 표지까지 달아 코어에 심었는데 검사기는 findings=0 으로 통과시켰다. 판정은 이랬다 —
# *"Enforces known names, not the boundary principle."*
#
# 이 파일이 그 세계를 뒤집는다. 코어의 표면을 **열린 세계(금칙 목록)가 아니라 닫힌 세계
# (승인 목록)** 로 정의한다. 여기에 없는 경로가 코어에서 도달하면, 그 이름이 무엇이든
# **경계를 넘은 것**이다. 반대로 정당한 확장이라면 이 목록에 줄이 더해지고, 그 diff 한 줄이
# 곧 "두 프로젝트의 계약면을 고쳤다" 는 가시적 흔적이 된다. 계약면의 변경은 소리 없이
# 일어나서는 안 된다는 것 — 그것이 이 목록의 전부다.
#
# ── 무엇이 적혀 있는가 ────────────────────────────────────────────────────────
# 공유 코어 11키(schema·reader_version·spec_version·status·run_id·patent·claims·figures·
# items·provenance·review_requests — 11번째는 재정 2026-09-13 T59 ①)에서 **도달 가능한** property 경로 전량이다. `$ref` 는 해소해서 따라가고
# (`-> $defs/x`), 순환은 끊는다. `required[x]` 항목도 표면의 일부다 — 필수 여부의 변경 역시
# 계약면의 변경이기 때문이다. 확장 블록(`extensions`)은 **대상이 아니다**: 그 면은 프로젝트가
# 자기 판단을 늘리는 자리이므로 늘어나는 것이 정상이고, 그 규율은 K8 판정 4·5·6 이 본다.
#
# ── 갱신 절차 ────────────────────────────────────────────────────────────────
# 스키마 라인은 `material-spec/v0` 이고 **0.x = 미동결**(재정 N15)이다. 즉 지금 구간에서는
# 코어 표면이 자주 바뀌며, 그 잦음이 이 목록을 무의미하게 만들지 않는다 — 오히려 미동결
# 구간이야말로 "무엇이 언제 늘었는가" 가 기록으로만 남는 구간이다(N15 의 문언: 0.x 의 자유는
# **기록 없는 자유가 아니다**).
#
#   1. 스키마를 고친다.
#   2. `python3 tools/check_spec_refs.py --print-core-surface` 를 돌린다.
#   3. 그 출력의 `paths:` 블록으로 아래를 **통째로 교체**한다(정렬·중복 없음이 강제된다).
#   4. 커밋 diff 에 표면 변경이 드러나는지 눈으로 확인한다. 그 diff 가 감사의 대상이다.
#
# 검사기는 파일을 쓰지 않는다(read-only, 설계 요건 4). 붙여 넣는 일은 사람이 하며, 그 손이
# 곧 계약 개정의 서명이다. 목록의 부재·파싱 실패는 결함이 아니라 **환경 오류(exit 2)** 로
# 다룬다 — 목록이 없으면 경계를 잴 자가 없고, 그때 조용히 통과하는 것이 이 판정이 막으려는
# 바로 그 상태다.
#
# ★ 이 파일은 계약 라인을 선언하지 않는다(최상위 `schema:` 키가 없다). 스키마의 표면을
#   비추는 **참조 데이터**이지 독립한 계약이 아니기 때문이다 — `tools/retired-tokens.yaml`
#   이 K5 의 참조 데이터인 것과 같은 층이다.
