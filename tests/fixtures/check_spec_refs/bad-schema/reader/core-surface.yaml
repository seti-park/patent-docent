# 표본용 공유 코어 표면 승인 목록 (K8 판정 8 — 재정 P-2 ⓑ).
#
# 이 픽스처의 스키마 표본은 코어 10키를 **평평하게**(하위 property 없이) 두므로 실측 표면이
# 비어 있고, 그래서 승인 목록도 비어 있다. 정본과 서식은 같다 — 서식 정본과 갱신 절차는
# 리포의 `reader/core-surface.yaml` 머리말이 갖는다.
#
# 빈 목록은 "표면이 없다" 는 선언이지 "검사를 끈다" 는 뜻이 아니다: 이 스키마의 코어에
# property 가 하나라도 생기면 그 순간 승인되지 않은 경로로 잡힌다.
