# 런 종류 — 기계 판독 정본
#
# 근거: Owner 재정 2026-08-18 N10(구 재감수 B-01 해소) + P-9(예행 종료선).
# 로드맵은 회차가 아니라 **런 종류**로 정의된다. 게시 런 진입을 결정하는 것은 몇 번째 런인가가
# 아니라 **상태 조건의 충족 여부**다. 그 조건을 L0 가 런 시작 시점에 기계로 검사한다.
# 산문 주석은 KR, 필드명·enum·검사 id 는 EN 원문.

schema: run-kinds/v0
version: "0"

# ---------------------------------------------------------------------------
# 런 종류 2종
# ---------------------------------------------------------------------------
kinds:
  rehearsal:
    purpose: "파이프라인 통주 검증."
    publishes: false                 # 비게시
    requires_defense_layers: false   # 방어층 미완이어도 실행 가능
    # 종료선 (재정 2026-08-18 P-9 · 관할 정정 2026-08-19 P-15)
    # 예행은 '어디까지 돌려 보는 런'이 아니라 **게시만 뺀 완주**다. 중간에 끊으면 통주가
    # 검증하려던 것 — 단계 간 이음매 — 이 정확히 검증되지 않은 채 남는다.
    #
    # ★ 이 종료선이 사는 자리는 **여기 하나다**(재정 2026-08-19 P-15). 재정 원문:
    #   "예행 종료선(9-A)은 M1 요구사항이 아니라 **예행 런의 정의**다 — M1 요구사항표에서
    #   제거하고 예행 런 계약으로 이관한다(strip 도달은 M3~M10 이후 예행 시점의 요건)."
    #   즉 strip 미도달은 M1 의 미이행이 아니라 **아직 예행 시점이 아니라는 사실**이다.
    #   직전 재감수(2026-08-18)가 이 항목을 M1 요구사항표에서 **부분**으로 채점한 것이
    #   이 정정을 부른 실측이며, 재정은 채점을 뒤집는 대신 **표를 고쳤다**.
    #   같은 성질의 미결이 또 있으면 그 처분도 이 선례를 따른다.
    terminates_at: strip-output      # strip 산출까지 = 완전 리허설
    terminates_at_artifact: "50-gate/<variant>/thread.stripped.md"   # 재정 P-9 의 "strip 산출"의 실물
    includes_cp2_variant_selection: true   # CP2 변주 선택도 정상 수행한다
    excludes: [publication]          # 빼는 것은 게시 행위 하나뿐이다
    scope_note: >-
      strip 산출까지 완전 리허설한다(재정 P-9). CP2 변주 선택을 포함하며 게시만 제외한다.
      "예행이니 여기까지"로 임의 단축하지 않는다 — 단축분은 통주가 아니라 부분 시험이다.
    artifacts: >-
      산출물(재료·도면·변주·선택 데이터)은 실자산으로 보존한다. 예행이라는 이유로 버리지 않는다.
    deliverables:
      - id: through_run_report
        label: 통주 리포트
        rank: first-class            # 1급 산출물 — 부산물이 아니다 (재정 P-9)
        contents: [단계별 소요, 상신 이력, 발견 결함, 미가동 게이트 목록]
        why: >-
          예행의 산물은 게시물이 아니라 **파이프라인에 대한 지식**이다. 그 지식을 적을 자리를
          1급으로 두지 않으면 통주는 "돌려 봤다"는 기억으로만 남는다.
    verdict_requirements:
      - id: inactive_gates_enumerated
        rule: "예행 판정문은 미가동 게이트를 목록으로 명기한다."
        basis: "재정 2026-08-18 P-9 + N5 규율(강제의 범위를 실제보다 넓게 말하지 않는다)"
        note: >-
          방어층 미완 상태로 도는 런이므로 무엇이 돌지 않았는지가 판정문에 없으면
          판정이 실제보다 넓은 보증을 주장하게 된다. 목록은 통주 리포트의 항목과 같은 것이다.
    anchor_ledger: excluded
    anchor_ledger_note: >-
      예행 런은 앵커 원장에 편입하지 않는다. 다만 변주 선택 취향 데이터는 정상 수확한다(D10).
    promotion_to_publish: >-
      예행 산출물을 게시하려면 방어층을 완비한 뒤 게이트 전체를 재통과해야 한다(새 버전).
      예행 판정을 게시 자격으로 승계하지 않는다.

  publish:
    purpose: "게시물 산출."
    publishes: true
    requires_defense_layers: true
    entry_note: >-
      아래 requirements 를 전부 충족해야 런을 시작할 수 있다. 회차가 아니라 상태 조건이
      게시 런 진입을 결정한다.

# ---------------------------------------------------------------------------
# 게시 런 자격 요건 3종 (전부 충족해야 런 시작 가능)
# ---------------------------------------------------------------------------
requirements:
  - id: defense_layers
    description: "전 방어층 가동 — L1 정합·화행 플래그·계기·최종 심급."
    layers: [l1_veto, speech_act_flag, instrument, final_eyes]
  - id: figures_usage_rights_decision
    description: >-
      도면 사용권 재정 완료. 재정 파일 ID 가 run.yaml 에 기입되어 있고 그 파일이
      docs/decisions/ 에 실재해야 한다(재정 R11 — 첫 출하 전 Owner 재정 1회).
    run_yaml_key: figures.usage_rights_decision   # ★ run.yaml 안의 키 경로(요건 id 와 표기가 다르다)
    evidence: "run.yaml 의 figures.usage_rights_decision 값 + docs/decisions/<ID>.md 실재"
    null_semantics: >-
      값이 null 이면 사용권 재정이 아직 없다는 뜻이다. rehearsal 런에서는 정상이며
      자산 생성·내부 검토가 허용된다. publish 런에서는 이 요건이 미충족이므로 런이 시작되지 않는다.
  - id: template_freeze
    description: "템플릿 동결 완료."

# ---------------------------------------------------------------------------
# 집행 (재정 N10 — 기계 봉쇄)
# ---------------------------------------------------------------------------
enforcement:
  check_id: run.publish-preconditions
  rule_source: contracts/l0-format.yaml   # rules[] 에 stage: run-start 로 등재됨
  when: "런 시작(source 스테이지 진입 전)"
  applies_to: publish
  on_unmet: halt
  on_unmet_note: "미충족 시 런 시작 불가. 부분 가동으로 진행하지 않는다."
  report_row: contracts/schemas/verdict-check-row.schema.json   # 판정 행 서식(재정 N5)

# ---------------------------------------------------------------------------
# run.yaml 결속
# ---------------------------------------------------------------------------
run_yaml_field: run_kind
run_kind_enum: [rehearsal, publish]
first_run: rehearsal          # 재정 N10 — 첫 런 = 예행

amendment: "배치 리뷰 상신 → Owner 재정 → docs/decisions/ 등재 → 이 파일 수정"
