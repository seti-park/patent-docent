# 형식 파라미터 시트 — 기계 판독 정본
#
# 근거: 헌장 D11(형식) ④ + Owner 재정 2026-08-18 N-D11.
# 헌장 D11 은 형식의 정체성 4문장만 갖고, 형식의 **모든 수치**는 이 시트가 관할한다.
# 시트는 배치 리뷰의 Owner 재정으로 교정되며, 그 교정에 헌장 개정은 필요하지 않다.
# 산문 주석은 KR, 키·enum·정규식은 EN 원문.
#
# 다른 계약 파일은 `format-parameters.yaml#<키>` 표기로 이 시트를 가리킨다.
# `<키>` 는 아래 `parameters:` 아래의 경로다(예: `#tweet_count` · `#stop_shape.sentences_max`).
# 값 사본을 다른 파일에 두지 않는다 — 단일 진원.

schema: format-parameters/v0
version: "0"

# ---------------------------------------------------------------------------
# 1. 출처 태그 — 언제 무엇으로 의심하는가 (재정 2026-08-18 N-D11)
#    태그는 값의 신뢰 등급이 아니라 **의심의 순서**를 정한다.
# ---------------------------------------------------------------------------
tags:
  "[물리]":
    meaning: "플랫폼이 강제하는 값. 우리 판단의 여지가 없다."
    update_trigger: "플랫폼이 바뀔 때만 갱신한다."
    feedback_rank: none          # 환류로 의심하지 않는다
  "[전승]":
    meaning: "외부 경험칙. 우리가 실측하지 않고 물려받은 값이다."
    update_trigger: "환류 실측이 어긋나면 배치 리뷰에 상신한다."
    feedback_rank: 2             # 환류 검증 2순위
  "[가설]":
    meaning: "우리 추정. 근거는 설계 판단이며 실측이 없다."
    update_trigger: "환류 실측을 최우선으로 대조한다."
    feedback_rank: 1             # 환류 검증 1순위 = 배치 리뷰 최우선 교정 후보
    review_priority: "`[가설]` 항목 전체가 배치 리뷰의 **최우선 교정 후보**다.
      특히 `stop_shape.*` 는 재정 2026-08-18 N3 이 명시적으로 최우선 후보로 지목했다."

# ---------------------------------------------------------------------------
# 2. 항목 서식 — 전 항목 공통 5키
# ---------------------------------------------------------------------------
item_schema:
  value: "값 자체."
  tag: "출처 태그. `[물리]` | `[전승]` | `[가설]` 중 하나."
  basis: "근거. 헌장 조항 + 재정 항목."
  enforced_by: "이 값을 집행하는 L0 규칙 id, 또는 `advisory`(측정만), 또는 `none`(비집행 해석 기준)."
  note: "해석·적용 범위·주의."
  tag_assigned_by: >-
    선택 키. 재정이 태그를 직접 지정하지 않아 총괄이 배정한 항목에만 `director` 를 적는다
    (우리가 붙인 태그임을 감사 가능하게 남긴다).

# ---------------------------------------------------------------------------
# 3. 개정 절차 (헌장 D11 ④ — 헌장 개정 불요)
# ---------------------------------------------------------------------------
amendment:
  procedure: "배치 리뷰 상신 → Owner 재정 → docs/decisions/ 등재 → 이 파일 수정"
  charter_amendment_required: false
  note: >-
    런 중 즉석 조정·자동 등재는 금지한다. 값을 고치면 `version` 을 올리고
    `basis` 에 새 재정 ID 를 병기한다.

# ---------------------------------------------------------------------------
# 4. 파라미터 (v0 값 = 기존 재정값 그대로)
# ---------------------------------------------------------------------------
parameters:

  # --- 채널 물리 -----------------------------------------------------------
  weighted_length:
    value:
      version: 3
      scale: 100
      default_weight: 200
      emoji_parsing_enabled: true
      transformed_url_length: 23
      ranges:
        - { start: 0,    end: 4351,  weight: 100 }
        - { start: 8192, end: 8205,  weight: 100 }
        - { start: 8208, end: 8223,  weight: 100 }
        - { start: 8242, end: 8247,  weight: 100 }
    tag: "[물리]"
    basis: "D11 + 재정 2026-08-17 R5"
    enforced_by: format.body-length
    note: >-
      twitter-text v3 구성을 그대로 채택한다. weighted = sum(weight) / scale.
      URL 은 매칭 구간 전체를 transformed_url_length * scale 로 치환한 뒤 합산하고,
      이모지 그래핌 클러스터는 클러스터 전체가 default_weight 1회로 계산된다.
      ranges 밖의 코드포인트는 default_weight 를 적용한다(CJK 등).
      ★ 길이 경계값(body_char_min·body_char_max·length_by_slot)은 전부 이 가중 글자 수
      기준이다(코드포인트 수 아님).

  post_char_limit:
    value: 280
    tag: "[물리]"
    basis: "D11 \"피드에서 ~280자로 접힌다\""
    enforced_by: none
    note: "가중 기준 플랫폼 상한. 실효 집행은 body_char_max(260)가 한다 — 이 값은 상한의 출처 기록이다."

  images_per_post_max:
    value: 4
    tag: "[물리]"
    basis: "D11"
    enforced_by: format.images-per-post
    note: "트윗별 fig 항목 수 ≤ 4 (2026 실측)."

  long_form_post:
    value: forbidden
    tag: "[물리]"
    basis: "D11 ①"
    enforced_by: none
    note: "장문 포스트 금지 — 피드 접힘·도달 열세. 채널 선택 단계의 제약이며 트윗 단위 검사 대상이 아니다."

  # --- 전승 경험칙 ---------------------------------------------------------
  body_char_max:
    value: 260
    tag: "[전승]"
    basis: "D11 + 재정 2026-08-17 R5·R6"
    enforced_by: format.body-length
    note: "가중 글자 수 상한. tail 슬롯은 면제(length_by_slot 참조)."

  hashtags_max:
    value: 0
    tag: "[전승]"
    basis: "D11"
    enforced_by: format.hashtag-zero
    note: "'#' + 문자로 시작하는 토큰 0개(전 트윗)."

  link_isolation:
    value: "tail 슬롯에만 허용"
    tag: "[전승]"
    basis: "D11"
    enforced_by: format.no-link-in-body
    note: "URL 은 tail 슬롯에만 둔다(링크 격리 — 본문 금지)."

  standalone_survival:
    value: required
    tag: "[전승]"
    tag_assigned_by: director
    basis: "D11(알고리즘의 중간 트윗 단독 노출)"
    enforced_by: none
    note: "모든 트윗이 맥락 없이 단독 생존 가능해야 한다. 자문 — SPEC §4.1 #11."

  one_idea_per_tweet:
    value: required
    tag: "[전승]"
    tag_assigned_by: director
    basis: "D11"
    enforced_by: none
    note: "트윗 하나에 아이디어 하나. 자문."

  line_break_scannability:
    value: required
    tag: "[전승]"
    tag_assigned_by: director
    basis: "D11"
    enforced_by: annotation.schema
    note: "문장 단위 줄바꿈(주석층 문법상 문장 1개 = 줄 1개)."

  # --- 가설 (배치 리뷰 최우선 교정 후보) -----------------------------------
  tweet_count:
    value:
      min: 6
      max: 12
      overflow_policy: >-
        강한 전시물이 12개를 넘으면 상한 12를 유지한다. DESIGN 이
        20-design/blueprint.json 의 overflow_proposal 에 "강한 12 선별" 또는
        "시리즈 분할"을 제안하고 Owner 가 결정한다. 엔진은 단독 결정하지 않는다. (재정 R5)
    tag: "[가설]"
    basis: "D11 + 재정 2026-08-17 R5"
    enforced_by: format.tweet-count
    note: "트윗 수는 강한 전시물 수의 종속변수다(분량을 채우려는 분할 금지). 초기 런은 보수적으로(적은 쪽)."

  body_char_min:
    value: 180
    tag: "[가설]"
    basis: "D11 + 재정 2026-08-17 R6"
    enforced_by: format.body-length
    note: "적용 슬롯 = stop·pivot 전용. 훅·착지는 상한만 지키고 꼬리는 면제한다."

  length_by_slot:
    value:
      unit: weighted_characters
      by_slot:
        hook:    { min: null, max: 260, exempt: false }
        stop:    { min: 180,  max: 260, exempt: false }
        pivot:   { min: 180,  max: 260, exempt: false }
        landing: { min: null, max: 260, exempt: false }
        tail:    { min: null, max: null, exempt: true }
    tag: "[가설]"
    tag_assigned_by: director
    basis: "재정 2026-08-17 R6"
    enforced_by: format.body-length
    note: >-
      태그 분리 — **하한(180)은 `[가설]`, 상한(260)은 `[전승]`**이다.
      항목 태그가 하한을 따르는 것은 총괄 배정이며, 값 단위 태그는 body_char_min·body_char_max 가 정본이다. 표를 한 항목으로 묶었을 뿐
      두 값의 의심 순서는 다르다(하한이 배치 리뷰 1순위).
      min: null = 하한 미적용, exempt: true = 규격 면제. 단위는 weighted_length 기준 가중 글자 수.

  slot_placement:
    value:
      hook:
        count: { min: 1, max: 1 }
        position: first          # T1 고정
      landing:
        count: { min: 1, max: 1 }
        position: any
      tail:
        count: { min: 0, max: 1 }
        position: last           # 존재하면 마지막 트윗
      other:
        # hook·landing·tail 로 지목되지 않은 나머지 전 트윗의 슬롯 값
        allowed: [stop, pivot]
    tag: "[가설]"
    tag_assigned_by: director
    basis: "재정 2026-08-17 R6"
    enforced_by: format.slot-count
    note: "라벨 조작으로 길이 하한을 우회하는 뒷문을 막는다."

  slot_enum:
    value: [hook, stop, pivot, landing, tail]
    tag: "[가설]"
    tag_assigned_by: director
    basis: "D11 ③ 슬롯 아크"
    enforced_by: annotation.schema
    note: "헌장 D11 ③ 의 아크(훅 → 전시 스톱들(반전 포함) → 착지 → 꼬리)를 슬롯 이름으로 고정한 것이다."

  stop_shape:
    edited_assets_min:
      value: 1
      tag: "[가설]"
      basis: "D11 + 재정 2026-08-18 N3"
      enforced_by: format.stop-shape
      note: >-
        편집 자산(크롭 도면 또는 자작 다이어그램·수치 카드) ≥ 1. 원본 도면만으로 한정하지 않는다
        (R11 잠정 편집 규칙과 정합). 배치 리뷰 최우선 교정 후보.
    sentences_max:
      value: 2
      tag: "[가설]"
      basis: "D11 + 재정 2026-08-18 N3"
      enforced_by: format.stop-shape
      note: >-
        문장 수 ≤ 2. 문장 계수 규칙(약어 예외 목록 포함)의 정본은
        contracts/l0-format.yaml 의 sentence_counting 이다. 배치 리뷰 최우선 교정 후보.
    applies_to:
      value: [stop, pivot]
      tag: "[가설]"
      tag_assigned_by: director
      basis: "재정 2026-08-18 N3"
      enforced_by: format.stop-shape
      note: "본문 전시 스톱 + 반전 스톱 전용. hook·landing·tail 은 대상이 아니다."

  images_per_tweet_principle:
    value: 1
    tag: "[가설]"
    basis: "D11"
    enforced_by: none
    note: "원칙은 1장이고, 갤러리(원본 + 확대 주석판)는 필요할 때만 쓴다. 자문 — 상한 집행은 images_per_post_max 가 한다."

  reading_time_minutes:
    value: { min: 3, max: 4 }
    tag: "[가설]"
    basis: "D11 + 재정 2026-08-17 R5"
    enforced_by: none
    note: "소비 시간은 **도면 감상을 포함해** 해석한다. 비집행 해석 기준 — 측정도 판정도 하지 않는다."

  total_words_extreme:
    value: { below: 200, above: 800 }
    tag: "[가설]"
    tag_assigned_by: director
    basis: "재정 2026-08-17 R5"
    enforced_by: advisory
    note: >-
      총 단어수는 구속 조건이 아니라 자문 지표다. 이 범위 밖이면
      advisory_measurements.extreme: true 를 기록하고 소견 최상단에 강조 표기한다. 거부권 없음.
