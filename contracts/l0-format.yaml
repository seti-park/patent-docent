# L0 형식 규격 — 기계 판독 정본
#
# 근거: 헌장 D11(형식)·D8(게이트 구조) + Owner 재정 2026-08-17 R5·R6·R7.
# 이 파일은 L0 결정론 게이트가 집행하는 문언의 정본이다. 스펙(docs/SPEC.md §4.4)의
# 서술이 이 파일과 어긋나면 이 파일이 이긴다(계약 파일 = 단일 진원).
# 산문 주석은 KR, 규칙 id·슬롯명·정규식은 EN 원문.

schema: l0-format/v0
version: "0"

# ---------------------------------------------------------------------------
# 1. X 가중 글자 수 (재정 R5 — "글자 수 측정은 X 가중 계산 규칙 기준", D11)
#    twitter-text v3 구성을 그대로 채택한다.
#    weighted = sum(weight) / scale.
#    URL 은 매칭 구간 전체를 transformed_url_length * scale 로 치환한 뒤 합산한다.
#    이모지 그래핌 클러스터는 클러스터 전체가 default_weight 1회로 계산된다.
#    아래 ranges 밖의 코드포인트는 default_weight(=2자) 를 적용한다(CJK 등).
#    ★ L0 의 180/260 경계는 전부 이 가중 글자 수 기준이다(코드포인트 수 아님).
# ---------------------------------------------------------------------------
weighted_length:
  version: 3
  scale: 100
  default_weight: 200
  emoji_parsing_enabled: true
  transformed_url_length: 23
  ranges:
    - { start: 0,    end: 4351,  weight: 100 }
    - { start: 8192, end: 8205,  weight: 100 }
    - { start: 8208, end: 8223,  weight: 100 }
    - { start: 8242, end: 8247,  weight: 100 }

# ---------------------------------------------------------------------------
# 2. 슬롯 배치 (재정 R6 — 라벨 조작으로 길이 하한을 우회하는 뒷문 봉쇄, D11 슬롯 개수)
#    집행 규칙 = format.slot-count.
# ---------------------------------------------------------------------------
slots:
  enum: [hook, stop, pivot, landing, tail]
  placement:
    hook:
      count: { min: 1, max: 1 }
      position: first          # T1 고정
    landing:
      count: { min: 1, max: 1 }
      position: any
    tail:
      count: { min: 0, max: 1 }
      position: last           # 존재하면 마지막 트윗
    other:
      # hook·landing·tail 로 지목되지 않은 나머지 전 트윗의 슬롯 값
      allowed: [stop, pivot]

# ---------------------------------------------------------------------------
# 3. 길이 (재정 R6 — 하한은 본문 전시 스톱·반전 스톱에만, 훅·착지는 상한만, 꼬리 면제)
#    단위 = 위 weighted_length 기준 가중 글자 수. 집행 규칙 = format.body-length.
#    min: null = 하한 미적용, exempt: true = 규격 면제.
# ---------------------------------------------------------------------------
length:
  unit: weighted_characters
  by_slot:
    hook:    { min: null, max: 260, exempt: false }
    stop:    { min: 180,  max: 260, exempt: false }
    pivot:   { min: 180,  max: 260, exempt: false }
    landing: { min: null, max: 260, exempt: false }
    tail:    { min: null, max: null, exempt: true }

# ---------------------------------------------------------------------------
# 4. 트윗 수 (D11)
# ---------------------------------------------------------------------------
tweet_count:
  min: 6
  max: 12
  overflow_policy: >-
    강한 전시물이 12개를 넘으면 상한 12를 유지한다. DESIGN 이
    20-design/blueprint.json 의 overflow_proposal 에 "강한 12 선별" 또는
    "시리즈 분할"을 제안하고 Owner 가 결정한다. 엔진은 단독 결정하지 않는다. (재정 R5)

# ---------------------------------------------------------------------------
# 5. 전시 스톱의 형태 (D11 문언 직접 집행: "1트윗 = 1전시물 = 도면 1장 + 2문장 이하")
#    집행 규칙 = format.stop-shape. 대상은 stop 슬롯뿐이며
#    pivot·hook·landing·tail 은 대상이 아니다(D11 이 도면·문장 수를 규정하지 않음).
# ---------------------------------------------------------------------------
stop_shape:
  applies_to: [stop]
  fig_items: { min: 1 }        # fig 항목 ≥ 1 (fig: none 금지)
  sentences: { max: 2 }        # 문장 수 ≤ 2

# ---------------------------------------------------------------------------
# 6. L0 규칙 최종 목록 (전 항목 거부권 있음 — L0 는 거부권 층이다, D8)
# ---------------------------------------------------------------------------
rules:
  - id: format.tweet-count
    veto: true
    basis: "D11"
    note: "6 ≤ N ≤ 12. 트윗 수는 강한 전시물 수의 종속변수다."
  - id: format.slot-count
    veto: true
    basis: "D11 + 재정 2026-08-17 R6"
    note: "신설. §2 slots.placement 집행 — 훅 1@T1 · 착지 1 · 꼬리 0~1@마지막 · 나머지 stop|pivot."
  - id: format.body-length
    veto: true
    basis: "D11 + 재정 2026-08-17 R5·R6"
    note: "§3 length.by_slot 집행. 단위는 X 가중 글자 수."
  - id: format.stop-shape
    veto: true
    basis: "D11"
    note: "신설(감수 B9 해소). §5 stop_shape 집행. 헌장 문언의 직접 집행이나 신설 거부권이므로 Owner 확인 대상으로 병기한다."
  - id: format.hashtag-zero
    veto: true
    basis: "D11"
    note: "'#' + 문자로 시작하는 토큰 0개(전 트윗)."
  - id: format.no-link-in-body
    veto: true
    basis: "D11"
    note: "URL 은 tail 슬롯에만 허용한다(링크 격리)."
  - id: format.images-per-post
    veto: true
    basis: "D11"
    note: "트윗별 fig 항목 수 ≤ 4."
  - id: format.new-term-budget
    veto: true
    basis: "D11 + D7"
    note: "블루프린트 new_terms[] 에 선언된 용어만 대상. 트윗별 최초 등장 ≤ 1 그리고 최초 등장 트윗 안에 선언된 gloss 존재."
  - id: annotation.schema
    veto: true
    basis: "D8"
    note: "주석층 문법 전량 + 프런트매터 5키 + spec_digest 일치(SPEC §3.2)."
  - id: annotation.missing-tag
    veto: true
    basis: "D8"
    note: "모든 문장에 태그 1개 이상([M..] 또는 [narrative])."
  - id: citation.resolve
    veto: true
    basis: "D6 규율 ① + D8"
    note: "모든 인용 ID 가 동결본 items[] 에 존재하고 status != retracted."
  - id: numeric.exhaustive
    veto: true
    basis: "D8"
    note: "§8 numeric 집행. 정답지에 active fact 4 origin 전부 포함."

# ---------------------------------------------------------------------------
# 7. 자문 측정 (거부권 없음 — 게이트 러너가 측정만 하고 결함을 발행하지 않는다)
#    재정 R5: 총 단어수(400~600)는 L0 에서 삭제되고 자문 지표로 강등되었다.
#    "소비 3~4분"은 도면 감상을 포함해 해석한다(D11).
# ---------------------------------------------------------------------------
advisory_measurements:
  veto: false
  total_words:
    definition: "공백 분할 토큰 수. tail 슬롯은 계산에서 제외한다."
    record_at: "50-gate/<variant>/verdict.json 의 advisory_measurements.total_words"
    extreme_thresholds: { below: 200, above: 800 }
    extreme_handling: >-
      total_words < 200 또는 > 800 이면 advisory_measurements.extreme: true 를 기록하고
      소견 메모(65-critique/<variant>/memo.md) 최상단에 강조 표기한다. 거부권은 없다.

# ---------------------------------------------------------------------------
# 8. 숫자 전수 대조 (D8 이 명시적으로 요구하는 유일한 내용 검사)
#    집행 규칙 = numeric.exhaustive. 대조 대상 텍스트는 출하본(strip 산출)이다.
#    ★ 이 블록이 토큰화·정규화의 정본이다(감수 M14 해소).
# ---------------------------------------------------------------------------
numeric:
  target_text: shipped          # 주석본이 아니라 출하본
  match_policy: exact-only      # 근사 일치·반올림 허용 없음 (D7)
  match_key: "{value_normalized}|{unit or ''}"

  # 정답지 출처 4종. 재료가 아닌 곳에서 정답을 끌어오지 않는다.
  answer_sources:
    - id: frozen_facts
      description: "items[] 중 kind == fact && status == active 의 value_normalized + unit. origin 4종(quoted·derived·figure-sourced·bibliographic) 전부 포함한다."
    - id: patent_number
      description: "patent.number"
    - id: patent_dates
      description: "patent.dates.priority / .filing / .publication"
    - id: run_whitelist
      description: "run.yaml 의 numeric_whitelist[] 명시 항목만. 기본값은 비어 있으며 CP2 봉투에 전량 인쇄한다."

  # 토큰화: 우선순위 순으로 시도하고 매칭된 구간은 소비한다(긴 패턴 우선).
  tokenizers:
    - { rank: 1, kind: patent-number, pattern: '\b[A-Z]{2}\s?\d{6,}(?:\s?[A-Z]\d?)?\b' }
    - { rank: 2, kind: iso-date,      pattern: '\b\d{4}-\d{2}-\d{2}\b' }
    - { rank: 3, kind: en-date,       pattern: '\b(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\.?\s+\d{1,2},\s+\d{4}\b' }
    - { rank: 4, kind: range,         pattern: '\b\d+(?:\.\d+)?\s*(?:-|–|—|to)\s*\d+(?:\.\d+)?\s*[A-Za-zµ%°]*\b' }
    - { rank: 5, kind: percent,       pattern: '\b\d+(?:\.\d+)?\s*%' }
    - { rank: 6, kind: multiplier,    pattern: '\b\d+(?:\.\d+)?\s*[x×]\b' }
    - { rank: 7, kind: value-unit,    pattern: '\b\d[\d,]*(?:\.\d+)?\s*(?:nm|µm|um|mm|cm|m|GHz|MHz|W|mW|V|mV|A|mA|J|pJ|TOPS|GB|MB|Gb|bit|bits|°C|K)\b' }
    - { rank: 8, kind: bare-year,     pattern: '\b(?:19|20)\d{2}\b' }
    - { rank: 9, kind: bare-number,   pattern: '\b\d[\d,]*(?:\.\d+)?\b' }

  # 정규화 규칙
  normalization:
    thousands_separator: "',' 제거"
    decimals: "후행 0 제거(0.80 → 0.8), 선행 0 보존(0.8 유지), .8 → 0.8"
    unicode_digits: "ASCII 로 정규화"
    units: "소문자화 + 별칭 사전 적용. 별칭 사전은 입법 대상이며 Owner 재정으로 확장한다."
    unit_aliases:
      um: "µm"
      micron: "µm"
      "℃": "°c"
    percent: "unit = '%'"
    multiplier: "unit = 'x'"
    range: "두 끝값으로 분해해 각각 대조. 추가로 범위 자체를 'a-b|unit' 키로도 시도한다(재료가 범위를 한 항목으로 담은 경우)."
    date: "YYYY-MM-DD 로 환산. 연도 단독은 'YYYY|year'."
    patent_number: "공백·하이픈 제거 + 대문자화"

# ---------------------------------------------------------------------------
# 9. 폐지된 규칙 (재정 2026-08-17)
#    로더는 아래 id 를 L0 규칙으로 로드하지 않는다. 부활은 Owner 재정 사항이다.
# ---------------------------------------------------------------------------
retired:
  - id: format.word-budget
    retired_at: 2026-08-17
    basis: "재정 2026-08-17 R5 (D11 개정)"
    reason: >-
      총 단어수(400~600)는 L0 구속에서 삭제되고 자문 측정으로 강등되었다.
      측정 자체는 §7 advisory_measurements.total_words 로 계속하되 거부권이 없다.
  - id: lexicon.forbidden
    retired_at: 2026-08-17
    basis: "재정 2026-08-17 R7 (D3 집행 의미론 정정)"
    reason: >-
      금지 대상은 어휘가 아니라 화행 3종이다. 금지 어휘 regex 사전(구 forbidden.yaml)은
      만들지 않으며, 유일한 기계층은 거부권 없는 화행 플래그다
      (contracts/lexicon/speech-acts.yaml, CP2 첨부).
