# L0 형식 규격 — 기계 판독 정본
#
# 근거: 헌장 D11(형식)·D8(게이트 구조) + Owner 재정 2026-08-17 R5·R6·R7
#       + Owner 재정 2026-08-18 N-D11(형식 수치 시트 이관) · N2(용어 자동 검사 완전 제거)
#       · N3(스톱 형태 정정 + 문장 계수 규칙) · N10(런 종류 관문) + M0.5 재감수 M-06·N-01.
# 이 파일은 L0 결정론 게이트가 집행하는 문언의 정본이다. 스펙(docs/SPEC.md §4.4)의
# 서술이 이 파일과 어긋나면 이 파일이 이긴다(계약 파일 = 단일 진원).
#
# ★ 단, 형식의 모든 **수치**는 이 파일이 아니라 **형식 파라미터 시트**가 관할한다(재정 N-D11).
#   정본 = contracts/format-parameters.yaml. 이 파일은 그 키를 **가리키기만** 하며 값 사본을 두지 않는다.
#   값 사본을 두면 두 진원이 생기고, 그 순간 시트의 교정이 게이트에 반영되지 않는다.
#
# 표기 규약
#   `params:` — 문자열 또는 문자열 배열. 각 원소는 `format-parameters.yaml#<키>` 형식의 포인터다.
#               `<키>`는 시트의 항목 키이며(현행 구조에서는 시트의 `parameters:` 아래),
#               점 표기는 하위 항목을 가리킨다(예: `stop_shape.sentences_max`).
#   `stage:`  — 규칙의 실행 시점. `thread`(스레드 원고 판정, 기본) 또는 `run-start`(런 시작 관문).
# 산문 주석은 KR, 규칙 id·슬롯명·정규식은 EN 원문.

schema: l0-format/v0
version: "0"

# 포인터가 가리키는 시트의 실경로(로더가 해소한다).
params_source: contracts/format-parameters.yaml

# ---------------------------------------------------------------------------
# 1. X 가중 글자 수 — [이관 완료]
#    구 weighted_length 블록(version 3 · scale 100 · default_weight 200 ·
#    emoji_parsing_enabled true · transformed_url_length 23 · ranges 4행)의 값 전량은
#    format-parameters.yaml 의 `weighted_length` 항목([물리])으로 이관되었다(재정 N-D11).
#    측정 의미론은 불변이다: weighted = sum(weight) / scale, URL 은 매칭 구간 전체를
#    transformed_url_length * scale 로 치환, 이모지 그래핌 클러스터는 클러스터 전체가
#    default_weight 1회, ranges 밖 코드포인트는 default_weight(CJK 등).
#    ★ L0 의 길이 경계는 전부 이 가중 글자 수 기준이다(코드포인트 수 아님).
# ---------------------------------------------------------------------------
weighted_length:
  params: format-parameters.yaml#weighted_length

# ---------------------------------------------------------------------------
# 2. 슬롯 배치 — [이관 완료]
#    구 slots.enum → format-parameters.yaml#slot_enum
#    구 slots.placement(hook 1@first · landing 1 · tail 0~1@last · other allowed [stop,pivot])
#      → format-parameters.yaml#slot_placement
#    집행 규칙 = format.slot-count(라벨 조작으로 길이 하한을 우회하는 뒷문 봉쇄, 재정 R6).
# ---------------------------------------------------------------------------
slots:
  params:
    - format-parameters.yaml#slot_enum
    - format-parameters.yaml#slot_placement

# ---------------------------------------------------------------------------
# 3. 길이 — [이관 완료]
#    구 length.by_slot 표(hook {null,260} · stop {180,260} · pivot {180,260} ·
#    landing {null,260} · tail exempt) → format-parameters.yaml#length_by_slot
#    상한 260 → #body_char_max, 하한 180(stop·pivot 전용) → #body_char_min.
#    단위 = 위 §1 가중 글자 수. 집행 규칙 = format.body-length.
#    min: null = 하한 미적용, exempt: true = 규격 면제(재정 R6 — 꼬리 면제는 길이 규격 결정이다).
# ---------------------------------------------------------------------------
length:
  unit: weighted_characters
  params:
    - format-parameters.yaml#length_by_slot
    - format-parameters.yaml#body_char_max
    - format-parameters.yaml#body_char_min

# ---------------------------------------------------------------------------
# 4. 트윗 수 — [이관 완료]
#    구 tweet_count.min/max(6/12)와 overflow_policy 문언 전량
#      → format-parameters.yaml#tweet_count
#    집행 규칙 = format.tweet-count. 트윗 수는 강한 전시물 수의 종속변수다(D11 ②).
# ---------------------------------------------------------------------------
tweet_count:
  params: format-parameters.yaml#tweet_count

# ---------------------------------------------------------------------------
# 5. 전시 스톱의 형태 — [수치 이관 + 정의 정정(재정 N3)]
#    구 stop_shape.applies_to/fig_items/sentences 의 **수치**는
#      format-parameters.yaml#stop_shape.{applies_to, edited_assets_min, sentences_max} 로 이관.
#    정의 정정 2건(재정 N3):
#      ① 이미지 요건이 "fig 항목 ≥ 1"에서 "**편집 자산** ≥ 1"로 바뀌었다.
#         원본 도면만으로 한정하지 않는다(재정 R11 잠정 편집 규칙과 정합).
#      ② 적용 대상이 [stop] 에서 [stop, pivot](본문 전시 스톱 + 반전 스톱)으로 확대되었다.
#    아래 술어 정의는 수치가 아니므로 이 파일이 관할한다(시트는 값만 갖는다).
#    집행 규칙 = format.stop-shape.
# ---------------------------------------------------------------------------
stop_shape:
  params:
    - format-parameters.yaml#stop_shape.applies_to
    - format-parameters.yaml#stop_shape.edited_assets_min
    - format-parameters.yaml#stop_shape.sentences_max
  edited_asset:
    definition: >-
      편집 자산 = 크롭 도면 또는 자작 다이어그램·수치 카드(재정 2026-08-18 N3 문언).
      원본 도면의 무편집 첨부는 편집 자산이 아니다.
    resolved_from: "30-figures/assets/manifest.json 의 edit_class (트윗 헤더 fig 항목이 가리키는 자산)"
    counted_edit_classes: [crop-only, self-authored]
    excluded_edit_classes: [annotated-internal]
    note: >-
      edit_class 열거의 정본은 SPEC §6.6·§7.5(재정 R11)다. crop-only = 크롭 도면,
      self-authored = 자작 다이어그램·수치 카드로 N3 문언의 두 종류에 1:1 대응한다.
      annotated-internal(publishable: false)의 계수 자격은 도면 사용권 재정 이후 재확인 대상이며,
      그때까지 계수하지 않는다.
  sentences:
    counting_rule: sentence_counting   # §6 — 결정론 보장(재정 N3)

# ---------------------------------------------------------------------------
# 6. 문장 계수 규칙 (재정 2026-08-18 N3 — 결정론 보장)
#    "문장 수 ≤ 2"가 판정이 되려면 문장 수가 결정론이어야 한다. 아래가 그 정본이다.
#    비교는 소문자화 후 수행한다. 예외 목록은 **입법 대상**이며 확장은 Owner 재정 사항이다(D7).
# ---------------------------------------------------------------------------
sentence_counting:
  primary_rule: >-
    주석층 문법상 문장 1개 = 줄 1개이므로(SPEC §3.2), 트윗의 문장 수 = 비어 있지 않은 본문 줄 수다.
  intra_line_recount: >-
    한 줄 안에 문장 종결부호가 2회 이상 나타나면 줄 안의 문장 수를 다시 센다(뒷문 봉쇄).
    경계 = 종결부호 뒤에 공백 또는 줄끝이 오는 지점.
  terminators: [".", "!", "?"]
  boundary_condition: "종결부호 다음 문자가 공백이거나 줄끝일 때만 경계로 센다."
  case_folding: lowercase        # 아래 예외 목록과의 비교는 소문자화 후
  exceptions:
    abbreviations:
      - "e.g."
      - "i.e."
      - "etc."
      - "vs."
      - "approx."
      - "no."
      - "fig."
      - "figs."
      - "inc."
      - "ltd."
      - "corp."
      - "co."
      - "dr."
      - "mr."
      - "ms."
      - "st."
      - "u.s."
      - "u.k."
      - "a.k.a."
    decimal_guard: "숫자 사이의 '.' 은 경계가 아니다(예: 3.9)."
    initial_guard: "단일 대문자 뒤의 '.' 은 경계가 아니다(예: A. B.)."
  amendment: "예외 목록의 확장·축소는 Owner 재정 사항이다(입법된 문언, D7)."

# ---------------------------------------------------------------------------
# 7. L0 규칙 최종 목록
#    각 항목의 stage 는 실행 시점, params 는 형식 파라미터 시트의 값 포인터다.
#    판정 결과는 전 항목이 verdict-check-row/v0 서식으로 보고된다(재정 N5,
#    contracts/schemas/verdict-check-row.schema.json).
#
#    ★ 거부권은 항목마다 `veto` 가 정한다 — 목록 전체의 성질이 아니다(2026-08-18 정정).
#      구 헤더는 "전 항목 거부권 있음 — L0 는 거부권 층이다(D8)"라고 적었고 그것이
#      사실이던 시절이 있었다. 재정 P-B 가 `numeric.unreviewed-use`(veto: false)를
#      이 목록에 들이면서 그 문장은 거짓이 되었다. 목록의 성질을 항목의 성질로
#      읽는 것이 정확히 M0.6 이 벌한 "강제의 범위를 실제보다 넓게 말하기" 다.
#      로더는 `veto` 를 항목에서 읽어야 하며 목록 위치에서 추정해서는 안 된다.
#      현재 `veto: false` 인 항목은 하나뿐이다 — `numeric.unreviewed-use`(SPEC §4.4.4).
# ---------------------------------------------------------------------------
rules:
  - id: run.publish-preconditions
    stage: run-start
    veto: true
    basis: "재정 2026-08-18 N10"
    definition_source: contracts/run-kinds.yaml
    note: >-
      신설. 게시 런(run_kind: publish)의 전제조건을 런 시작 시점에 검사한다.
      판정 문언의 정본은 contracts/run-kinds.yaml 이며, 미충족 시 런 시작 불가(halt)다.
      회차가 아니라 상태 조건이 게시 런 진입을 결정한다.
  - id: format.tweet-count
    stage: thread
    veto: true
    basis: "D11"
    params: format-parameters.yaml#tweet_count
    note: "트윗 수 상·하한 집행. 트윗 수는 강한 전시물 수의 종속변수다."
  - id: format.slot-count
    stage: thread
    veto: true
    basis: "D11 + 재정 2026-08-17 R6"
    params:
      - format-parameters.yaml#slot_enum
      - format-parameters.yaml#slot_placement
    note: "§2 슬롯 배치 집행 — 훅 1@T1 · 착지 1 · 꼬리 0~1@마지막 · 나머지 stop|pivot."
  - id: format.body-length
    stage: thread
    veto: true
    basis: "D11 + 재정 2026-08-17 R5·R6"
    params:
      - format-parameters.yaml#length_by_slot
      - format-parameters.yaml#body_char_min
      - format-parameters.yaml#body_char_max
      - format-parameters.yaml#weighted_length
    note: "§3 길이 집행. 단위는 X 가중 글자 수."
  - id: format.stop-shape
    stage: thread
    veto: true
    basis: "D11 + 재정 2026-08-18 N3"
    params:
      - format-parameters.yaml#stop_shape.applies_to
      - format-parameters.yaml#stop_shape.edited_assets_min
      - format-parameters.yaml#stop_shape.sentences_max
    note: >-
      §5 집행. 판정식 = 편집 자산(크롭 도면 또는 자작 다이어그램·수치 카드) ≥ 1 그리고
      문장 수 ≤ 2. 적용 슬롯 = stop·pivot(본문 전시 스톱 + 반전 스톱).
      문장 수는 §6 sentence_counting 으로 센다.
      ≥1·≤2 는 둘 다 [가설] 태그 — 배치 리뷰 최우선 교정 후보다(재정 N3).
  - id: format.hashtag-zero
    stage: thread
    veto: true
    basis: "D11"
    params: format-parameters.yaml#hashtags_max
    note: "'#' + 문자로 시작하는 토큰 0개(전 트윗)."
  - id: format.no-link-in-body
    stage: thread
    veto: true
    basis: "D11"
    params: format-parameters.yaml#link_isolation
    note: "URL 은 tail 슬롯에만 허용한다(링크 격리)."
  - id: format.images-per-post
    stage: thread
    veto: true
    basis: "D11"
    params: format-parameters.yaml#images_per_post_max
    note: "트윗별 fig 항목 수 상한 집행."
  - id: annotation.schema
    stage: thread
    veto: true
    basis: "D8"
    params:
      - format-parameters.yaml#slot_enum
      - format-parameters.yaml#line_break_scannability
    note: "주석층 문법 전량 + 프런트매터 5키 + spec_digest 일치(SPEC §3.2). 문장 1개 = 줄 1개."
  - id: annotation.missing-tag
    stage: thread
    veto: true
    basis: "D8"
    note: "모든 문장에 태그 1개 이상([M..] 또는 [narrative])."
  - id: citation.resolve
    stage: thread
    veto: true
    basis: "D6 규율 ① + D8"
    note: "모든 인용 ID 가 동결본 items[] 에 존재하고 status != retracted."
  - id: numeric.exhaustive
    stage: thread
    veto: true
    basis: "D8"
    note: "§9 numeric 집행. 정답지에 active fact 4 origin 전부 포함."
  - id: numeric.unreviewed-use
    stage: thread
    veto: false            # ★ 플래그다. 거부권이 없다 — 판정 적격자는 Owner 다(D7·D8)
    basis: "재정 2026-08-18 P-B"
    note: >-
      §9 numeric 의 짝 규칙. 본문이 **미참조(미검토) 수치**를 처음 인용하면 CP2 봉투에
      `미검토 수치 사용` 플래그를 자동 첨부한다. 판정 대상 = 출하본이 쓴 MATCH_KEY 중
      `10-read/convergence.json#numeric_inventory.unreferenced` 에 속한 것.
      ★ 이 규칙이 있는 이유는 P-B 의 귀결을 닫기 위해서다 — 수치를 **전수** 수확하면
      정답지가 넓어지고, 넓어진 정답지는 `numeric.exhaustive` 를 그만큼 관대하게 만든다.
      그 대가로 열리는 구멍이 "CP1 에서 아무도 보지 않은 수치가 본문에 실려 나가는 경로"이며,
      이 플래그가 그 경로를 **무검토로는 통과할 수 없게** 만든다. 재정 문언 그대로:
      모든 수치는 **CP1 검토 또는 사용 시 검토**를 거치며, 무검토 게시 경로는 없다.
      거부권을 주지 않는 이유는 관할이다 — "이 수치를 써도 되는가"에는 정답이 없다(D7).
      소관 = M4(게이트 러너). 현재 **구현 없음** — `contracts/glossary.md` §2.2 참조.

# ---------------------------------------------------------------------------
# 8. 자문 측정 (거부권 없음 — 게이트 러너가 측정만 하고 결함을 발행하지 않는다)
#    재정 R5: 총 단어수는 L0 에서 삭제되고 자문 지표로 강등되었다.
#    "소비 3~4분"은 도면 감상을 포함해 해석한다(D11) — 값 정본 = 시트 #reading_time_minutes.
# ---------------------------------------------------------------------------
advisory_measurements:
  veto: false
  total_words:
    definition: "전 트윗(꼬리 포함) 공백 분할 토큰 수."
    definition_correction: >-
      꼬리 면제는 재정 R6 의 길이 규격 결정이며 재정 R5 의 총 단어수 결정이 아니다(재감수 N-01).
      구 정의("tail 슬롯은 계산에서 제외한다")는 총량 지표를 총량이 아니게 만들어 폐기한다.
    record_at: "50-gate/<variant>/verdict.json 의 advisory_measurements.total_words"
    extreme_thresholds:
      params: format-parameters.yaml#total_words_extreme
    extreme_handling: >-
      total_words 가 시트의 total_words_extreme 범위를 벗어나면(below 미만 또는 above 초과)
      advisory_measurements.extreme: true 를 기록하고 소견 메모(65-critique/<variant>/memo.md)
      최상단에 강조 표기한다. 거부권은 없다.

# ---------------------------------------------------------------------------
# 9. 숫자 전수 대조 (D8 이 명시적으로 요구하는 유일한 내용 검사)
#    집행 규칙 = numeric.exhaustive. 대조 대상 텍스트는 출하본(strip 산출)이다.
#    ★ 이 블록이 토큰화·정규화의 정본이다(감수 M14 해소, 재감수 M-06 보수).
#    ★ 토큰화 목록의 확장은 오탐 방향이 아니라 **미검출 방향**의 보수다.
#      확장 후에도 match_policy: exact-only 는 불변이다.
# ---------------------------------------------------------------------------
numeric:
  target_text: shipped          # 주석본이 아니라 출하본
  match_policy: exact-only      # 근사 일치·반올림 허용 없음 (D7)
  match_key: "{value_normalized}|{unit or ''}"

  # 정답지 출처 4종. 재료가 아닌 곳에서 정답을 끌어오지 않는다.
  # ★ 정답지의 성질이 바뀌었다(재정 2026-08-18 P-B). `origin: quoted`·`bibliographic` 항목은
  #   이제 서사가 고른 것이 아니라 **접지 스팬에서 전수 기계 수확**된 것이다. 정답지가 넓어진
  #   만큼 이 검사는 관대해지며, 그 대가는 짝 규칙 `numeric.unreviewed-use`(§7)가 받는다 —
  #   CP1 에서 참조되지 않은(=검토되지 않은) 수치를 본문이 쓰면 CP2 에 플래그가 붙는다.
  #   두 규칙을 함께 읽어야 "무검토 게시 경로 없음"이 성립한다.
  answer_sources:
    - id: frozen_facts
      description: "items[] 중 kind == fact && status == active 의 value_normalized + unit. origin 4종(quoted·derived·figure-sourced·bibliographic) 전부 포함한다. quoted·bibliographic 은 수확기 산출이다(재정 P-B)."
    - id: patent_number
      description: "patent.number"
    - id: patent_dates
      description: "patent.dates.priority / .filing / .publication"
    - id: run_whitelist
      description: "run.yaml 의 numeric_whitelist[] 명시 항목만. 기본값은 비어 있으며 CP2 봉투에 전량 인쇄한다."

  # 토큰화: 우선순위 순으로 시도하고 매칭된 구간은 소비한다(긴 패턴 우선).
  # rank 1 = 슬래시형 특허번호(재감수 M-06 신설). 기존 특허번호 패턴보다 먼저 시도해야
  # 'US 2026/0147854 A1' 이 bare-year + bare-number 로 부서지지 않는다.
  tokenizers:
    # rank 0 = 스레드 순번 n/N(재정 2026-09-13 T65 자잘 · 값 공간 승인). bare-number 보다 먼저 시도해야 '3/9' 가
    # '3'·'9' 둘로 쪼개지지 않는다. 정규화 = 값 문자열 그대로 · unit 없음(아래 normalization.thread_marker).
    - { rank: 0,  kind: thread-marker,       pattern: '\b\d{1,2}/\d{1,2}\b' }
    - { rank: 1,  kind: patent-number-slash, pattern: '\b[A-Z]{2}\s?\d{4}/\d{6,}(?:\s?[A-Z]\d?)?\b' }
    - { rank: 2,  kind: patent-number,       pattern: '\b[A-Z]{2}\s?\d{6,}(?:\s?[A-Z]\d?)?\b' }
    - { rank: 3,  kind: iso-date,            pattern: '\b\d{4}-\d{2}-\d{2}\b' }
    - { rank: 4,  kind: en-date,             pattern: '\b(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\.?\s+\d{1,2},\s+\d{4}\b' }
    - { rank: 5,  kind: currency,            pattern: '\$\s?\d[\d,]*(?:\.\d+)?(?:\s?[KMBT])?' }
    - { rank: 6,  kind: range,               pattern: '\b\d+(?:\.\d+)?\s*(?:-|–|—|to)\s*\d+(?:\.\d+)?\s*[A-Za-zµ%°]*\b' }
    - { rank: 7,  kind: percent,             pattern: '\b\d+(?:\.\d+)?\s*%' }
    - { rank: 8,  kind: multiplier,          pattern: '\b\d+(?:\.\d+)?\s*[x×]\b' }
    # rank 9 의 단위 대안은 **좌측 우선**이다(파이썬 `re`) — 긴 표기를 앞에 둔다.
    # 맨 끝의 `b`(bits, 재정 2026-08-19 Q4)가 그 규율의 자리다: `bits|bit|Gb` 보다 앞에 두면
    # `5 bits` 가 `5 b` 로 잘려 단위가 갈린다. 새 단위를 더할 때도 짧은 것을 뒤로 민다.
    - { rank: 9,  kind: value-unit,          pattern: '\b\d[\d,]*(?:\.\d+)?\s*(?:micron|µm|um|nm|mm|cm|kHz|MHz|GHz|Hz|TOPS|GB|MB|Gb|bits|bit|kg|mg|ms|ns|ps|us|dB|pJ|mW|mV|mA|ohm|Ω|°C|K|W|V|A|J|m|g|t|s|b)\b' }
    - { rank: 10, kind: bare-year,           pattern: '\b(?:19|20)\d{2}\b' }
    - { rank: 11, kind: bare-number,         pattern: '\b\d[\d,]*(?:\.\d+)?\b' }

  # 토큰화 보수 이력 (재감수 M-06)
  tokenizer_amendments:
    - at: 2026-08-18
      change: "patent-number-slash 신설(rank 1) — 'US 2026/0147854 A1' 형식 미포착 보수."
    - at: 2026-08-18
      change: "currency 신설(rank 5) — '$400'·'$1.2T' 가 단위 유실 후 bare-number 로만 포착되던 결함 보수. 단위는 usd 로 정규화한다."
    - at: 2026-08-18
      change: >-
        value-unit 단위 목록 확장 — micron · kg · g · mg · t · ns · ps · us · ms · s ·
        Hz · kHz · dB · Ω|ohm 추가. micron 이 별칭 사전에만 있고 토큰화에 없어
        도달 불가였던 결함을 해소한다(기존 목록은 전량 유지).
    - at: 2026-08-19
      change: >-
        value-unit 단위 목록에 `b`(bits) 추가 — **재정 2026-08-19 Q4**. 실측 근거 = 통주 특허
        `[0189]` 의 `5b, 4b, 3b or 2b`(네 값이 단위 미인정 탓에 수확에서 기각되고 있었다).
        `reader/reader-rules.yaml#numeric_harvest.unit_detection.vocabulary` 와 **함께 가는
        입법**이다 — 두 벌이 갈리면 재료와 본문이 다른 MATCH_KEY 를 만들어 숫자 전수 대조가
        성립하지 않는다. 대안 목록의 **맨 끝**에 둔 것은 규율이다(위 주석 — 좌측 우선).
        `unit_aliases` 는 건드리지 않았다: 인식 어휘의 확장이지 정규화 매핑의 신설이 아니며,
        `normalize_unit("b") == "b"` 이므로 MATCH_KEY 의 의미는 바뀌지 않는다.
    - at: 2026-09-13
      change: "thread-marker 신설(rank 0) — 재정 T65 자잘 · 순번 n/N 이 bare-number 둘로 쪼개져 run.yaml#numeric_whitelist 가 닿지 않던 계약 공백"

  # 정규화 규칙
  normalization:
    thousands_separator: "',' 제거"
    decimals: "후행 0 제거(0.80 → 0.8), 선행 0 보존(0.8 유지), .8 → 0.8"
    unicode_digits: "ASCII 로 정규화"
    units: "소문자화 + 별칭 사전 적용. 별칭 사전은 입법 대상이며 Owner 재정으로 확장한다."
    unit_aliases:
      um: "µm"
      micron: "µm"
      "℃": "°c"
      "$": "usd"          # 통화는 기호 → 코드 방향으로 통일한다(재감수 M-06)
    unit_alias_policy: >-
      kg · g · mg 는 별칭을 두지 않는다 — 이들의 정규화는 소문자화뿐이다.
      질량 단위 간 환산은 정규화가 아니라 값의 변경이므로 대조 계층에서 하지 않는다.
    percent: "unit = '%'"
    multiplier: "unit = 'x'"
    currency: "unit = 'usd'. 기호와 자릿수 구분자를 제거한 뒤 값만 남긴다(K·M·B·T 접미는 값 그대로 보존)."
    range: "두 끝값으로 분해해 각각 대조. 추가로 범위 자체를 'a-b|unit' 키로도 시도한다(재료가 범위를 한 항목으로 담은 경우)."
    date: "YYYY-MM-DD 로 환산. 연도 단독은 'YYYY|year'."
    patent_number: "공백·하이픈·슬래시 제거 + 대문자화"
    thread_marker: "값 = 문자열 그대로(n/N) · unit 없음 → MATCH_KEY 'n/N|'"

# ---------------------------------------------------------------------------
# 10. 폐지된 규칙 (재정 2026-08-17 · 2026-08-18)
#     로더는 아래 id 를 L0 규칙으로 로드하지 않는다. 부활은 Owner 재정 사항이다.
# ---------------------------------------------------------------------------
retired:
  - id: format.word-budget
    retired_at: 2026-08-17
    basis: "재정 2026-08-17 R5 (D11 개정)"
    reason: >-
      총 단어수(400~600)는 L0 구속에서 삭제되고 자문 측정으로 강등되었다.
      측정 자체는 §8 advisory_measurements.total_words 로 계속하되 거부권이 없다.
  - id: lexicon.forbidden
    retired_at: 2026-08-17
    basis: "재정 2026-08-17 R7 (D3 집행 의미론 정정)"
    reason: >-
      금지 대상은 어휘가 아니라 화행 3종이다. 금지 어휘 regex 사전(구 forbidden.yaml)은
      만들지 않으며, 유일한 기계층은 거부권 없는 화행 플래그다
      (contracts/lexicon/speech-acts.yaml, CP2 첨부).
  - id: format.new-term-budget
    retired_at: 2026-08-18
    basis: "재정 2026-08-18 N2"
    reason: >-
      용어 관련 자동 검사를 완전히 제거한다(재정 2026-08-18 N2). 원칙은 펜 계약의 긍정형
      지침으로 이전했고, blueprint.new_terms[] 는 설계→펜 작업 메모로만 존치하며 어떤
      게이트도 법으로 읽지 않는다. 용어 걸림의 유일한 검증층은 계기(Haiku 시독) 실측이다.
