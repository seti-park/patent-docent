# 스테이지 I/O 계약 — `gate`
#
# 정본 서술 = docs/SPEC.md §1.10. 이 파일은 그 서술의 기계 판독본이며, 어긋나면 SPEC 이 이긴다.
# 서식 = SPEC §1.2 고정 서식 + `schema` 키 + 서식 확장 3 `checks_on_entry`(재정 P-C).
# 실물화 = 재정 2026-09-13 T64 ②(L0 규칙 13 + strip + round-trip · **미가동 명기**) · ④(도면 자산층 부재) ·
#   재정 2026-09-13 T65 ③(도면 자산층 실물화 → `format.stop-shape` 가동 · 재판정 시 직전 산출 보존 `rounds/r<n>/`) ·
#   재정 2026-09-13 T67 ②(M6-a · **L1 국소 대조 가동** — opus-5 high × k 독립 실행 다수결 · 화행 플래그 3종 동반 ·
#   국소 수정 루프 캡 3 `revisions/r<n>/` · `final-eyes-brief.json` 루프 개시 전 생성 · CP2 봉투는 오케스트레이터) ·
#   재정 2026-09-13 T69 ⑥(M4/M8-a · **L2 자문 메모 가동** — fable-5.1 high 1회 · 점수 금지 린트 `gate.no-score` 가동 ·
#   펜 자유 리비전 1회 `revisions/free-r1/` · 위상 봉쇄 D8).
#   실물 = **L0 결정론 층(stop-shape 포함) · strip 산출 · L1 · 화행 플래그 · 수정 루프 · L2 메모 · 자유 리비전**이다. 최종 심급은 아래
#   `layers` 주석 블록이 「미가동」으로 적으며, 러너는 그 사실을 verdict.json#inactive_layers[] 에 그대로 옮긴다 — 판정하지
#   않은 층을 판정한 것처럼 적지 않는다(재정 N5 규율 · run-kinds.yaml#kinds.rehearsal.verdict_requirements.
#   inactive_gates_enumerated). 매니페스트가 없는 런에서는 러너가 stop-shape 미가동 행을 동적으로 더하고, L1 이 아직
#   돌지 않은 판정문(gate-l0 만 돈 시점)에는 l1·speech_act_flag 를 `pending_reason` 으로 동적으로 더한다.
#
# ★ 공통 규칙 — 런은 시작 시점 git 커밋에 결박된다(재정 P-U1). 계약·스키마·검증기·러너가
#   함께 고정되므로, 런 도중 리포가 개정되어도 이 런의 법은 run.yaml#engine.commit 하나다.

schema: stage-contract/v0
id: gate

lane:
  kind: tool                  # L0 = 도구 실행(결정론). 모델 호출 없음
  model: null
  effort: null
  # L1 = Opus 5 high × k(parameters.yaml#gate.l1.k) — 가동(재정 T67 ② · 아래 layers.l1.lane 이 좌석 정본) ·
  # L2 = Fable high × 1 — 가동(재정 T69 ⑥ · layers.l2.lane 이 좌석 정본 · 어휘 gate-l2/<v>/batch-0 은 layers.l2.lane_id_vocabulary) ·
  # gate.final-eyes = 신규 세션 Opus 5 max — SPEC §1.10 의 서술이며 이 라운드에는 없다(아래 layers).
  lane_id_vocabulary:
    form: "gate-l1/<variant>[/retry-<n>]/batch-<i>"       # i = 0..k-1 · k 요청의 바이트는 동일(독립 실행은 좌표로만 갈린다)
    pattern: "^(?P<read_run>[a-z0-9]+(?:-[a-z0-9]+)*)/(?P<task>[a-z0-9]+(?:-[a-z0-9]+)*)(?:/retry-(?P<retry>[1-9][0-9]*))?/batch-(?P<batch>0|[1-9][0-9]*)$"
    membership: {run: [gate-l1], task: [v1, v2, v3]}
    enforced_by: engine/gate/l1/plan.py#GateL1LaneRequest
    root: "50-gate/<variant>/lanes/"                      # 계약 미선언 하위 — 재판정 시 rounds/r<n>/lanes/ 로 함께 보존된다
  lane_discipline:
    - "게이트 레인은 read-only 다(C2) — 구동기는 --tools \"\" 로 부르고 응답은 payload 하나다. 판정 레코드는 러너가 쓴다."
    - "k 요청은 바이트 동일하다. 독립 실행은 좌표(batch-<i>)로만 갈린다(SPEC §4.5 「동일 프롬프트·동일 입력으로 독립 실행 k회」)."
    - "L1 레인의 model 이 opus-5 수용 집합에 들고 effort 가 high 인지 러너가 본다(gate.l1-lane-verified · 총괄 재량 ⓑ)."
    - "fix_directive 는 지시문이다 — 러너가 gate.no-rewrite 를 레인 산출에도 건다(D8 · SPEC §4.7 기제 3)."

# 층별 가동 상태 (계약 키 아님 · SPEC §1.2 「위 키 밖의 항목은 주석」 · 태그 [주석]).
# 러너(engine/stages/gate.py)가 이 블록을 읽어 verdict.json#inactive_layers[] 를 만든다 — 목록을 코드가
# 들면 층이 가동되는 날 계약과 판정문이 따로 논다.
layers:
  tag: "[주석]"
  l0:
    status: active
    note: "L0 결정론 — l0-format.yaml#rules[] 13 (format.stop-shape 는 아래 별도 행)"
  l1:
    status: active
    ruling: "재정 2026-09-13 T67 ②"
    lane: {kind: llm, model: opus-5, effort: high, k: parameters.yaml#gate.l1.k}
    procedure: engine/gate/l1/procedure.md
    # 규칙 id 는 SPEC §4.2 의 문언이다. 코드는 여기서 읽는다(리터럴 금지) — veto 는 항목이 정한다(§1.10 정정).
    rules:
      - {id: l1.citation-mismatch, veto: true,  jurisdiction: "§4.1 #7 — 문장 ↔ 인용 재료 내용 합치"}
      - {id: l1.narrative-smuggling, veto: true,  jurisdiction: "§4.1 #8 — [narrative] 신고에 기술 주장(§3.4)"}
      - {id: l1.advice-implicit,   veto: false, jurisdiction: "§4.1 #10 — 암시적 투자 조언 · 표수 무관 flag(origin advisory-rule)"}
    pending_reason: "L1 미실행 — gate-l0 만 돈 판정문 · gate-l1 이 채운다"
    note: >-
      k = parameters.yaml#gate.l1.k 독립 실행 · 동일성 (rule, locus) · 과반 → defect · 미달 → flag(minority-vote) ·
      만장일치 아닌 항목 전부 disagreement_log[](SPEC §4.5). 요청 = engine/gate/l1/plan.py · 병합 = merge.py.
  l2:
    status: active
    ruling: "재정 2026-09-13 T69 ⑥"
    lane: {kind: llm, model: fable-5.1, effort: high}
    procedure: engine/gate/l2/procedure.md
    lane_id_vocabulary:
      form: "gate-l2/<variant>/batch-0"                    # 1회 · 재요청 없음(위상 봉쇄 · D8)
      membership: {run: [gate-l2], task: [v1, v2, v3]}
      enforced_by: engine/gate/l2/plan.py#GateL2LaneRequest
      root: "50-gate/<variant>/lanes/"
    memo_rule_prefix: "l2."                                 # memo.rule 의 형태 = l2.<slug>
    pending_reason: "L2 미실행 — gate-l2 가 채운다(전제 = decision advance)"
    note: >-
      전역 판단 · 거부권 없음 · 점수 없음(SPEC §4.6 세 겹 — 스키마 폐쇄 · 숫자 필드 부재 · 린트 gate.no-score ·
      정본 = contracts/lexicon/score-lint.yaml). 메모 1회 → 펜 자유 리비전 1회(loop.free_revision) → 위상 봉쇄.
      리비전 결과에 L2 를 다시 돌리지 않는다(run_l2 재호출 = halt). decision 은 L2 로 바뀌지 않는다(§4.3).
  speech_act_flag:
    status: active
    ruling: "재정 2026-09-13 T67 ②"
    predicates: contracts/lexicon/speech-acts.yaml#predicates       # 술어 3종 · 분류 질문 원문을 요청서에 인라인
    flag_rule: "speech-act.<predicate>"                               # flag.rule 의 형태(regression.expected_detector 와 같은 꼴)
    pending_reason: "화행 플래그 미실행 — L1 레인이 동반 수행한다(gate-l1 이 채운다)"
    note: "거부권 없음 · origin speech-act · predicate · votes 기록 · 다수결이어도 defect 승격 없음(재정 R7 · SPEC §4.4.2)"
  final_eyes:
    status: inactive
    reason: "재정 T64 ② — 첫 초안 범위 밖 · 소관 M6·M8"
    ruling: "재정 2026-09-13 T64 ②"
  format.stop-shape:
    status: active
    ruling: "재정 2026-09-13 T65 ③"
    note: >-
      도면 자산층(figures.prepare · 30-figures/assets/manifest.json)이 실물이 되어 가동이다. 헤더 fig 의 자산 id 를
      매니페스트 항목(asset_id)으로 해소해 edit_class 를 센다(engine/figures/asset_id_of). 매니페스트가 없는 런
      (T64 ④ 시절의 판)에서는 판정 행을 checked 0 · extras.inactive_reason 으로 내고 러너가 inactive_layers[] 에
      {layer: format.stop-shape, reason: 매니페스트 부재} 를 더한다 — 계약이 아니라 그 런의 사실을 적는 것이다.

# 국소 수정 루프(SPEC §1.10 루프 위상 · D8). 값은 계약 주석이다 — parameters.yaml 의 조정 가능 4종 규율(adjustable_scope_note)을
# 넘지 않기 위해 여기 둔다. 값 이동은 재정 사항이다(규율 11).
loop:
  tag: "[주석]"
  revision_cap: 3
  free_revision: 1                        # L2 메모 1회 → 펜 자유 리비전 1회 → 위상 봉쇄(재정 T69 ⑥ · SPEC §1.10 판단 경로 · D8)
  free_revision_dir: "50-gate/<variant>/revisions/free-r1/"   # memo.json(메모 = 데이터) + thread.annotated.md(결과 사본) + round.json
  basis: "D8 · SPEC §4.3"
  note: "parameters.yaml 의 조정 가능 4종 규율(adjustable_scope_note)을 넘지 않기 위해 계약 주석으로 둔다 — 값 이동은 재정 사항"
  runner: engine/gate/loop.py
  round_dir: "50-gate/<variant>/revisions/r<n>/"
  escalation: "50-gate/<variant>/escalation.json"
  locality_rule: >-
    라운드 결과에서 지시 좌표 밖 문장은 바이트 동일해야 한다(총괄 재량 ⓒ · finding rule annotation.schema ·
    메시지 「지시 밖 문장이 바뀌었다」 · 새 id 아님). 위반 = 그 라운드 실패(캡 계수) · 현행본은 직전 판으로 되돌린다.

# CP2 표면(SPEC §1.13 · 총괄 재량 ⓓ). §1.13 은 CP2 를 critique 의 owner_checkpoint 에 붙이나 critique·probe·final-eyes 가
# 미구현이라 그 표면 셋은 결번이고, 봉투 작성은 오케스트레이터(구동기 approve-ship · §1.2 C3)의 몫이다. 경로 선언은
# engine/paths.py 가 이 블록에서 읽는다(70-ship/ 은 이때 처음 생긴다).
checkpoint2:
  tag: "[주석]"
  id: ship_approval
  confirm_file: 70-ship/checkpoint2.md
  recorded_by: orchestrator
  surfaces:
    - "50-gate/<variant>/thread.stripped.md"
    - 30-figures/selection.json
    - "50-gate/<variant>/l1.json"           # flags[] — 화행 플래그 3종 포함 · 판정자 = Owner(D8·D3)
    - "50-gate/<variant>/verdict.json"      # decision · checks fail · vacuous_pass · inactive_layers · l0 flags
    - "50-gate/<variant>/l2.md"             # L2 자문 메모(재정 T69 ⑥ · 점수 없음 · 거부권 없음)
    - "60-probe/<variant>/score.json"       # 계기 보고(재정 T69 ⑥ · probe.yaml 산출 · 판정 키 없음)
    - run.yaml                              # numeric_whitelist[] 전량 인쇄
  unimplemented_surfaces:                   # 결번 — 미구현 · 재정 T69 ⑥ 범위 밖(소견 · 최종 심급)
    - {path: "65-critique/<variant>/memo.md", owner: M8}
    - {path: "verdict.json#final_eyes", owner: M6-b}

checks_on_entry:
  - id: gate.input-digest
    criterion: >-
      최신 동결본 실재 · sha256 == run.yaml#frozen[-1].spec_digest · 20-design/blueprint.json 실재 ·
      그 spec_digest == 같은 값 · 40-compose/<variant>/thread.annotated.md 가 변주 1개 이상 실재
    implemented_by: engine/stages/__init__.py
    on_mismatch: environment-error
    note: >-
      불일치는 품질 결함이 아니라 환경 오류다 — 즉시 중단+진단(재정 P-C). 30-figures/selection.json 이 실재하면
      그 spec_digest·blueprint_digest 정합도 본다(T65 ③). 부재는 T64 ④ 판(도면 없는 초안)의 사실이며 러너가
      extras.absent_inputs 에 적는다 — 결함이 아니라 기록이다.

# SPEC §1.10 표 글자 그대로. 30-figures/selection.json 은 figures.select 산출(재정 T65 ③)이며 도면 없는 판(T64 ④)
# 에서는 부재다 — 러너가 부재를 판정 행 extras 에 기록한다(계약을 좁혀 적지 않는다).
inputs:
  - "40-compose/<variant>/thread.annotated.md"
  - "15-frozen/material-spec.v<N>.json"
  - 20-design/blueprint.json
  - 30-figures/selection.json           # note: 실재하면 진입 검사가 정합을 본다 · 부재 = extras.absent_inputs 기록(T64 ④ 판)
  - contracts/l0-format.yaml
  - contracts/format-parameters.yaml
  - contracts/lexicon/speech-acts.yaml
  - contracts/lexicon/defect-catalog.yaml
  - contracts/lexicon/score-lint.yaml
  - contracts/schemas/verdict-check-row.schema.json
  - contracts/parameters.yaml
  - run.yaml

may_read:
  - "40-compose/<variant>/thread.annotated.md"
  - "15-frozen/material-spec.v<N>.json"
  - 20-design/blueprint.json
  - 30-figures/selection.json
  - 30-figures/assets/manifest.json     # format.stop-shape 의 edit_class 해소(SPEC §3.2 · §6.6) — 실재할 때만
  - contracts/l0-format.yaml
  - contracts/format-parameters.yaml
  - contracts/lexicon/speech-acts.yaml
  - contracts/lexicon/defect-catalog.yaml
  - contracts/lexicon/score-lint.yaml
  - contracts/schemas/verdict-check-row.schema.json
  - contracts/parameters.yaml
  - contracts/run-kinds.yaml            # run.publish-preconditions 의 판정 문언(정의 출처 = l0-format.yaml#rules[].definition_source)
  - run.yaml
  - "ledgers/regression/**"

must_not_read:
  - "00-source/**"                      # 재료 대조는 동결본 기준
  - "40-compose/<other-variant>/**"
  - "10-read/**"                        # numeric.unreviewed-use 의 미참조 목록은 동결본에서 재계산한다(총괄 재량 ⓓ)

outputs:
  - "50-gate/<variant>/l0.json"
  - "50-gate/<variant>/l1.json"           # L1 판정 블록(재정 T67 ②) — verdict.json#l1 과 같은 객체
  - "50-gate/<variant>/l2.md"             # L2 자문 메모 렌더(재정 T69 ⑥ · verdict.json#l2.memos 와 같은 값 · KR 틀 · 린트 대상)
  - "50-gate/<variant>/verdict.json"
  - "50-gate/<variant>/annotation-index.json"
  - "50-gate/<variant>/thread.stripped.md"
  - "50-gate/<variant>/thread.json"       # 구조화 출하 객체 — 재감수 B-04 로 gate 산출로 승격
  - "50-gate/<variant>/final-eyes-brief.json"   # 최종 심급 발췌본 — L1 첫 진입(루프 개시 전)에 1회 생성 · 불변 · verdict.json#final_eyes_brief_digest 로 핀(재정 N1 · T67 ②)

optional_outputs:
  - "50-gate/<variant>/revisions/r<n>/"   # 국소 수정 라운드 — directives.json(지시) + thread.annotated.md(결과 사본) + round.json(재정 T67 ②)
  - "50-gate/<variant>/revisions/free-r1/"   # 자유 리비전(재정 T69 ⑥) — memo.json(L2 메모 = 데이터) + thread.annotated.md(결과 사본) + round.json
  - "50-gate/<variant>/escalation.json"   # 캡 초과 상신 기록(loop 산출)
  - "50-gate/<variant>/rounds/r<n>/"      # 재판정 보존(재정 T65 ③ · 총괄 재량 ⓔ) — 주석본 지문이 바뀌면 직전 산출을 여기로 옮긴 뒤 다시 판정한다

# SPEC §1.10 「종료 전 검사」 7행 글자 그대로 + strip 검사 4(SPEC §3.3 · 총괄 재량 ⓔ 검사 id).
# status 가 inactive 인 행은 이 라운드에 돌지 않으며 verdict.json#checks[] 에 행을 내지 않는다 —
# 돌지 않은 검사의 행은 거짓이다.
checks_before_exit:
  - id: gate.l0-clean
    criterion: "l0.json 의 defects[] 가 빈 배열"
    implemented_by: engine/stages/gate.py
  - id: gate.l1-clean
    criterion: "l1.json 의 defects[] 가 빈 배열 (flags[] 는 무관)"
    implemented_by: engine/stages/gate.py
  - id: gate.l1-lane-verified
    criterion: "k 응답의 model 이 opus-5 수용 집합(read.yaml#model_identity)에 들고 effort == layers.l1.lane.effort"
    implemented_by: engine/stages/gate.py
    note: "총괄 재량 ⓑ 신설 id(compose.lane-verified 와 같은 격). 영수증 대조는 구동기 몫. 실패 = halt."
  - id: gate.no-score
    criterion: "l2.md·verdict.json 에 점수 필드·점수 패턴 부재(§4 의 린트)"
    implemented_by: engine/gate/l2/lint.py
    note: >-
      대상 = memo 객체의 rule slug + text 전문(verdict.json#l2.memos[] · l2.md 는 같은 값의 렌더). 패턴 = score-lint.yaml#patterns[]
      전건(등재 4요소가 빠진 항목은 로드 거부) · 반례 counter_examples[] 는 통과해야 한다. 행 = ruleset score-lint · version · size.
      실패 = halt(D8·D15 · 재정 T69 ⑥). 스캔 대상은 targets[] allowlist 뿐 — 스레드 본문은 보지 않는다(재정 N4).
  - id: gate.no-rewrite
    criterion: "모든 fix_directive 가 대체 문장을 포함하지 않음(지시문 형식 린트)"
    implemented_by: engine/stages/gate.py
    note: "러너 자기 산출(L0)과 L1 레인 산출의 fix_directive 전건 — 따옴표 속 5토큰 이상 EN 문장 부재(SPEC §4.7 기제 3). 실패 = halt."
  - id: gate.annotation-index
    criterion: "annotation-index.json 이 트윗→문장→인용 ID 전건을 담고, 초안 문장 수와 일치"
    implemented_by: engine/annotation/index.py
  - id: gate.final-eyes-isolation
    criterion: >-
      ① final_eyes.inputs_read[] 의 경로 집합이 제공 파일 열거 집합과 정확히 일치(초과도 부족도 실패)
      그리고 ② 최종 초안을 제외한 각 입력의 생성 시점이 수정 루프 개시 이전임(재정 N1)
    implemented_by: null
    status: inactive                    # [주석] 최종 심급 미가동 — 재정 T64 ②
  - id: gate.final-eyes-scope
    criterion: "final_eyes.veto_reason ∈ {null, \"a\", \"b\", \"c\"} — 거부 판정의 사유가 열거 3종 안에 있음(재정 R4)"
    implemented_by: null
    status: inactive                    # [주석] 최종 심급 미가동 — 재정 T64 ②
  # strip 검사 4 — SPEC §3.3 「무손실 round-trip 검사 · 두 방향 모두 강제」 + 「출하 전 최종 안전망」.
  # §3.3 은 강제하되 검사 id 를 주지 않아 총괄이 붙였다(재량 ⓔ · glossary §2.1 등재).
  - id: strip.roundtrip-forward
    criterion: "strip(annotated).stripped_md 가 참조 구현(태그·헤더·프런트매터만 제거)의 결과와 바이트 동일"
    implemented_by: engine/annotation/strip.py
  - id: strip.roundtrip-reverse
    criterion: "thread.json(frontmatter_raw 포함) + annotation-index.json 으로 재조립한 주석본이 원본 thread.annotated.md 와 바이트 동일"
    implemented_by: engine/annotation/reassemble.py
  - id: strip.reassembly
    criterion: "thread.json.tweets[].text 를 규정 순서로 이어붙인 것이 thread.stripped.md 와 바이트 동일"
    implemented_by: engine/stages/gate.py
  - id: strip.residual-tag
    criterion: "출하본에 `\\[(M\\d+|narrative)` 패턴 0(§3.3 안전망 — ship 의 halt 를 gate 종료 시점으로 앞당겨 본다)"
    implemented_by: engine/stages/gate.py

report_format: contracts/schemas/verdict-check-row.schema.json

# 조치 어휘 = SPEC §1.2 C6. 8행 = SPEC §1.10 실패표 글자 그대로 + 1행(종료선).
failure:
  - condition: "L0/L1 결함 발생"
    action: retry(3)
    then: escalate
    note: "fix_directive 발행 → 국소 수정 라운드(engine/gate/loop.py · 구동기 revise). 캡 = loop.revision_cap"
  - condition: "국소 수정 캡 3회 초과(수렴 실패)"
    action: escalate
    note: "상류 결함 신호로 보고. 대개 재료 반려행(D8)"
  - condition: "gate.no-rewrite 실패(게이트가 문장을 제공)"
    action: halt
    note: "D8 위반. 게이트 프롬프트 수정 후 재개"
  - condition: "gate.no-score 실패"
    action: halt
    note: "D8·D15 위반"
  - condition: "gate.final-eyes-isolation / gate.final-eyes-scope 실패"
    action: halt
    note: "격리가 깨졌거나 관할 밖 사유로 거부한 판정은 무효"
  - condition: "최종 심급 거부(열거 3종)"
    action: retry(3)
    then: escalate
    note: "국소 수정 경로 재진입(캡 3회 안) → 캡 소진 시 진단 첨부 escalate(재정 R4)"
  - condition: "변주 전멸(전 변주가 캡 초과 또는 최종 심급 탈락)"
    action: escalate
    note: "Owner 재정. 재료 반려인지 블루프린트 개정인지는 Owner 가 정한다"
  - condition: "spec_digest 불일치(프런트매터 ≠ 현재 동결본)"
    action: escalate
    note: "annotation.schema 결함으로 즉시 반려(SPEC §3.2) · decision enum 의 escalate 조건(§4.3)"
  - condition: "partial_until 종료선이 gate 앞(run-kinds.yaml#kinds.partial.terminates_at_enum 순서)"
    action: halt
    note: "종료선 초과 실행 차단(T40 ③ G-12 의 부분 집행)"

# 재료 개정 시 하류 산출물은 전량 무효·재생성이다(재정 N11). 집행 = annotation.schema(spec_digest 대조).
downstream_invalidation:
  on: "spec_version 증가"
  effect: "판정 전량 무효 · 재판정"
  enforced_by: "annotation.schema(프런트매터 spec_digest ≠ 현재 동결본) + verdict.json#thread_digest(주석본 변경 시 재판정)"
