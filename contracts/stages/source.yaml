# 스테이지 I/O 계약 — `source`
#
# 정본 서술 = docs/SPEC.md §1.3. 이 파일은 그 서술의 기계 판독본이며, 어긋나면 SPEC 이 이긴다.
# 서식 = SPEC §1.2 고정 서식 + `schema` 키(K3 양방향 대조 대상이 되기 위한 계약 라인 선언)
# + 서식 확장 3 `checks_on_entry`(재정 P-C).
#
# ★ 공통 규칙 — 런은 시작 시점 git 커밋에 결박된다(재정 P-U1). 계약·스키마·검증기·러너가
#   함께 고정되므로, 런 도중 리포가 개정되어도 이 런의 법은 run.yaml#engine.commit 하나다.

schema: stage-contract/v0
id: source

lane:
  kind: tool          # 비-LLM. 다이제스트 계산·구조 검사만 한다.
  model: null
  effort: null

# ★ 진입 지문 검사(재정 P-C). source 는 파이프라인의 첫 스테이지이므로 대조할 상류 지문이
#   없다 — 대신 **외부 투입물의 존재·해시를 기록**하고, 같은 런 작업장에 이미 00-source/ 가
#   있으면 그 지문과 대조해 원천 변경을 감지한다(재정 P-U2).
checks_on_entry:
  - id: source.input-digest
    criterion: >-
      Owner 투입물(원문 파일 + 도면 원본) 전건이 실재하고, 각 파일의 SHA-256 을 산출해
      기록한다. 런 작업장에 기존 00-source/ 가 있으면 patent.md 지문과 도면 세트 매니페스트
      지문을 대조한다 — 어긋나면 덮어쓰지 않는다(아래 source_change_policy).
    implemented_by: engine/stages/__init__.py
    on_mismatch: environment-error
    note: >-
      불일치는 품질 결함이 아니라 환경 오류다 — 재시도·수정 루프가 아니라 즉시 중단+진단
      (재정 P-C). 원천이 바뀐 경우의 처분은 부분 복구가 아니라 **새 런**이다(재정 P-U2).

inputs:
  - "Owner 투입물(특허 식별자 또는 원문 파일)"

may_read:
  - "Owner 투입물"
  - docs/CHARTER.md

# 제약이 없는 유일한 스테이지다. 대신 쓰기 대상이 아래로 한정되며,
# 이후 어떤 스테이지도 00-source/ 아래를 수정하지 못한다(읽기 전용 고정).
must_not_read: []

outputs:
  - 00-source/patent.md
  - 00-source/patent.sha256
  - 00-source/figures-raw/
  - 00-source/source-report.json
  - 00-source/PROVENANCE.md   # 정본화 변환 목록 + 원본·정본 양쪽 SHA-256
  - run.yaml

# ★ PROVENANCE.md 가 필수 산출인 이유. 원천 취득은 엔진 범위 밖이지만(SPEC §1.3 [ENG-확정]),
#   **무엇을 정본으로 삼았는가**는 엔진이 기록해야 한다 — patent.sha256 은 "우리가 무엇을
#   읽었는가"만 답하고 "그것이 투입물과 어떻게 다른가"는 답하지 못한다. 정본화가 무손실이
#   아닌 이상(NBSP 치환·보이지 않는 문자 제거) 그 차이가 기록되지 않으면 원천 대조가
#   투입물까지 거슬러 올라가지 못한다.

optional_outputs: []

checks_before_exit:
  - id: source.digest-recorded
    criterion: "patent.sha256 의 값이 patent.md 의 실제 SHA-256 과 일치"
  - id: source.claims-section
    criterion: >-
      patent.md 에 청구항 구간이 식별 가능한 경계로 존재한다. 경계 규칙의 정본은
      reader/reader-rules.yaml#claim_inventory.section 이며, 이 검사는 그 규칙으로 구간을
      찾고 `claim_start` 로 최소 1개 청구항을 얻는 데 성공하는지만 본다.
      ★ READ 의 read.claim-inventory 가 같은 파서를 쓰므로, 여기서 통과한 원천은
      하류에서 파서 문제로 다시 넘어지지 않는다.
  - id: source.figures-manifest
    criterion: "figures-raw/ 파일 수 ≥ 1 이고 파일명이 도면 번호로 정렬 가능"
  - id: source.figures-manifest-digest
    criterion: >-
      도면 세트 **매니페스트 지문**을 산출해 source-report.json#figures_manifest_digest 에
      적는다 — `sha256("\n".join(f"{filename}\t{sha256}" for 정렬된 도면))`.
      원천은 patent.md 만이 아니라 **도면 세트 전체**이며(재정 P-U2), 세트의 변경은 파일
      하나의 지문으로는 드러나지 않는다. 하류 read.input-digest 가 이 값을 대조한다.
    introduced_by: "재정 2026-08-18 P-U2"
  - id: source.run-id
    criterion: "run.yaml 의 run_id 가 `^[a-z0-9]+-[a-z0-9]+-[a-z0-9-]+$` 이고 디렉터리명과 일치(SPEC §7.1)"
  - id: source.exhibit-candidates
    criterion: >-
      source-report.json 의 도면 수 ≥ 1 **그리고** 전시물 후보 수 ≥ 트윗 하한.
      트윗 하한의 정본 = contracts/format-parameters.yaml#tweet_count.min (재정 N12).

# ---------------------------------------------------------------------------
# 전시물 후보 산정식 — ★ 재정 2026-08-18 P-5 로 정식 승인됨.
# ---------------------------------------------------------------------------
# 구 상태: 재정 N12 가 정한 것은 **조기 보고와 부족 시 escalate** 뿐이었고 후보 수의 산정식은
# 총괄 잠정 규칙이었다(M0.6 재감수 M-04 가 SPEC 의 무단 확정을 지적해 잠정으로 되돌렸다).
# 재정 P-5 가 그 산정식을 **정식 승인**했으므로 `provisional_resolutions` 를 `resolutions` 로
# 개명하고, "첫 런 개시 전 Owner 재정 대상"이라고 적던 `open` 필드는 **폐기**한다(근거: P-5).
# ★ `tag: "[가설]"` 은 그대로 **유지**한다 — 재정 P-5 가 명시적으로 유지를 지시했다.
# 산정식이 승인된 것과 그 산정식이 실물에서 옳은가가 별개이기 때문이며, 그 물음은 아래
# observation_metric(채택률)이 배치 리뷰에서 관찰한다.
exhibit_candidates:
  tag: "[가설]"
  unit: source-figure-file
  formula: "figures-raw/ 안의 도면 파일 수"
  rationale: >-
    이 시점에 존재하는 것은 원천 도면뿐이다 — 자작 자산(개념 다이어그램·수치 카드)은
    figures.prepare 이후에야 생긴다. 셀 수 있는 것만 센다.
  adjudicated_in: docs/decisions/ruling-20260818-03-P1-P11.md#P-5
  resolutions:            # provisional_resolutions 를 개명 — 이제 잠정이 아니다
    - question: "서브도면(FIG. 3A·3B)을 1로 세는가 각각으로 세는가"
      ruling: "파일 단위로 센다."
      rationale: "가리킬 수 있는 것만 후보다. 파일이 곧 전시 가능한 자산의 최소 단위다."
    - question: "같은 구조의 다른 각도(단면도·사시도)가 전시 스톱 둘을 지지하는가"
      ruling: "각각 센다."
      rationale: "같은 구조인지 아닌지는 도면을 읽어야 알 수 있고, 이 시점은 읽기 전이다."
    - question: "흐름도·타이밍도를 후보에서 빼는가"
      ruling: "빼지 않는다 — 흐름도 포함."
      rationale: "종류 판별은 판단이며, 판단을 조기 보고에 넣으면 조기 보고가 아니게 된다."
  observation_metric:
    id: exhibit-adoption-ratio
    definition: "source 후보 수 vs DESIGN 채택 수"
    reviewed_at: 배치 리뷰
  recompute_requirement: >-
    ★ source-report.json 은 **도면별 행**(파일명·바이트·이 규칙 적용 결과)을 함께 적는다.
    재정이 내려와도 원천을 다시 읽지 않고 소급 재계산할 수 있어야 하기 때문이다
    (재정 P-5 가 이 요건을 그대로 요구한다).

# ---------------------------------------------------------------------------
# 런 결박 — 커밋 핀의 기입 주체 (재정 P-U1 · P-8)
# ---------------------------------------------------------------------------
# 런은 시작 시점의 git 커밋에 결박된다. 그 핀을 **누가 쓰는가**가 여기 고정된다 —
# tools/run_worktree.py 는 worktree 를 만들 뿐 run.yaml 을 쓰지 않으므로(그 도구의 규율),
# 기입은 이 스테이지의 몫이다. 그전까지 아무도 쓰지 않아 engine.commit 이 빈 문자열로 남고
# 사람이 손으로 넣어야 했다(실측 2026-08-18). 손으로 넣어야 하는 결박은 결박이 아니다.
run_binding:
  ruling: 재정 2026-08-18 P-U1 · P-8
  written_by: engine/stages/source.py#run       # 진입 시점에 스스로 확정해 기입한다
  judged_by: engine/gitpin.py                   # 도구와 러너가 같은 판정을 부른다(한 곳)
  fields:
    - "run.yaml#engine.commit — 진입 시점 리포 HEAD 의 40hex"
    - "run.yaml#engine.worktree — 러너가 도는 경로가 격리 체크아웃이면 그 경로, 아니면 null"
  preconditions:
    clean_worktree: "작업 트리가 더러우면 런을 시작하지 않는다(커밋되지 않은 변경은 커밋에 결박될 수 없다)"
    git_required: "git 이 없거나 git 작업 트리가 아니면 핀을 만들 수 없다 — 조용히 넘어가지 않는다"
  dirty_exclusions:
    - ".worktrees/"          # 결박 기제 자신의 생성물
    - "<run_root>"           # 이 런의 작업장(러너가 자기 산출물로 자기 런을 막지 않는다)
  resume: "기존 run.yaml 의 핀이 현재 HEAD 와 다르면 덮어쓰지 않고 멈춘다 — 재개 런은 같은 커밋을 쓴다"

# ---------------------------------------------------------------------------
# 원천 변경 시 복구 정책 (재정 P-U2)
# ---------------------------------------------------------------------------
source_change_policy:
  ruling: 재정 2026-08-18 P-U2
  detection_scope: [00-source/patent.md, "00-source/figures-raw/ 매니페스트 지문"]
  on_change: new-run                # 항상 새 런. 부분 복구·우회 스위치 없음
  old_run_marking: superseded-by-source-change
  cross_link: "구 런 ↔ 신 런 상호 링크를 run.yaml 에 보존한다"
  why: "바이트 오프셋 특성상 부분 재사용은 정확성 위반이다"
  diagnostics: "진단 보고에 변경 내용(파일·규모)을 명시한다"
  reseal_tooling: "생산 경로에 지문 재계산 자리를 두지 않는다. 재봉인 도구는 테스트 하네스에만 산다."

  # ★ 표시가 실물이 되는 자리 — 어휘·필드·기입 주체의 선언(필드 명세 = SPEC §7.3).
  #   위 old_run_marking·cross_link 는 **무엇을 하는가**만 말했고 **어디에 어떤 이름으로**를
  #   말하지 않았다. 그 공백에서 구현이 비었다 — 정책이 계약과 주석에만 있고 생산 코드는
  #   아무것도 기록하지 않았다(sol 재감수 P-U2 = 부분 판정). 표시가 파일로 남지 않으면
  #   "폐기하되 지우지 않는다"는 규율은 문서상의 말로만 산다.
  marking:
    written_by: engine/stages/source.py#run     # 감지한 러너가 그 자리에서 남긴다
    old_run:
      status: superseded-by-source-change       # run.yaml#status 가 active 에서 이 값으로 바뀐다
      cross_link_field: superseded_by           # 신 런의 run_id. 감지 시점에는 신 런이 없어 null
      diagnostics_field: source_change          # 아래 diagnostics_fields 를 담는 블록
    new_run:
      cross_link_field: supersedes              # 구 런의 run_id
      written_when: "새 런의 source 진입에 supersedes_run_root 를 준 때"
    link_states:
      pending: >-
        구 런 표시는 섰고 신 런이 아직 없다 — superseded_by 가 null 인 정상 중간 상태다.
        "링크가 아직 비었다"와 "링크를 잃었다"는 다른 사고이므로 파일이 스스로 구별해 적는다.
      linked: "신 런이 생겨 superseded_by ↔ supersedes 왕복이 닫혔다"
    ordering: >-
      구 런 표시는 감지 즉시, 링크 닫기는 신 런의 run.yaml 이 실물이 된 뒤. 순서가 반대이면
      구 런이 아직 없는 런을 가리키는 창이 생긴다.
    single_use: >-
      승계는 한 번뿐이다. 이미 승계된 런을 다른 런으로 다시 승계하면 앞선 승계의 사료가
      사라지므로, 러너는 그 자리에서 넘어진다.
  diagnostics_fields:
    - "summary — 변경 건수와 파일·규모 한 줄(진단문과 파일에 같은 문장이 실린다)"
    - "changes[] — path · change(modified|added|removed) · old_sha256 · new_sha256 · old_bytes · new_bytes · byte_delta"
    - "figures_manifest_digest — {old, new}. 세트 변경은 파일 하나의 지문으로 드러나지 않는다"
    - "input_path — 변경을 들고 온 투입물의 절대 경로"
    - "detected_at · linked_at — 감지·링크 시각(UTC)"
  seal_immutability: >-
    표시는 run.yaml(런 메타)에만 쓴다. 00-source/ 의 봉인물(patent.md · patent.sha256 ·
    figures-raw/)은 읽기만 하고 다시 쓰지 않는다 — 이 표시는 덮어쓰기 거부를 없애는 것이
    아니라 그 거부의 **흔적을 남기는** 것이다. 봉인에 손이 닿는 순간 "원천이 바뀌면 새 런"은
    표시 절차에 딸린 뒷문을 얻는다.
  over_marking: >-
    진입 검사는 원천 변경 말고도 **투입물 부재**로 넘어진다. 표시는 봉인분과 투입물의 차이가
    실재할 때만 서며, 부재는 다른 사고로 남는다 — 정직한 경로가 벌받지 않아야 한다.

failure:
  - condition: "원천 텍스트 취득 실패·문자 깨짐"
    action: halt
    note: "하류 전부가 무의미해진다"
  - condition: "청구항 구간 경계 식별 실패"
    action: escalate
    note: "원천 형식 문제이므로 자동 복구 대상 아님"
  - condition: "도면 부재 또는 전시물 후보 < 트윗 하한"
    action: escalate
    reason_label: "형식 전제 미충족"
    note: >-
      재정 N12. D4 의 drop 판단(reason_label = "안도감 부적합")과 **사유를 구별해 적는다** —
      둘 다 Owner 에게 가지만 판단의 종류가 다르다. 하나는 형식 전제이고 다른 하나는 서사다.
      ★ drop 의 처분 자리는 재정 P-A 이후 CP1 한 곳이며, 이 행과 섞이지 않는다.
  - condition: "원천 변경 감지(checks_on_entry: source.input-digest)"
    action: halt
    reason_label: "환경 오류"
    note: >-
      재정 P-U2 · P-C. 기존 00-source/ 를 덮어쓰지 않고 중단한다. 처분은 새 런이며,
      구 런은 status: superseded-by-source-change 로 표시하고 상호 링크를 보존한다.
  - condition: "run_id 형식 위반"
    action: halt
    note: "디렉토리 재생성 필요"
  - condition: "작업 트리가 더러움(커밋 핀 불가 — run_binding.preconditions.clean_worktree)"
    action: halt
    note: >-
      재정 P-U1. 진단에 더러운 파일 목록을 싣는다. 처분은 변경을 커밋하거나 되돌린 뒤 다시
      개시하는 것이며 우회 스위치는 없다. tools/run_worktree.py create 와 같은 판정이다.
  - condition: "git 부재 또는 git 작업 트리 아님(커밋 핀 불가)"
    action: halt
    reason_label: "환경 오류"
    note: >-
      재정 P-U1 · P-C. 핀을 만들 수 없다는 것은 "이 런의 법이 무엇이었는가"에 답할 수 없다는
      뜻이다. 핀 없는 런은 열지 않는다.

# 규칙 완화·대체 모드를 선제 설계하지 않는다(재정 N12).
# "도면이 적은 특허를 위한 축약 스레드" 같은 대체 경로를 미리 만들어 두지 않으며,
# 실투입 결정이 필요해진 시점에 Owner 재정 1회로 정한다.
