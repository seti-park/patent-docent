# 스테이지 I/O 계약 — `freeze`
#
# 정본 서술 = docs/SPEC.md §1.6. 이 파일은 그 서술의 기계 판독본이며, 어긋나면 SPEC 이 이긴다.
# 서식 = SPEC §1.2 고정 서식 + `schema` 키 + 서식 확장 3 `checks_on_entry`(재정 P-C).
#
# ★ 공통 규칙 — 런은 시작 시점 git 커밋에 결박된다(재정 P-U1). 계약·스키마·검증기·러너가
#   함께 고정되므로, 런 도중 리포가 개정되어도 이 런의 법은 run.yaml#engine.commit 하나다.

schema: stage-contract/v0
id: freeze

lane:
  kind: tool          # 결정론. 비-LLM.
  model: null
  effort: null

# ★ 진입 지문 검사(재정 P-C). 출구의 freeze.approval-valid 와 겹쳐 보이지만 층이 다르다 —
#   진입은 **환경 전제**(선언된 입력이 실재하고 기록과 일치하는가)를 보고, 출구는 봉투의
#   **신원과 결속과 항목 대조**(어느 관문의·어느 런의·무엇에 대한 승인이며 아직 유효한가)를 본다.
#   진입 불일치는 품질 결함이 아니므로 재시도·수정 루프에 넣지 않는다.
#
# ★★ 폐기(재정 R8 우선): 구 문언은 진입 대조 목록에 **승인 봉투 target.digest** 를 넣었고
#    구현도 그렇게 했다. 그 결과 출구 규칙 approval.target-digest 에 제어가 닿지 않았다(도달 불능).
#    두 실패는 성질이 다르다 — 진입 지문은 "세계가 어긋났다"(환경 오류)이고, 봉투 결속 실효는
#    "세계는 멀쩡한데 승인이 실효했다"(halt + **재승인**)이다. 재료 개정으로 봉투가 실효하는 것은
#    결함이 아니라 정상적인 생애 사건이며(R8), 그 사건은 판정 행에 남아 Owner 에게 재승인을
#    요구해야 한다. 진입이 삼키면 재승인 경로가 판정문에서 사라진다. 그래서 결속은 출구 관할이다.
checks_on_entry:
  - id: freeze.input-digest
    criterion: >-
      선언된 입력 전건의 존재·지문 대조 — 10-read/material-spec.json 존재,
      10-read/material-spec.md 존재, 그리고 명세의 patent.source_digest ↔
      00-source/patent.sha256. 승인 봉투는 이 층에서 열지 않는다(위 ★★ 참조).
    implemented_by: engine/stages/__init__.py
    on_mismatch: environment-error
    note: "불일치는 품질 결함이 아니라 환경 오류다 — 즉시 중단+진단(재정 P-C)."

inputs:
  - 10-read/material-spec.json
  - 10-read/material-spec.md          # CP1 판독본(KR 틀 · EN 값) — 재정 P-U5
  - "15-frozen/approval-v<N>.md"

may_read:
  - "10-read/**"
  - "15-frozen/**"
  - 00-source/patent.sha256

must_not_read: []

outputs:
  - "15-frozen/material-spec.v<N>.json"

optional_outputs: []

# 동결이 하는 세 가지 (SPEC §1.6).
actions:
  - action: version-stamp
    detail: "spec_version: N, status: \"frozen\" 기입"
    purpose: "인용의 시점 고정"
  - action: digest
    detail: "동결본의 SHA-256 을 산출해 run.yaml 에 기록. 하류 산출물은 이 값을 spec_digest 로 복사"
    purpose: "조용한 교체 탐지"
  - action: readonly
    detail: "파일 권한 0444 + 러너의 쓰기 경로 목록에서 15-frozen/ 제외"
    purpose: "물리적 불변"

# 동결 이후 재료가 바뀌는 유일한 경로 = 반려 → 개정(spec_version +1) 한 갈래뿐이다(D6 규율 ②).
# 개정 시 material-spec.v<N+1>.json 이 **새 파일로** 생기고 v<N> 은 지우지 않는다.
revision_path:
  only: "reject → revise → re-approve"
  new_file: true
  keep_prior: true

checks_before_exit:
  - id: freeze.approval-valid
    criterion: >-
      approval-v<N>.md 프런트매터가 approval-envelope/v0 를 통과하고, decision: "approved" ·
      owner_quote 비어 있지 않음 · target.digest 가 실제 파일 SHA-256 과 일치(재정 R8).
      ★ target.digest 대조는 **이 출구 검사의 관할이다** — 진입 지문 검사로 옮기면 봉투 실효가
      환경 오류로 오분류되고 재승인 경로가 판정문에서 사라진다(위 checks_on_entry ★★).
      ★ 더해 봉투와 재료를 함께 읽어야 판정되는 3항을 여기서 본다(스키마 밖):
      ① extensions.docent.drop_signal.verdict == "drop-proposed" 이면 drop_decision 필수
         (경로 정정 — drop_signal 은 공유 코어가 아니라 docent 확장 블록에 산다: 재정 P-2 ⓑ.
          drop 의 확정 재정 자리는 CP1 한 곳이다: 재정 P-A)
      ② derived_fact_ack[] 가 재료의 origin == "derived" 항목 집합과 **정확히 일치**
      ③ manual_verification_ack[] 가 origin == "figure-sourced" 항목 집합과 **정확히 일치**
      ④ [재정 2026-09-13 T59 ②] 10-read/convergence.json#review_requests[] 가 비어 있지 않으면
         결정과 무관하게 review_adjudicated[].target 집합이 요청 target 집합과 **정확히 일치**
         (빠짐·유령 별도 결함). defect 판정이 있는 approved 봉투는 실패(이진 결정).
         undecided 채 approved 는 통과(재정 T59 ④). 자기 신고의 내용이 아니라 답의 유무만 본다.
      ★★ 더해 봉투의 **신원** 4항을 본다(sol 재감수 B-02 처분):
      ④ checkpoint == read 계약의 owner_checkpoint.id(= material_approval).
         CP2 봉투(ship_approval)로 재료를 동결할 수 없다.
      ⑤ run_id == run.yaml#run_id. 다른 런의 봉투는 이 런의 승인이 아니다.
      ⑥ target.path 가 **정확히** 재료 명세(10-read/material-spec.json).
         해시 일치는 대상의 불변만 증명하고 대상의 정체는 증명하지 않는다.
      ⑦ target.path 의 realpath 가 런 루트 안 — **파일을 열기 전에** 판정한다.
         절대 경로·`..` 탈출 전부 거부하며, 런 밖 파일은 읽지 않는다.
    note: >-
      ②③은 M0.6 재감수 M-01 의 잔여 처분이다 — "derived_fact_ack[] 도 실제 파생 fact 집합과
      대조하지 않아 빈 목록이나 유령 ID 가 승인 봉투를 통과한다". 항목 단위 승인(재정 N9)은
      목록이 대조될 때만 승인이다.
      ④~⑦은 sol 재감수 BLOCKER B-02 의 처분이다 — 검증 경로에 checkpoint·run_id 가 한 번도
      등장하지 않아 "This bypasses the Owner checkpoint rather than merely misreporting it".
      봉투가 **어느 관문의 · 어느 런의 · 무엇에 대한** 승인인지를 보지 않는 검증은 CP1 의
      오보가 아니라 우회다(헌장 D6 · 재정 R8).
  - id: freeze.digest-match
    criterion: "동결본의 patent.source_digest 가 00-source/patent.sha256 과 일치"
  - id: freeze.readonly
    criterion: "15-frozen/material-spec.v<N>.json 의 권한이 쓰기 불가(0444)"
  - id: freeze.render-parity
    criterion: >-
      CP1 판독본(10-read/material-spec.md)에 각 항목의 **EN 값이 바이트 그대로 존재**한다
      (재정 P-U5). 대상 = label_en · statement_en · what_it_shows_en ·
      positioning 3필드(background_problem·delta·asserted_effect) ·
      claims.applicant_interest[].signal · 전 인용 필드(text_verbatim·quote·caption_quote·
      evidence_quotes[]·quotes[]).
      ★ 구 문언 "모든 items[].id 가 1회 이상 등장"은 **폐기**한다 — ID 존재만 보면 판독본이
      값을 잃어도 통과하고, 판독본은 KR 틀 + EN 값이므로 검사 대상은 ID 가 아니라 값이다.
      파생 번역(EN 값의 KR 요약)은 금지이며, 요약이 값을 대체하면 이 대조가 잡는다.
    implemented_by: engine/stages/freeze.py
  - id: freeze.id-monotonic
    criterion: "개정 시: v<N-1> 의 모든 항목 ID 가 v<N> 에 존재하고, 삭제된 ID 가 없음"
    implemented_by: reader/lib/freeze_integrity.py
  - id: freeze.payload-immutable
    criterion: >-
      개정 시: 두 판에 공통인 ID 의 **정본 payload 해시**가 동일 + 상태 전이가 단방향 +
      superseded_by 사슬이 비순환이고 종단이 active.
    implemented_by: reader/lib/freeze_integrity.py
    ruleset: reader/reader-rules.yaml#item_lifecycle
    introduced_by: "재정 N14 ① (M0 M13 · M0.6 재감수 M-08 처분)"
    note: >-
      freeze.id-monotonic 은 **ID 의 존재**만 본다. 항목 ID 의 시간 안정성(SPEC §2.4)은 ID 가
      아니라 **의미**가 고정되어야 성립하는데, 그전까지 고정되는 것은 ID 뿐이었다.

report_format: contracts/schemas/verdict-check-row.schema.json

failure:
  - condition: "승인 봉투 부재 · decision != \"approved\" · owner_quote 부재"
    action: halt
  - condition: "target.digest 불일치(승인 후 재료 변경)"
    action: halt
    note: "봉투 자동 실효, 재승인 필요(재정 R8)"
  - condition: "freeze.approval-valid 의 ack 집합 불일치"
    action: halt
    note: "항목 단위 승인이 성립하지 않은 봉투다. 재상정 대상."
  - condition: "freeze.digest-match 실패(원천 다이제스트 불일치)"
    action: halt
  - condition: "freeze.render-parity 실패"
    action: reject-upstream
    to: read
    note: "렌더 재생성"
  - condition: "freeze.id-monotonic 실패(항목 삭제·재번호)"
    action: reject-upstream
    to: read
  - condition: "freeze.payload-immutable 실패"
    action: reject-upstream
    to: read
    note: >-
      개정본이 옛 항목의 **내용**을 바꿔 적었다는 뜻이다. 내용을 고치려면 새 ID 를 추가하고
      옛 항목을 superseded 로 표시해야 한다 — 그것이 append-only 규율의 전부다.

# 재료 개정 시 하류 산출물은 전량 무효·재생성이다(재정 N11). 집행은 선언이 아니라 대조로 한다 —
# 모든 하류 산출물이 참조 spec_version·spec_digest 를 기록하고 게이트가 정합을 검사한다.
downstream_invalidation:
  on: "spec_version 증가"
  effect: "하류 산출물 전량 무효 · 재생성"
  enforced_by: "게이트 버전 정합 검사(design.spec-digest · compose.spec-digest)"
