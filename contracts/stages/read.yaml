# 스테이지 I/O 계약 — `read`
#
# 정본 서술 = docs/SPEC.md §1.4 (+ §1.5 CP1). 이 파일은 그 서술의 기계 판독본이며,
# 어긋나면 SPEC 이 이긴다. 서식 = SPEC §1.2 고정 서식 + `schema` 키
# + 서식 확장 3 `checks_on_entry`(재정 P-C) + `execution`(E 지시) + `phase_gates`(재정 P-U3).
#
# ★ 공통 규칙 — 런은 시작 시점 git 커밋에 결박된다(재정 P-U1). 계약·스키마·검증기·러너가
#   함께 고정되므로, 런 도중 리포가 개정되어도 이 런의 법은 run.yaml#engine.commit 하나다.

schema: stage-contract/v0
id: read

# 분해를 독립 2회 실행하는 이유는 품질이 아니라 **안정성**이다(SPEC §1.4).
# 두 독립 실행이 다른 청구항 트리를 낳는다면 그 소재에 대한 독해는 재현되지 않는 것이고,
# 이후 모든 결정론 검사의 기준점이 흔들린다.
# ★ 다만 2회가 필요한 구간은 **분해까지**다 — 수렴이 통과하면 두 산출은 동치로 선언되며,
#   접지 이후는 정본 1개만 진행한다(재정 P-4 · E 지시). 아래 `execution` 이 그 정본이다.
lane:
  kind: llm
  model: opus-5
  effort: max
  independence: >-
    두 분해 실행은 서로의 산출을 보지 않는다. 같은 세션의 재생성은 독립 실행이 아니다
    (SPEC §2.6 검사 4 보조 규정). provenance.read_runs[] 에 두 실행 식별자를 남긴다.
  # 하위 작업 레인. 재정 R3: 비용은 관할을 낮춰서가 아니라 **레인을 낮춰서** 푼다.
  sub_lanes:
    - id: decompose
      model: opus-5
      effort: max
      scope: "D5 ① 청구항 구성요소 전 분해 + ② 관계 트리"
    - id: ground-independent
      model: opus-5
      effort: high
      scope: "D5 ③ 독립항 element 3중 접지"
    - id: ground-dependent
      model: opus-5
      effort: low
      scope: >-
        D5 ③ 종속항 additions 3중 접지. 저비용 레인 허용(재정 R3) — 관할을 낮춘 것이 아니라
        레인을 낮춘 것이다. ★ 다만 두 검사가 보증하는 것은 **구조**뿐이다(참조 해소·kind 제약·
        1:1·역참조·anchor_state 정합). 인용한 문단이 그 구성요소를 실제로 조응하는지는 어떤
        결정론 검사도 판정하지 못하며, 그 판단은 CP1 의 Owner 몫이다(M1 재감수 M-03 처분 —
        구 문언은 "정확성을 보증한다"고 적어 검사의 관할을 실제보다 넓게 말했다).
    - id: synthesize
      model: opus-5
      effort: max
      scope: "D5 ④ 유기적 통합 + ⑤ 포지셔닝 + 기술적 함의(implication)"
  # 레인 규약(SPEC §7.3 펜 배정 규율 2·3을 독해 레인에도 적용한다).
  lane_discipline:
    - "모델·effort 는 API 레벨 하드 지정한다. 프롬프트 문구로 소프트 지정하지 않는다."
    - "한 배치의 팬아웃은 30 미만이며, 초과분은 배치를 쪼개고 배치마다 체크포인트를 남긴다."
    - "첫 배치 완료 직후 실호출 model·effort 를 transcript 로 확인한 뒤 계속한다."

  # ★ 모델 신원 표기 (2026-08-18 통주 실측 처분).
  #
  #   조용한 대체 금지(재정 R10 규율 4)의 대조는 **문자열 동등**이었다. 그런데 계약이 쓰는
  #   값은 **티어 라벨**(`opus-5`)이고 레인이 관측하는 값은 **API 식별자**(`claude-opus-5[1m]`)라,
  #   같은 모델이 두 표기를 갖는다. 실특허 통주에서 그 일이 실제로 일어났다 — 레인이 자기
  #   식별자를 정직하게 적었더니 러너가 `mismatch: true` 를 기록했고, 레인은 검사를 통과시키려
  #   답을 고쳐 써야 했다. **정직한 레인이 벌받고 라벨을 반향하는 레인이 통과하는** 구조이며,
  #   그것은 이 검사가 막으려던 것과 정반대다.
  #
  #   그러므로 라벨 공간을 계약이 명시한다. 대조는 아래 표로 정규화한 뒤에 한다.
  #   거짓 경보는 검사를 우회하게 만들고, 우회되는 검사는 없는 검사보다 나쁘다.
  model_identity:
    tag: "[가설]"
    rule: >-
      응답의 model 이 요청 티어 라벨과 같거나, 그 라벨의 aliases 에 속하면 **일치**로 본다.
      어느 쪽에도 없으면 대체이며 lane-log 에 mismatch 로 남는다.
    labels:
      - label: opus-5
        aliases: [claude-opus-5, "claude-opus-5[1m]", opus]
      - label: sonnet-5
        aliases: [claude-sonnet-5, "claude-sonnet-5[1m]", sonnet]
      - label: haiku-5
        aliases: [claude-haiku-5, haiku]
      - label: gpt-5.6-sol
        aliases: [gpt-5.6-sol, sol]
    open_question: >-
      ★ 재정 대기. 이 표는 통주 실측 1건을 보고 잡은 잠정이며, 어휘의 확정은 입법이다(D7).
      미결 둘 — ① 별칭을 계약이 열거할 것인가 접두 규칙으로 둘 것인가(모델 판이 늘 때마다
      계약을 고쳐야 하는 비용 vs 접두 규칙이 다른 티어를 삼킬 위험) ② 티어 라벨과 API
      식별자 중 **무엇을 정본으로 기록할 것인가**. 지금은 라벨로 대조하고 식별자는 레인
      보고에 남긴다.

  # ★ effort 필드의 증거 등급 (같은 통주에서 레인이 상신).
  #   레인은 자기 reasoning effort 설정을 **내성할 수 없다.** 따라서 응답의 effort 는 관측이
  #   아니라 **요청값의 반향**이며, 그 자기 신고로는 effort 대체를 반증하지 못한다.
  #   이것은 결함이 아니라 증거 등급의 사실이고, 그래서 규율 3 이 존재한다 — effort 의
  #   실증은 레인의 자기 신고가 아니라 **오케스트레이터 transcript 의 실호출 확인**이다.
  #   자기 신고를 증거로 쓰지 마라(D9 의 "계기는 자기보고를 쓰지 않는다"와 같은 이유다).
  effort_evidence:
    lane_self_report: echo        # 반향 — 반증력 없음
    authoritative_source: "오케스트레이터 transcript 의 실호출 확인(lane_discipline 규율 3)"

  # ★ 레인 왕복의 시점 결속 (재정 2026-08-19 P-12).
  #
  #   두 사고가 한 뿌리였다. ① 요청이 입력 지문을 싣지 않아, 요청이 갱신된 뒤 낡은 응답의
  #   **여전히 유효한 항목 ID** 가 다른 항목으로 조용히 미끄러질 수 있었다(감수 OOS-01).
  #   재번호는 결함을 결함 그대로 옮기므로 어떤 결정론 검사도 이것을 잡지 못한다.
  #   ② 통합 레인이 응답을 쓴 뒤 총괄이 런을 복사했고 그 후 레인이 응답을 **다시 썼다**.
  #   커밋본 SHA `472f…`(5항목/8참조) 와 worktree `b6ab…`(6항목/16참조) 가 갈렸는데,
  #   레인 로그에 응답 지문이 없어 **런이 어느 쪽이 정본인지 증명하지 못했다**(감수 OOS-02).
  #
  #   그래서 왕복에 시점을 넣는다. 이것은 신설 규율이 아니라 이 리포가 이미 파일에 적용하고
  #   있는 지문 결속(런 결박 `run.yaml#engine.commit` · 봉투 결속 `target.digest`)의
  #   **레인 왕복 확장**이다. 산출물이 증거이려면 그 산출물의 시점이 먼저 고정되어야 한다.
  #
  #   ★ 규격 개정 (재정 2026-08-19 S4). 구 판은 요청 필드 목록의 정규 JSON 을 쟀고, 그중
  #     절차 문서는 prompt_path 라는 **경로 문자열**로만 들어갔다. 그런데 요청서는 그 절차
  #     문서의 **본문을 인라인**한다 — 즉 레인이 실제로 읽는 프롬프트의 대부분이 지문 밖에
  #     있었다. 그래서 서로 다른 실제 프롬프트가 같은 지문을 공유했고, 구 응답이 그 창으로
  #     통과했다(2026-08-19 감수 D 실측: 보관 요청문 29,046 B ↔ 같은 필드로 재렌더한
  #     39,152 B, 지문은 동일). 지금 지문이 재는 것은 **렌더된 요청서 본문 전체**이며 지문
  #     행 자신만 빠진다. 구 선언 키 둘(필드 목록·정규 JSON 직렬화 규약)은 폐기했다 [폐기].
  round_trip_binding:
    ruling: "재정 2026-08-19 S4 (P-12 의 확장)"
    digest_target: rendered-request-md
    digest_rule: >-
      렌더된 요청서 본문에서 `| 입력 지문 |` 로 시작하는 **한 줄을 제거한** 나머지의 UTF-8
      바이트를 sha256 으로 잰다. 제외는 그 한 줄뿐이며(값이 자기를 재는 순환을 끊는 유일한
      예외), 삽입은 순수한 한 줄 삽입이므로 제거하면 원본이 그대로 복원된다.
    recompute_by_hand: "grep -v '^| 입력 지문 |' request.md | sha256sum"
    binds: >-
      요청 필드 전량(lane_id·read_run·task·model·effort·prompt_path·instructions·
      response_schema·slices·batch) + **절차 문서 본문**(인라인) + 원문 조각. 절차 본문이
      들어가는 것이 이번 개정의 핵심이다 — 구 규격은 경로 문자열만 들어 절차 개정이 지문에
      닿지 않았다.
    why: >-
      파일 하나만 받은 제3자가 코드 없이 같은 값을 낼 수 있어야 한다(총괄 재량 H2 의 원칙
      "파일에 실리지 않는 값을 지문에 넣으면 대조가 코드의 특권이 된다" 의 정방향 적용).
      accepted_models 가 지문 밖인 것도 같은 이유다 — 계약에서 파생되어 요청 파일에 실리지
      않는다. repo_root 도 지문 밖이다: 그것이 만든 **본문**이 파일에 있으므로, 같은 절차
      본문이면 두 리포에서 같은 지문이 나온다.
    echo_obligation: >-
      응답 JSON 최상위에 input_digest 를 요청값 **그대로** 적는다(계산이 아니라 옮겨 적기다).
      요청서 request.md 의 표와 request.json 이 그 값을 든다.
    log_obligation: >-
      lane-log.json 의 각 행이 input_digest(요청) · echoed_digest(반향) ·
      request_digest(request.md 파일 바이트의 sha256 — 재정 S4 · Q8 ③) ·
      response_digest(response.json 파일 바이트의 sha256) · digest_ok 를 든다.
      사람은 `sha256sum request.md` · `sha256sum response.json` 으로 그 자리에서 대조한다.
      요청 파일을 쓰지 않는 어댑터(재생 어댑터)의 왕복은 request_digest 가 null 이며, 판정은
      그 행을 대상에서 빼되 제외 건수를 산출(request_digest_exempt)에 남긴다.
      ★ null 이 뜻하는 것은 **능력의 부재 하나뿐이다**(2026-08-19 보수). 요청 파일을 쓰는
      어댑터가 그 파일을 읽지 못하면 값은 null 이 아니라 빈 문자열이고, 그것은 면제가 아니라
      결함으로 판정에 걸린다 — 구 구현은 읽기 실패(OSError)까지 null 로 접어 면제로 셌고,
      그래서 파일 어댑터가 쓴 request.md 가 사라져도 판정이 한 건도 울지 않았다.
    on_mismatch: reject            # 러너가 응답을 소비하지 않고 거부 행을 남긴 뒤 던진다
    on_missing_echo: reject        # 반향 부재 = 계약 위반(LaneContractError)
    implemented_by: engine/lanes/contract.py    # render_request_body · digest_source · compute_input_digest
    request_digest_by: engine/lanes/file_adapter.py   # FileLaneAdapter.request_md_digest
    enforced_by: engine/stages/read.py   # _dispatch 의 거부 기록 + read.lane-log-shape 판정 3항
    falsified_by: tools/check_lane_binding.py   # 낡은 응답 주입 · 응답 사후 교체 · 절차 문서 변조의 실행 반증

  # ★ 레인 id 어휘 (재정 2026-08-19 Q7 ②).
  #
  #   구 판은 `retry-N` 의 N 이 **런 전역 재시도 예산**의 소진량이었다. 그래서 분해가 한 번
  #   재시도하면 그 뒤의 접지·통합이 **첫 시도인데도** `retry-1/batch-0` 으로 발번되고
  #   `batch-0` 은 아예 존재하지 않았다(통주 3 실측 — `ground-independent` 에 첫 시도 기록이
  #   없었고, 레인이 그것이 의도인지 물어 왔다). 레인 로그의 증거력을 재정 P-12 로 세운
  #   직후이므로 같은 로그의 다른 필드가 사실 아닌 것을 말하는 것을 두지 않는다.
  #
  #   어휘의 정본은 계약이고 코드는 그것을 따른다 — 러너가 발번 규칙을 스스로 정하면 로그를
  #   읽는 사람이 무엇을 근거로 "재시도했다"를 읽어야 하는지가 코드에만 산다.
  lane_id_vocabulary:
    ruling: "재정 2026-08-19 Q7 ②"
    form: "<read_run>/<task>[/retry-<n>]/batch-<k>"
    terms:
      batch: "팬아웃 분할의 순번(0부터). 재시도와 무관하다."
      first_attempt: >-
        접두 없는 batch-<k> = 그 레인의 **첫 시도**다. 재시도한 적이 없다는 뜻이며, 다른
        레인이 재시도했더라도 이 좌표는 바뀌지 않는다.
      retry_n: >-
        retry-<n> 의 n = **그 레인 자신의 재시도 회차**(1부터). 런 전역 시도 횟수도, 재시도
        예산의 소진량도 아니다.
    separate_paths: "재시도는 별도 경로를 쓴다 — 같은 자리에 덮어쓰면 1차 응답이 사라진다."
    budget_is_not_the_coordinate: >-
      ★ **개정 (재정 2026-09-01 T16).** 구 문언 — *"재시도 **예산**은 여전히 런 전역이다
      (failure[].action 의 retry(n) 하나를 분해 재시도와 정본 후속 재시도가 나눠 쓴다).
      convergence_detail.attempt 가 싣는 값도 그 전역 예산의 소진량이다."* — 은 **폐기**한다.
      그 문언은 Q7 의 **범위 보존** 진술이었지 예산 배분의 독립 판단이 아니었고, 재정 P-4 가
      판정점을 둘로 늘린 뒤 전역 슬롯의 뜻이 「총비용 상한」에서 「먼저 도착한 판정점의
      우선권」으로 미끄러졌다. 예산의 정본은 이제 위 `retry_budget` 블록이다.
      **살아남은 것** — 카운터를 나눈 것이 예산을 **몰래** 늘리는 것으로 미끄러지면 안 된다:
      각 판정점의 상한은 계약이 정한 값이며 러너가 임의로 늘리지 않는다.
      레인 id 의 `retry-<n>` 은 종전 그대로 **그 레인 자신의 재시도 회차**이며, 이제
      `convergence_detail.attempt` 도 전역 소진량이 아니라 **그 판정점의 실행 회차**다.
    implemented_by: engine/lanes/plan.py#lane_id_for
    written_by: engine/stages/read.py#run   # 분해용·정본 후속용 회차를 각 실행 함수에 넘긴다

# ★ 실행 형태(E 지시 — 구 `lane.instances: 2` 표기를 폐기하고 이 블록이 대신한다).
#   폐기 근거: `instances: 2` 는 "스테이지 전체를 2회 돌린다"로 읽혀 접지·통합까지 2회로
#   오도했다. 재정 P-4 가 접지 이후를 정본 1개로 확정했으므로 표기를 정정한다.
execution:
  decompose_instances: 2          # 분해 2회 (독립) — 수렴 검사의 전제
  post_convergence_instances: 1   # 접지 이후 1회 (정본 1개) — 재정 P-4
  canonical_selection:
    rule: declaration-order        # read_runs[0]
    content_blind: true            # 어떤 품질 비교·판정도 금지
    why: "수렴 통과 = 동치 선언. 판정자가 없고, 재현성이 규칙을 요구한다(재정 P-4)."

# ★ 판정점별 재시도 예산 (재정 2026-09-01 T16-ⓐ ⒝ · 부속 2).
#
#   구 판은 예산이 **런 전역 1회**였다. 그 근거로 인용되던 문언
#   (`lane_id_vocabulary.budget_is_not_the_coordinate`)은 재정 Q7 의 **범위 보존** 문언이었고
#   ("카운터를 나눴다고 예산까지 몰래 늘리지 마라"), "예산이 하나여야 옳다"는 독립 판단이
#   아니었다 — Q7 의 안건은 레인 id 어휘였고 세 선택지 어디에도 예산 배분이 없었다. 그 사이
#   재정 P-4 가 판정점을 하나에서 둘로 늘렸고, 전역 슬롯의 뜻이 「총비용 상한」에서
#   **「먼저 도착한 판정점의 우선권」**으로 조용히 미끄러졌다. 실물 런에서 출구 검사가
#   78건을 냈는데 되먹임이 레인에 **한 번도 가지 않았다**.
#
#   그러므로 예산을 **판정점별로** 든다. Q7 이 지키려던 것은 그대로다 —
#   **각 판정점의 상한은 이 계약이 정한 값이며 러너가 임의로 늘리지 않는다.**
#   러너는 이 블록만 읽고(`engine/stages/read.py#_retry_budget`), `failure[].action` 의
#   `retry(n)` 은 같은 값을 조치 표 쪽에서 선언한다(두 곳이 어긋나면 시험이 잡는다).
retry_budget:
  ruling: "재정 2026-09-01 T16 (재정 2026-08-19 Q7 ② 의 budget_is_not_the_coordinate 를 개정)"
  binding_status:
    ruling: "감사 지적 A-3 처분 (2026-09-01)"
    # points[] 원소의 키를 분류한다. 상위 컨테이너 키는 바로 아래 container 에 따로 분류한다.
    runner_reads: [id, max_retries, checks]
    test_bound: [scope, repairs]
    prose_only: [gate, failure_means, why_per_read_run, why_this_can_be_repaired]
    container:
      runner_reads: [points]
      test_bound: [points_binding]
      prose_only: [ruling, escalate_on_repeat, feedback_discipline]
    why: >-
      exit 목록은 러너가 재시도 결정에 읽고, early 목록은 진입 시 승인 상수와
      대조한다. 조기 루프는 목록을 읽지 않고 실행별 표적 재시도를 한다.
  points:
    - id: early
      gate: "조기 관문 — 분해 직후"
      scope: per-read-run
      max_retries: 1
      repairs: decompose
      checks: [read.claim-inventory, read.dependency-parse, read.convergence]
      failure_means: "분해 결함"
      why_per_read_run: >-
        청구항 소유 검사가 read-a·read-b **각각**에 돌므로 결함 실행이 특정된다.
        그래서 **결함 실행만 표적 재시도**하며, 성한 실행을 다시 돌리지 않는다(부속 2).
        수렴(read.convergence)은 두 실행의 **비교**라 어느 한 실행에 귀속되지 않는다 —
        수렴 미달의 재시도는 두 실행을 함께 돌리고 **각 실행의 예산을 1회씩** 쓴다.
    - id: exit
      gate: "출구 관문 — 접지·수확·통합 뒤"
      scope: run
      max_retries: 1
      repairs: canonical-tail
      checks: [read.schema, read.claim-inventory, read.dependency-parse,
               read.verbatim, read.pointer-resolve, read.coverage,
               read.value-derivation, read.bibliography]
      # [정정 2026-09-02 · 재정 T26·T28] 구 문언 `checks: checks_before_exit`
      # (포인터 · 12행 전체)를 실제 재시도 가능한 명시 목록 8종으로 바꾼다.
      # read.convergence 는 T28 β 로 출구 재시도 목록 밖이다. 출구 exact-match
      # 미달은 재디스패치 없이 상신한다(P-4).
      failure_means: "조기 통과 후의 **국면 간 변이**"
      why_this_can_be_repaired: >-
        통합이 분해 산출에서 claims 를 **재복사**하므로, 조기 통과 후의 출구 실패에 한해
        후속 재시도가 실제로 고친다(재정 T16 §2 ⒜).
  escalate_on_repeat:
    rule: >-
      재시도가 **같은 실패 서명**을 재현하면 남은 예산을 쓰지 않고 즉시 상신한다.
    signature: "실패 판정 행의 (check_id, rule, locus) 집합"
    why: >-
      국면 간 변이가 레인 실수가 아니라 **코드 결함**이면 후속 재시도도 같은 실패를
      재현한다. **그 재현 자체가 진단**이므로 예산을 다 쓰기 전에 상신한다(재정 T16 §6 ⑤).
    reason_label_from: "failure[] 의 '같은 실패 서명' 행"
  feedback_discipline:
    rule: >-
      재시도 되먹임은 **판정 행의 검사 소견(Finding 8키)만** 담는다. 상대 실행의 산출
      (청구항 전문·항목 payload)은 담지 않는다.
    why: >-
      2회 독립의 독립성 보존(SPEC §2.6 검사 4 보조 규정 · 재정 T16 부속 5). 되먹임이
      그 구멍이 되면 두 실행은 더 이상 독립이 아니다.
  points_binding:
    rule: >-
      `failure[]` 의 `retry(n)` 행은 자기 판정점을 `points` 로 신고한다. 판정점 p 를 신고한
      행들의 n 집합은 `retry_budget.points[id=p].max_retries` 하나와 정확히 같아야 한다.
      신고하지 않은 `retry(n)` 행은 결함이다.
    why: >-
      구 판의 대조는 「집합 소속」이라 아무 조건으로든 `retry(2)` 를 한 줄 더하면 조기 상한
      2배가 통과했다(감사 지적 D-1). 조치와 판정점을 대응시켜 두 벌을 한 벌로 묶는다.

# ★ 「분해 전용 명세」 조립은 **파이프라인이 소유한다** (재정 2026-09-01 T16 부속 4).
#
#   직전 라운드의 실증은 감독의 **즉흥 조립**이었다. 어떤 필드를 넣고 무엇을 자리표시하는지가
#   성문화되지 않으면 **검사가 의도와 다른 인공물 위에서 돈다** — 「규칙 하나에 경계 하나」가
#   난다면 바로 여기다. 그래서 조립의 소유자·투입·자리표시를 계약이 든다.
early_phase_spec:
  ruling: "재정 2026-09-01 T16 부속 4"
  owner: engine/stages/read.py#decompose_only_spec
  built_from: "분해 응답 1건(read_run 별로 하나씩)"
  assembled_by: engine/stages/read.py#assemble_spec   # 출구 조립과 **같은 함수**다
  carries:
    - schema
    - reader_version
    - spec_version
    - status
    - run_id
    - patent
    - claims            # 분해가 낸 청구항 트리 그대로
    - items             # 분해 항목(kind: component)만
    - provenance
  placeholders:
    # ★ 두 갈래는 층이 다르다. 위는 조립기에 **넣는 것**이고 아래는 산출 명세에 **남는 것**이다.
    #   구 판은 이 둘을 한 목록에 섞어 적어 declared - actual 이 셋이나 났다(감사 지적 A-2).
    assembler_inputs:            # engine/stages/read.py#assemble_spec 의 **인자 이름**
      groundings: "[] — 접지 미실행"
      synthesis: "{} — 통합 미실행"
      harvest: "null — 수확 미실행"
    spec_fields:                 # 산출 명세의 실제 자리표시. 값 자체가 시험의 기대값이다.
      figures: []
      extensions.docent.drop_signal: {}
  judged_here:
    - read.claim-inventory
    - read.dependency-parse
    - read.convergence
  not_judged_here: >-
    접지·수확·통합 산출을 요구하는 검사(coverage·verbatim 의 접지 인용·value-derivation·
    bibliography·pointer-resolve)는 조기 국면의 판정 대상이 아니다 — 대상이 아직 없다.
    그것들은 출구 관문에서 돈다.
  why_the_same_assembler: >-
    조립기를 두 벌 두면 한 벌이 반드시 낡고, 그때 조기 검사는 출구가 보는 것과 **다른
    인공물** 위에서 돌게 된다. 같은 `assemble_spec` 을 자리표시만 채워 부른다.
  binding_status:
    ruling: "감사 지적 A-3 처분 (2026-09-01)"
    runner_reads: []
    test_bound: [owner, assembled_by, carries, placeholders, judged_here]
    prose_only: [ruling, built_from, not_judged_here, why_the_same_assembler]
    why: >-
      읽히지 않는 선언을 읽히는 것처럼 두지 않는다. 어느 칸이 어느 층인지 적지 않으면
      다음 사람이 산문을 강제로 오해하고, 그 오해가 「강제의 범위를 실제보다 넓게 말했다」다.

# ★ 진입 지문 검사(재정 P-C). 일반 원리 = "모든 스테이지는 진입 시 선언된 입력의 지문을
#   검증한다". 검사 목록의 소유자는 코드가 아니라 이 계약이다 — 러너는 이 블록을 읽어 실행한다.
checks_on_entry:
  - id: read.input-digest
    criterion: >-
      선언된 입력 전건의 지문 대조 — patent.md ↔ patent.sha256 ↔ run.yaml.patent.source_sha256
      ↔ source-report.json#source.canonical_sha256, 그리고 도면 세트 매니페스트 지문
      ↔ source-report.json#figures[].sha256.
    implemented_by: engine/stages/__init__.py
    on_mismatch: environment-error
    note: "불일치는 품질 결함이 아니라 환경 오류다 — 재시도·수정 루프가 아니라 즉시 중단+진단(재정 P-C)."

inputs:
  - 00-source/patent.md
  - 00-source/patent.sha256
  - 00-source/figures-raw/
  - 00-source/source-report.json
  - run.yaml
  - 10-read/convergence-early.json   # 접지 단계의 **선언 입력**(재정 P-U3) — 아래 phase_gates

may_read:
  - "00-source/**"
  - "reader/procedure/**"
  - reader/schemas/material-spec.schema.json
  - reader/reader-rules.yaml
  - docs/CHARTER.md
  - "40-compose/<variant>/material-defect.md"   # 반려 시에만

# 독해는 서사·훅을 모르는 상태에서 수행되어야 한다. 블루프린트나 초안을 본 독해 레인은
# "쓰기 좋은 재료"를 향해 편향되며, 이는 재료 명세가 historian 과의 계약(D14)이라는 사실과
# 정면으로 충돌한다 — 재료는 이 스레드가 아니라 이 특허의 함수여야 한다.
must_not_read:
  - "20-design/**"
  - "40-compose/**"      # material-defect.md 제외
  - "50-gate/**"
  - "65-critique/**"
  - "ledgers/anchors/**"

outputs:
  - 10-read/material-spec.json      # status: draft
  - 10-read/material-spec.md        # CP1 판독본(KR 틀 · EN 값) — CP1 주 표면(재정 P-U5)
  - 10-read/claim-trees/
  - 10-read/grounding.md
  - 10-read/positioning.md
  - 10-read/drop-signal.md
  - 10-read/convergence-early.json  # phase: "early" — 분해 직후 조기 수렴 판정서(재정 P-4)
  # ★ 게이트 판정을 convergence-early.json 에 적으면 안 된다. 봉투가 그 파일의 SHA-256 에
  #   결속되므로 봉투 발행 전후로 지문이 달라져 결속이 스스로 깨진다(재정 T17).
  - 10-read/phase-gate.json         # 접지 진입·차단의 별도 판정 기록
  - 10-read/convergence.json        # phase: "full" · 계약 = contracts/schemas/convergence.schema.json
  - 10-read/lanes/                  # 레인 요청·응답 전량 + lane-log.json

# ★ 레인 기록이 필수 산출인 이유. 레인 호출을 파일로 남기지 않으면 "어떤 프롬프트에 어떤
#   모델이 무엇을 답했는가"가 세션 안에서만 존재하고 사후 감사에 닿지 않는다. 재료 명세는
#   무엇이 나왔는지만 말하고 어떻게 나왔는지는 말하지 않는다. lane-log.json 은 요청 모델·
#   effort 와 **실제로 돌아간** 모델·effort 를 나란히 적어 조용한 대체를 드러낸다
#   (SPEC §7.3 펜 배정 규율 3·4의 정신을 독해 레인에 적용).
#
#   ★ 같은 행이 **응답 지문도 병기**한다(재정 P-12 — 위 lane.round_trip_binding).
#   input_digest(요청) · echoed_digest(레인의 반향) · response_digest(러너가 소비한
#   response.json 파일 바이트의 sha256) · digest_ok 네 칸이며, 러너가 거부한 응답은
#   rejected: true 행으로 남는다. 모델 병기가 "누가 답했는가"를 드러낸다면 이 병기는
#   "무엇에 대해 답했으며 그 답이 지금도 그 파일인가"를 드러낸다 — 파일로 남기는 것만으로는
#   부족하다는 것이 OOS-02 의 실측이다(같은 자리에 응답이 두 번 쓰였고 런이 정본을
#   증명하지 못했다).
#
# ★ 맹검 스크리닝 메모의 원장(ledgers/shadow/screening.jsonl)은 **런 밖**이며 재료 명세
#   계약면 밖이다(재정 P-U4). 따라서 outputs 에 등재하지 않는다. CP1 에는 convergence.json 의
#   screening_memos 를 거쳐 표면화된다.

optional_outputs: []

# ★ 단계 진입 게이트(재정 P-U3). 조기 수렴 판정서를 접지 단계의 **선언 입력**으로 결속해
#   "수렴을 먼저 돌린다"가 실행 순서의 관습이 아니라 기계 강제가 되게 한다.
phase_gates:
  - phase: grounding
    declared_input: 10-read/convergence-early.json
    entry_condition: "판정서 존재 ∧ (통과 ∨ (상신 축 미달 ∧ Owner '계속' 봉투))"
    continue_envelope: 10-read/convergence-continue.md
    envelope_binding: "봉투의 target.digest == 판정서 파일의 SHA-256 (R8 규격)"
    envelope_scope:
      ruling: "재정 2026-09-01 T17"
      applies_to: [convergence-escalation]
      not_applies_to: [claim-checks, convergence-exact-match]
      why: >-
        봉투는 「갈렸지만 알고 넘어간다」는 기록인데 청구항 결함은 갈림이 아니라 결함이다.
        성질이 다른 것을 같은 봉투로 넘기면 봉투가 만능 통행증이 되며, 청구항 결함에는
        분해 재시도라는 고칠 레인이 이미 있다.
      disposition_when_out_of_scope:
        claim-checks: "분해 재시도 — 조기 예산 소진 시 계약 실패표(escalate)"
        convergence-exact-match: "조기 수렴 재시도 — 예산 소진 시 계약 실패표(escalate)"
      not_retroactive: >-
        WO 런의 봉투는 tree-edges 미달 하나를 넘겼으므로 유효하고 동결본 v1 은 그대로 선다
        (행위시법 P-U1).
    blocked_by_vocabulary:
      - value: none
        meaning: "조기 청구항 검사와 수렴 판정이 전부 통과해 차단 사유가 없음"
      - value: claim-checks
        meaning: "조기 청구항 소유 검사 실패가 접지 진입을 차단함"
      - value: convergence-exact-match
        meaning: "조기 수렴 exact-match 축 미달이 접지 진입을 차단함"
      - value: convergence-escalation
        meaning: "조기 수렴 상신 축 미달이 접지 진입을 차단함(유효한 계속 봉투의 적용 대상)"
    verdict_artifact: 10-read/phase-gate.json
    verdict_artifact_note: >-
      게이트 판정을 조기 수렴 판정서(convergence-early.json)에 적지 않는다. 봉투가 그 파일의
      SHA-256 에 결속되므로 게이트 판정을 거기에 실으면 봉투 발행 전후로 지문이 달라져 결속이
      스스로 깨진다. 그래서 phase-gate.json 은 별도 산출물이다.
    verdict_artifact_keys:
      phase: "진입을 판정한 후속 국면(grounding)"
      declared_input: "게이트가 결속한 조기 수렴 판정서 경로"
      entered: "접지 국면 실제 진입 여부"
      early_passed: "조기 판정 전부 통과 여부"
      blocked_by: "조기 판정의 차단 사유 라벨"
      envelope_scope: "Owner '계속' 봉투가 적용될 수 있는 차단 사유 집합"
      envelope: >-
        봉투의 네 상태 — present(파일 실재)·valid(판정서 결속까지 유효)·in_scope(차단 사유가
        적용 범위 안)·applied(실제 진입에 사용) — 와 결속 판정 메모
      reason: "사람이 읽는 진입·차단 사유와 처분"
      ruling: "게이트와 적용 범위를 정한 재정 목록"
    binding_status:
      ruling: "감사 Y-3 처분 (2026-09-01)"
      runner_reads: [declared_input, continue_envelope]
      test_bound:
        - phase
        - entry_condition
        - envelope_binding
        - envelope_scope
        - blocked_by_vocabulary
        - verdict_artifact
        - verdict_artifact_keys
      prose_only: [verdict_artifact_note]
      why: >-
        읽히지 않는 선언을 읽히는 것처럼 두지 않는다. 어느 칸이 러너 경로 해석에 쓰이고,
        어느 칸이 실물 산출·행동 시험에 묶이며, 어느 칸이 사람을 위한 설명뿐인지 적지 않으면
        선언과 실물이 다시 갈려도 같은 격의 새 구멍을 알아볼 수 없다.

# D5 5단계 ↔ 산출물 대응 (SPEC §1.4).
stage_artifacts:
  - step: "① 청구항 구성요소 전 분해"
    artifact: ["10-read/claim-trees/", "material-spec.json claims.independent[]·claims.dependents[]"]
  - step: "② 관계 트리 도식화"
    artifact: ["10-read/claim-trees/"]
  - step: "③ 3중 접지"
    artifact: ["10-read/grounding.md", "items[] kind: grounding"]
  - step: "④ 유기적 통합"
    artifact: ["10-read/material-spec.md 의 통합 그림 절"]
  - step: "⑤ 포지셔닝"
    artifact: ["10-read/positioning.md", "items[] kind: positioning"]

# ★ drop 신호 2단(D4 — 재정 P-A 로 문언 개정). 구 문언은 "조기 신호가 drop-proposed 면 그
#   시점에 즉시 escalate" 였고, 그 escalate 는 **폐기**되었다(재정 P-A). 폐기 근거: 청구항만
#   본 조기 판단으로 런을 세우면 완전 정보 위에서의 재정 1회라는 원칙이 깨진다. 조기 판단은
#   버리지 않고 **맹검 관찰 메모**로 강등해 축적한다(historian 스크리닝의 사전 훈련 데이터).
drop_signal:
  early:
    form: blind-screening-memo      # 상신 없음 · 진행 계속 (재정 P-A)
    recorded_by: [read-a, read-b]   # 각자 (재정 P-U4)
    withheld_from: synthesize       # 최종 서사 평가 레인에 비공개(앵커링 방지)
    surfaced_at: CP1                # 둘 다 병기
  final:
    at: "포지셔닝 확정 후"
    adjudicated_at: CP1             # 확정 재정은 CP1 에 통합 (재정 P-A)

# ★ 섀도 원장의 **누적 자리** (재정 P-U4 × P-U1 — 2026-08-19 보수).
#
#   원장은 런 밖이고 계약면 밖이므로 outputs 에 등재하지 않는다(위 주석). 그러나 **어디에
#   쌓이는가**는 계약 사항이다 — 그 자리가 정해지지 않은 동안 통주 2 의 메모 4행은 커밋
#   결박된 격리 체크아웃(`.worktrees/<run-id>`) 안에 쌓였고, worktree 는 .gitignore 대상인
#   소모품이라 **리포에는 한 행도 도착하지 않았다**. 재정 P-U4 가 원장에 부여한 목적(맹검
#   판단 · 최종 평가 · Owner 재정 3층 축적 = historian 스크리닝의 사전 훈련 데이터, D4)이
#   한 건도 달성되지 않은 상태였다. 행 수가 틀린 장부는 고칠 수 있지만 없는 장부는 고칠 것이
#   없다 — 그래서 이 블록이 생겼다.
#
#   원리 한 줄: **법은 worktree 에서 오고(P-U1 행위시법) 축적은 리포에 남는다(P-U4).**
shadow_ledger:
  path: ledgers/shadow/screening.jsonl
  accrues_to: main-worktree        # 격리 체크아웃에서 돌아도 **주 작업 트리**에 쌓는다
  root_resolution:
    owner: engine/paths.py#shadow_ledger_root
    judgment_source: engine/gitpin.py   # worktree 판정의 단일 진원 (재정 P-U1·P-8)
    order:
      - "① shadow_root 명시 지정이 있으면 그 값 (source: explicit)"
      - "② 주 작업 트리면 그 자리 (source: main-worktree)"
      - "③ 링크된 worktree 면 주 작업 트리로 옮긴다 (source: main-worktree-resolved)"
      - "④ git 판정 불가면 계약 트리 루트 + 그 사실을 산출에 기록 (source: git-unavailable)"
    refuses: >-
      worktree 임을 판정했는데 주 작업 트리를 찾지 못하면 ShadowLedgerRootError 로 거부한다.
      아는 채로 사라지는 장부를 만들지 않는다.
  explicit_override: >-
    shadow_root = **누적 루트의 명시 지정**이다(테스트 하네스 전용 주입구가 아니다 —
    2026-08-19 정정). 테스트 격리(재정 G6·P-U2)는 그 지정의 한 사용자일 뿐이며, 합성 픽스처는
    이 인자를 반드시 채운다(과거 생산 원장 1,178행 오염).
  rows_per_run: 1                  # 런 **종결** 시 1행. LanePending 재진입은 종결이 아니다(재정 P-12 라운드 보수)
  pointer_artifact: 10-read/lanes/shadow-ledger.json
  pointer_note: >-
    러너가 **어느 원장에 썼는지**를 런 안에 남긴다(경로 + 판정 사유 root_source + 기입 여부).
    원장이 런 밖에 있으므로 이것이 없으면 런 산출물만 보고는 자리를 알 수 없고, 자리를 적지
    않으면 다음에 또 사라진다. 소급 이관은 하지 않는다 — 구 런의 행은 행위시법 아래 있다.

# ★ 이 목록은 검사의 정의이고 호출점은 둘이다(재정 T16). phases 가 그 호출점을 든다 —
# [early, exit] 인 검사는 분해 직후 조기 관문에서도 돈다. 블록 이름을 바꾸지 않은 이유는
# checks_before_exit 가 계약 서식의 고정 키이기 때문이다.
#
# ★ 청구항 2종의 출구 행은 탐지가 아닌 세 격으로 존치한다(정정 D-20260901-01 §10 · 감사
# §2 E). ① 최종 판정서와 CP1 표면에 판정을 기록하고, ② Owner '계속' 봉투로 조기 실패를
# 지난 경로에서 다시 보고해 최종 처분을 만든다. 다만 재정 T17 뒤 이 우회 경로의 현재 사거리는
# 상신 축 미달뿐이다. ③ 뒷날 assemble_spec 이 claims 문언을 건드릴 때를 대비한다. 두 검사는
# material_id 를 읽지 않고 오늘 조기·출구 claims 의 나머지 문언은 같으므로 **오늘 탐지량은 0**이다.
checks_before_exit:
  - id: read.schema
    phases: [exit]
    criterion: "reader/schemas/material-spec.schema.json 검증 통과"
    implemented_by: reader/lib/schema_check.py
  - id: read.source-digest
    phases: [exit]
    criterion: >-
      `sha256(원천) == patent.source_digest`. 불변식 I1(SPEC §2.2)의 집행자이며 **전제 검사**다 —
      이것이 깨지면 아래 verbatim 계열이 전부 무의미하다. 원천을 주지 않고 돌리면 checked=0 ·
      vacuous: "empty-target" 으로 날인되어 "원천 없는 통과"가 통과로 보이지 않는다.
    implemented_by: reader/lib/source_digest.py
    note: >-
      ★ M1 재감수 M-01 보수 — 스테이지가 실제로 실행하는데 이 계약이 선언하지 않고 있었다.
      계약이 모르는 검사는 사후 감사에서 근거 없는 검사가 되고, 반대로 계약에만 있고
      실행되지 않는 검사는 공허한 약속이 된다. 양방향 다 결함이다. 출구 국면의 source_text 는
      매 회차 디스크에서 다시 읽은 본문이며, 명세가 든 진입 시점 patent.source_digest 와
      대조하므로 도중 변경이 실제로 발동한다(재정 2026-09-02 T24).
  - id: read.verbatim
    phases: [exit]
    criterion: "모든 text_verbatim·quote·caption_quote·evidence_quotes[]·quotes[] 가 원천의 바이트 정확 부분문자열"
    implemented_by: reader/lib/verbatim.py
  - id: read.pointer-resolve
    phases: [exit]
    criterion: >-
      전 구조 참조가 실재 대상으로 해소 + kind 제약 + 자기참조 없음 + 참조 그래프 비순환.
      참조 대상에는 함의·포지셔닝의 `numeric_refs[]`(대상 kind = `fact`)가 포함된다(재정 P-B) —
      중요분은 LLM 의 중요도 판단이 아니라 이 역참조가 도출한다.
    implemented_by: reader/lib/pointers.py
  - id: read.coverage
    phases: [exit]
    criterion: "독립항 element 전량 + 종속항 additions 전량 접지 · material_id 1:1 · claim_ref 역조건"
    implemented_by: reader/lib/coverage.py
  - id: read.dependency-parse
    phases: [early, exit]
    criterion: >-
      종속항 text_verbatim 파싱 집합 == depends_on, 어형 ↔ dependency_type 정합.
      `unclassified`(구조 미분류 — Markush·조건부·수단항·카테고리 전환)는 이 두 판정에서
      제외하고 별도로 계수해 CP1 미분류 목록에 전건 노출한다(재정 P-1). 다만 파싱이 되는
      종속항에 `unclassified` 를 선언하면 실패다 — 미분류는 회피 통로가 아니다.
    implemented_by: reader/lib/dependency_parse.py
    ruleset: reader/reader-rules.yaml#dependency_citation
    phase_meaning: >-
      조기 실패 = **분해 결함**(조기 예산 · 분해 재시도) /
      출구 실패(조기 통과 후) = **국면 간 변이**(후속 예산 · 정본 후속 재시도).
      ★ 출구 행이 빨개졌다고 반사적으로 분해를 재시도하지 마라 — 변이는 후속에 있다.
      분해 재시도 후 같은 출구 실패가 재발하면 그것이 오라우팅의 첫 징후다(재정 T16 §7).
  - id: read.value-derivation
    phases: [exit]
    criterion: >-
      origin별 대조 + value_type ↔ value_raw 파싱 일치 + value_normalized == render(value_type) +
      깊이 1 + _en 한글 부재. 더해 `origin ∈ {quoted, bibliographic}` 집합이 수확기 재실행
      결과와 **정확히 일치**해야 한다(value.harvest-parity — 재정 P-B). 수확 누락·심은 수치는
      이 대조가 잡는다.
    implemented_by: reader/lib/derivation.py
    ruleset: reader/reader-rules.yaml#value_grammar
  - id: read.bibliography
    phases: [exit]
    criterion: >-
      서지 확장 필드가 서지면에서 결정론 복사되었음의 대조(재정 P-2 ⓐ) — 관할 접두·공보 종별
      접미 일치, 발명자·출원인·분류 코드·우선권 번호의 원천 바이트 정확 부분문자열,
      그리고 `dates.priority == min(priority_claims[].date)`(C18 최우선일 요건).
    implemented_by: reader/lib/bibliography.py
    ruleset: reader/reader-rules.yaml#bibliography
    introduced_by: "재정 2026-08-18 P-2 ⓐ"
  - id: read.claim-inventory
    phases: [early, exit]
    criterion: "원천 청구항 인벤토리 ↔ 등재분 양방향 일치 + 청구항별 구간 내 verbatim"
    implemented_by: reader/lib/inventory.py
    ruleset: reader/reader-rules.yaml#claim_inventory
    introduced_by: "재정 N14 ① (M0 M12 · M0.6 재감수 M-07 처분)"
    phase_meaning: >-
      조기 실패 = **분해 결함**(조기 예산 · 분해 재시도) /
      출구 실패(조기 통과 후) = **국면 간 변이**(후속 예산 · 정본 후속 재시도).
      ★ 출구 행이 빨개졌다고 반사적으로 분해를 재시도하지 마라 — 변이는 후속에 있다.
      분해 재시도 후 같은 출구 실패가 재발하면 그것이 오라우팅의 첫 징후다(재정 T16 §7).
  - id: read.convergence
    phases: [early, exit]
    criterion: >-
      독립 2회 분해 비교 6축을 **축별 정책**으로 판정한다(재정 P-3) — 구조 사실 3축
      (independent-count·dependent-count·dependent-set)은 `exact-match`(완전 일치),
      해석 여지 2축(element-set·tree-edges)은 `escalation-trigger`(미달 = 실패가 아니라 상신),
      addition-attachment 는 `measure-only`(판정 제외·측정 전용). 구 문언 "6축 전부 통과"는
      폐기한다 — 세 층을 같은 무게로 읽으면 P-3 의 의미론 분화가 사라진다.
    implemented_by: reader/lib/convergence.py
    ruleset: reader/reader-rules.yaml#convergence
    phase_meaning: >-
      조기 = 두 분해 산출만으로 6축을 계산한 **조기 판정서**이며 접지 진입 게이트의 결속 대상 /
      출구 = 정본이 전 단계를 마친 뒤의 **최종 보고서 기록**(재정 P-4·P-U3).
  - id: read.lane-log-shape
    phases: [exit]
    criterion: >-
      레인 로그가 계약 실행 형태와 일치한다 — 분해는 두 실행(read-a·read-b) 각 1건,
      접지·통합은 **정본 실행에만** 존재하고 비정본 실행에는 **부재**한다(재정 P-4·P-U3).
      더해 왕복의 **시점 결속**을 본다(재정 P-12): 모든 행이 비지 않은 input_digest 를 들고
      (lane-log.request-digest), 응답이 도착한 행 — 러너가 거부한 행을 포함한다 — 은 비지 않은
      response_digest 와 digest_ok: true 를 든다(lane-log.response-digest).
      **요청 파일 지문**도 같은 층에서 본다(재정 2026-08-19 S4 · Q8 ③): 모든 행이
      request_digest 칸을 들고 그 값이 비어 있지 않다(lane-log.request-file-digest). 값이
      명시적으로 null 인 행 — 요청 파일을 쓰지 않는 재생 어댑터의 왕복 — 만 대상에서 빠지며,
      제외 건수는 판정 산출 request_digest_exempt 에 남는다. 칸 자체가 없는 행은 결함이고,
      **빈 문자열도 결함이다**(요청 파일을 쓰는 어댑터가 그 파일을 읽지 못한 자리 — 면제의
      뜻은 능력의 부재 하나뿐이다, 2026-08-19 보수).
    implemented_by: engine/stages/read.py
    introduced_by: "재정 2026-08-18 P-U3"
    note: >-
      정본 1개만 진행했다는 사실은 **로그에 없음으로** 증명된다. 수확(재정 P-B) 슬롯도 정본
      실행에만 존재하되 결정론 실행이므로 `lane.sub_lanes`(LLM 레인 배정 정본)에는 등재하지
      않는다 — 이 검사는 그 슬롯의 존재를 결함으로 읽지 않는다.
      ★ 시점 결속 3항이 이 검사에 붙은 이유(재정 P-12 · 재정 2026-08-19 S4): 결속이 코드에만
      있고 로그에 남지 않으면 다음 개정이 그것을 지워도 산출물은 아무 말도 하지 않는다. 검사
      id 를 새로 만들지 않은 것은 사전 등재가 재정 사항이기 때문이다(`contracts/glossary.md`
      §2.1) — 셋째 항의 규칙 id(lane-log.request-file-digest)는 이 검사 **안쪽**의 판정 사유
      이며 검사 id 가 아니다. 그 항의 신설 근거는 재정 2026-08-19 S4 이고, 판정 관할의 확장
      이므로 총괄 재량으로 하지 않았다.
      ★ **2026-08-31 추기 — 이 검사는 값을 보지 않는다.** 위 셋째 항이 보는 것은 request_digest
      칸의 **형태**(있음 · 빈 값 아님 · 면제가 명시 null)뿐이며, 그 칸에 적힌 64자리가 실제
      파일과 같은지는 **보지 않는다.** 그 값 대조는 재정 2026-08-31 Q1 이 신설한 별도 검사
      read.lane-log-digest-value 의 소관이다. 두 검사의 관할이 갈린 자리를 여기 적어 두는
      이유는, 이 검사의 pass 를 값 일치의 증거로 읽는 것이 정확히 재정 Q1 이 금지한 형태이기
      때문이다(하나의 통과를 다른 하나의 증거로 쓰지 마라).
  - id: read.lane-log-digest-value
    phases: [exit]
    criterion: >-
      레인 로그가 적은 **요청 파일 지문의 값**이 그 자리의 request.md 와 일치한다
      (재정 2026-08-31 Q1). 행마다 셋 중 하나로 판정한다 — ⓐ 값이 64자리 지문이면 러너가
      **파일을 직접 열어** sha256 을 다시 내고 대조한다(불일치 = lane-log.digest-value-mismatch ·
      파일 부재 = lane-log.digest-file-missing · 읽기 실패 = lane-log.digest-file-unreadable).
      ⓑ 값이 명시 null 이면 **면제 주장**이며 자격은 선언이 아니라 **요청 파일의 부재**다 —
      파일이 실재하는데 null 이면 lane-log.digest-null-disguise 로 걸린다.
      ⓒ 칸 자체가 없거나 값이 빈 문자열인 행은 **여기서 세지 않는다**(read.lane-log-shape 의
      소관이며 이중 계수를 막는다). 산출에 digest_verified · exempt_verified ·
      deferred_to_shape · lanes_root_present 를 남긴다.
    implemented_by: engine/stages/read.py
    introduced_by: "재정 2026-08-31 Q1"
    note: >-
      ★ 왜 형태 검사에 얹지 않고 id 를 나눴는가(재정 Q1 의 근거 문언): lane-log-shape 는 이름
      그대로 **형태**를 주장하는 검사이고 **값 일치**는 다른 주장이다. 한 검사가 둘을 지면
      어느 쪽이 통과시켰는지 판정문에서 사라진다. 같은 원리가 CLAUDE.md §6 의 관문 4종에 이미
      서 있다 — 네 도구는 각자 하나의 주장만 증명한다.
      ★ 이 검사가 닫는 구멍은 2026-08-19 감수 D 의 실측 둘이다 — M-D(값만 ffff…ffff 로 위조해도
      형태 검사가 pass violations=0) · M-E(실제 파일 어댑터 행을 null 로 위장하면 제외 계수만
      늘고 통과). 더해 M-C(소비 후 request.md 교체)가 손 대조에서 **기계 판정으로** 옮겨진다.
      ★ 어댑터에 다시 묻지 않고 파일을 직접 연다. 값을 낸 함수(FileLaneAdapter.request_md_digest)
      를 다시 불러 대조하면 같은 함수가 자기 출력을 승인하는 꼴이라 아무것도 증명하지 않는다.
      ★ 증명 범위를 넓게 말하지 않는다 — 레인 루트가 **어디인가**는 런 구성이지 증거가 아니다.
      이 검사는 "로그의 값이 그 루트 아래 파일과 같다"만 주장한다.

# 모든 검사 행은 verdict-check-row/v0 서식으로 보고된다(재정 N5).
# 공허 2종(empty-ruleset·empty-target)은 그 서식의 파생값으로 자동 날인된다.
report_format: contracts/schemas/verdict-check-row.schema.json
report_file: 10-read/convergence.json

failure_binding_status:
  runner_reads: [checks, kind, action, then, reason_label]
  test_bound: [points, judged_at]
  prose_only: [condition, note]
  deferred:
    - key: kind
      value: upstream-defect
      binding: test_bound
      why: "재요리 경로는 재정 T2 가 PD-M5 로 이연 — 호출자 0 (grep 이 시험). 행은 키만 든다(T30 ⓐ)"
      until: PD-M5

# ★ 재정 T26·T28·T29·T30 — 키로 행을 찾고 동률은 아래 계약 순서로 풀므로,
# failure[] 행 순서 자체가 값이다.
failure:
  - checks: [read.schema]
    action: retry(1)
    then: halt
    points: [exit]
    condition: "read.schema 실패"
    note: "read.schema 는 checks_before_exit 에서 exit 로만 선언된 출구 검사다."
  - checks: [read.source-digest]
    action: halt
    condition: "원천 다이제스트가 run.yaml 기록과 불일치(read.source-digest)"
    note: >-
      원천이 도중에 바뀐 런은 폐기 대상이다. 진입의 read.input-digest 이후 구간에서 드러난
      불일치를 잡고, 출구 디스크 재독으로 실제 발동한다(재정 T24·T25).
  - checks: [read.input-digest]
    action: halt
    reason_label: "환경 오류"
    judged_at: entry
    condition: "진입 지문 불일치(checks_on_entry: read.input-digest)"
    note: >-
      재정 P-C. 품질 결함이 아니므로 재시도·수정 루프에 넣지 않고 즉시 중단한다.
  - kind: retry-repeat
    action: escalate
    reason_label: "국면 간 변이 재현 — 코드 결함 의심"
    condition: "재시도가 같은 실패 서명을 재현(국면 간 변이 재현)"
    note: >-
      재정 2026-09-01 T16 §6 ⑤. 재시도의 같은 서명 재현 자체가 코드 결함 진단이다.
  - checks: [read.convergence]
    action: retry(1)
    points: [early]
    then: escalate
    condition: "read.convergence 의 exact-match 축 미달"
    note: >-
      이 행은 분해 직후의 **조기 수렴 지점**에서 재시도하므로 early 를 신고한다 — 접지 지출
      이후로 미루지 않는다(재정 P-4). T28 β 로 출구에서는 재디스패치하지 않는다.
      Owner 재정 대상: 소재 변경 또는 절차 수정. 품질 결함이 아니라 절차 신호다. 이 축의
      미달도 봉투 적용 범위 밖이다(재정 T17).
  - checks: [read.lane-log-shape]
    condition: "read.lane-log-shape 실패(레인 왕복 기록의 형태)"
    action: escalate
    note: "출구 루프 뒤에 합류하므로 재시도는 0회고 retry(n) 선언은 허구다(재정 2026-09-01 T22)."
  - checks: [read.lane-log-digest-value]
    condition: "read.lane-log-digest-value 실패(레인 왕복 기록의 지문 값)"
    action: escalate
    note: "출구 루프 뒤에 합류하므로 재시도는 0회고 retry(n) 선언은 허구다(재정 2026-09-01 T22)."
  - checks: [read.claim-inventory, read.dependency-parse]
    condition: "조기·출구 청구항 검사(read.claim-inventory / read.dependency-parse) 실패"
    action: retry(1)
    then: escalate
    points: [early, exit]
    note: >-
      두 검사는 조기와 출구 양쪽에서 실제로 돌며, 조기 실패는 해당 분해 실행을,
      출구 실패는 정본 후속을 고친다(재정 T16·T17·T26).
  - checks: [read.verbatim, read.pointer-resolve, read.coverage, read.value-derivation, read.bibliography]
    condition: "출구 전용 read.verbatim / pointer-resolve / coverage / value-derivation / bibliography 실패"
    action: retry(1)
    then: escalate
    points: [exit]
    note: >-
      다섯 검사는 출구에서만 돌며 정본 후속 재시도 한 번 뒤에도 실패하면 상신한다
      (재정 T17·T26).
  - kind: gate-escalation
    condition: "read.convergence 상신 축(escalation-trigger) 미달"
    action: escalate
    reason_label: "독해 프로파일 상신"
    note: >-
      조기 수렴의 escalation-trigger 축 미달은 검사 실패 행이 아니라 이 kind 행으로
      판정하며, 계속 봉투가 적용되는 유일한 자리다(재정 P-3·T17·T30).
  - kind: upstream-defect
    condition: "반려 수신(material-defect.md)"
    action: reject-upstream
    note: >-
      재요리 수신 경로는 재정 T2 가 PD-M5 로 이연했다. 이 행은 키만 보존하고 오늘의
      러너 호출자는 없으며 결속은 deferred/test_bound 다(재정 T2·T30).
  # ★ 폐기 행 — `drop-signal = drop-proposed (early 또는 final)` → escalate(reason_label
  #   "안도감 부적합"). 재정 P-A 가 조기 drop 의 escalate 를 폐지하고 확정 재정을 CP1 에
  #   통합했으므로, drop 은 더 이상 이 표의 조치 대상이 아니다. drop 의 처분 자리는
  #   owner_checkpoint(CP1) 한 곳이다.

owner_checkpoint:
  id: material_approval
  surfaces:
    - 10-read/material-spec.md
    - 10-read/drop-signal.md
    - 10-read/positioning.md
    - 10-read/convergence-early.json   # 조기 수렴 판정서(재정 P-4·P-U3) — 아래 주석
    - 10-read/convergence.json
  # ★ 조기 판정서가 CP1 표면인 이유(2026-08-18 총괄 정정 — SPEC §1.5 와 이 파일이 갈렸던 자리).
  #   최종 보고서(convergence.json)는 **정본 1개**의 검사 결과이고, 조기 판정서는 **두 독해가
  #   갈렸는가**의 기록이다. 후자는 전자에 남지 않는다 — 정본 지정 이후 read-b 는 더 돌지 않기
  #   때문이다. Owner 가 "이 재료를 승인할 것인가"를 판단할 때 **두 독해가 얼마나 갈렸는지**는
  #   재료의 신뢰도 그 자체이며, 그것을 표면에서 빼면 승인은 정본만 보고 내리는 결정이 된다.
  #   감춰진 예외가 은폐인 것과 같은 이유로, 감춰진 갈림도 은폐다.
  confirm_file: "15-frozen/approval-v<N>.md"
  envelope_schema: contracts/schemas/approval-envelope.schema.json
  question: >-
    이 재료만 읽고 이 특허가 무엇을 하는 물건인지, 그리고 투자자-팬의 어떤 질문에
    답할 수 있는지 말할 수 있는가? 말할 수 없다면 어느 항목이 비었는지 지적하라.
  # CP1 이 반드시 보는 목록(재정 R1·R3·N9 · 2026-08-18 P-1·P-A·P-B). convergence.json 이 싣고
  # material-spec.md(CP1 판독본)가 별도 절로 강조 렌더한다. 전부 "기계가 무엇을 보증했고
  # 무엇을 보증하지 못했는가"의 목록이다.
  mandatory_surfaces:
    - list: manual_verification_required
      why: "도면 유래 수치는 기계 검증 불가다. 검사가 통과시켰다는 사실이 값이 옳다는 뜻이 아님을 봉투가 자백한다(재정 R1)."
    - list: grounding_exceptions
      why: "접지 전량이 원칙이므로 예외는 날조하거나 숨기지 않고 드러낸다(재정 R3). 예외가 많으면 그것이 소재 신호다."
    - list: fact_classification
      why: >-
        파생 수치는 원문 어디에도 문자열로 없다. 산식과 입력 항목을 나란히 보여주지 않으면
        Owner 는 그 값이 계산의 결과라는 사실 자체를 알 수 없고 승인은 형식이 된다(재정 N9).
    - list: unclassified_dependents
      why: >-
        구조 미분류(`unclassified`)는 결함이 아니라 관할 축소의 표지다(재정 P-1). 표지를
        붙이고 침묵하면 도달 불능이 조용한 통과가 되므로, 전건을 목록으로 드러내
        Owner 의 눈이 마지막 심급이 되게 한다.
    - list: screening_memos
      why: >-
        read-a·read-b 각자의 맹검 스크리닝 메모를 **둘 다 병기**한다(재정 P-A·P-U4).
        두 독립 관찰의 일치/불일치 자체가 신호이며, drop 의 확정 재정은 완전 정보 위에서
        CP1 한 자리에서 1회 이루어진다.
    - list: numeric_inventory
      why: >-
        수치는 접지 스팬 기반 전수 기계 수확이고 중요분은 역참조로 도출된다(재정 P-B).
        표면에는 **전량 카운트를 상시 표기**한다("전체 N건 — 참조 M건 표시, 미참조 접힘") —
        카운트가 없으면 미참조분 접힘이 은폐가 된다.
  # 무인 실행 금지 — --yes 류 플래그를 설치하지 않는다. 체크포인트 무응답 = 무기한 대기이며
  # 시간 초과 자동 진행은 없다(재정 R8).
  unattended_flag: forbidden
