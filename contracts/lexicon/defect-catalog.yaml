# 결함 카탈로그 — 기계 판독 정본
#
# 근거: 헌장 D7(게이트 관할권)·D15(굿하트 가드) + Owner 재정 2026-08-17 R7.
# 카탈로그는 "알려진 나쁨"만 차단한다. 반증 전용이므로 통과 ≠ 좋음이다(D7).
# ★ 빈 상태로 출발한다(재정 R7). 구 AI 텔 목록의 이식은 금지된다 —
#   항목은 첫 런 교정에서 수확해 배치 리뷰로 상신한다.
# 산문 주석은 KR, 필드명·id·정규식은 EN 원문.

schema: defect-catalog/v0
version: "0"

# ---------------------------------------------------------------------------
# 스코프 조항 (재정 R7 원문 — 축약·의역 금지)
# ---------------------------------------------------------------------------
scope: >-
  등재 대상은 형식·구조 패턴에 한정한다. 내용·주제·레지스터는 등재할 수 없다.
  내용 우려는 화행 플래그(contracts/lexicon/speech-acts.yaml) 또는 헌장 개정의 관할이다.

# ---------------------------------------------------------------------------
# 등재 형식 4요소 (전부 필수). 아래 필드가 빠진 항목은 로드 거부다.
#   ① 패턴 정의        : pattern
#   ② 검출 방법        : detection.method + regex 또는 question
#   ③ 예외·반례        : counter_examples[] (등재 즉시 golden 표본으로 추가)
#   ④ 재정 기록        : decision (+ 검출 증명 케이스 regression_case)
# ---------------------------------------------------------------------------
entry_schema:
  required: [id, pattern, detection, counter_examples, decision, regression_case, scope_class, added]
  load_refusal: >-
    decision · regression_case · counter_examples 중 하나라도 없는 항목은 로드 거부한다.
    입법 없이 집행하지 않으며(D7), 검출이 증명되지 않은 항목은 죽은 문자다.
  fields:
    id:
      type: string
      pattern: '^dc-[0-9]{3}$'
    pattern:
      type: string
      note: "패턴 정의. 형식·구조 패턴만 기술한다(scope 조항)."
    detection:
      type: object
      required: [method]
      fields:
        method: { enum: [regex, llm-classification] }
        regex: { type: string, note: "method == regex 일 때 필수" }
        question: { type: string, note: "method == llm-classification 일 때 필수. 문장 단위 분류 질문(EN)" }
    counter_examples:
      type: array
      min_items: 1
      item_fields:
        text: { type: string, note: "걸리면 안 되는 문장" }
        golden_case_id: { type: string, pattern: '^rc-[0-9]{4}$' }
    decision:
      type: string
      pattern: '^D-[0-9]{8}-[0-9]{2}-[a-z0-9-]+$'
      note: "Owner 재정 파일 ID. docs/decisions/ 에 실재해야 한다."
    regression_case:
      type: string
      pattern: '^rc-[0-9]{4}$'
      note: "검출 증명 케이스. ledgers/regression/cases.jsonl 에 실재해야 한다."
    scope_class:
      enum: [form, structure]
      note: "내용·주제·레지스터 등재 불가(scope 조항의 기계적 집행)."
    added:
      type: string
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'

# 등재 항목 서식 견본 (주석 — 실제 항목이 아니다)
#   - id: dc-001
#     pattern: "<형식·구조 패턴 정의>"
#     detection:
#       method: llm-classification
#       question: "<문장 단위 분류 질문>"
#     counter_examples:
#       - { text: "<걸리면 안 되는 문장>", golden_case_id: rc-0001 }
#     decision: D-YYYYMMDD-nn-<slug>
#     regression_case: rc-0001
#     scope_class: form
#     added: YYYY-MM-DD

# ---------------------------------------------------------------------------
# 출입구 단일 (재정 R7 · D7 · D15)
# ---------------------------------------------------------------------------
amendment:
  gate: "배치 리뷰 상신 → Owner 재정 → docs/decisions/ 등재 → 이 파일 수정 → 회귀 케이스 1건 추가"
  applies_to: [add, modify, retire]   # 등재·수정·폐지 동일 경로
  in_run_addition: forbidden          # 런 중 즉석 등재 금지
  automatic_addition: forbidden       # 자동 등재 금지

# ---------------------------------------------------------------------------
# 판정문 기록 (재정 R7)
# ---------------------------------------------------------------------------
verdict_record:
  legislated_fields: [defect_catalog_version, defect_catalog_entries]
  vacuous_pass: >-
    entries 가 비어 있는 상태에서 이 검사를 통과하면 판정문의 vacuous_pass[] 에
    "defect-catalog" 를 날인한다. 항목 수 0인 카탈로그를 통과한 사실을 판정문이 자백한다.

entries: []
