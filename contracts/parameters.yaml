# 조정 가능 파라미터 — 기계 판독 정본
#
# 근거: Owner 재정 2026-08-17 R9.
# 아래 네 수치는 배치 리뷰에서 Owner 재정으로 조정 가능하다. 헌장 개정은 불요하며,
# 재정 없이 코드·프롬프트에서 다른 값을 쓰는 것은 규율 위반이다(이 파일이 단일 진원).
# 산문 주석은 KR, 파라미터 키는 EN 원문.

schema: parameters/v0
version: "0"

adjustable:
  gate.l1.k: 3
  probe.n: 5
  review.batch_runs: 5
  instrument.correlation_min_samples: 10

# 각 파라미터의 의미와 근거 조항
meanings:
  gate.l1.k:
    description: "L1 국소 대조의 독립 실행 반복 수(홀수 유지). 과반 일치 항목만 defect 로 채택하고, 미달은 flag(origin: minority-vote)로 강등한다."
    basis: "D8 + 재정 2026-08-17 R9"
  probe.n:
    description: >-
      계기(프로브) 시독 대수. 행동 프로브를 독립 n대에 돌린다.
      유효 응답 수의 요건은 정족수 규율(아래 instrument_quorum)이 정한다 — n 대 전원이다.
    basis: "D9 + 재정 2026-08-17 R9 + 재정 2026-08-18 P-6"
    retired:
      min_effective_rule: "ceil(probe.n / 2)"
      retired_by: "재정 2026-08-18 P-6"
      retired_on: "2026-08-18"
      note: >-
        폐기 기록이며 현행 규칙이 아니다. 이 파생 규칙은 "과반 유효 응답"으로 판정을 세워
        n=5 에서 3대만 살아도 진행했고(M0.5 재감수 M-04 의 처분), P-6 이 그 과반 기준을
        정족수 5/5 로 올리면서 자리를 잃었다. 삭제 대신 남기는 이유는 두 가지다 —
        구 산출물·구 문서가 이 이름을 인용하고 있고(무엇으로 대체되었는지가 보여야 한다),
        "과반이면 계기가 성립한다"는 판정 의미가 재정으로 뒤집혔다는 사실 자체가 기록거리다.
  review.batch_runs:
    description: "배치 리뷰 주기(런 수). 카탈로그 등재·앵커 가중·파라미터 변경의 재정 자리."
    basis: "D13 + 재정 2026-08-17 R9"
  instrument.correlation_min_samples:
    description: "계기 점수 ↔ 실반응 상관 점검을 개시하는 누적 건수. 미만이면 점검하지 않는다."
    basis: "D13 + 재정 2026-08-17 R9·R12"

change_procedure: "배치 리뷰 상신 → Owner 재정 → docs/decisions/ 등재 → 이 파일 수정"

# ---------------------------------------------------------------------------
# 계기 정족수 (재정 2026-08-18 P-6 — 구 min_effective_rule 폐기의 대체 규율)
#
# 정족수를 전원으로 올린 이유는 계기의 의미론이다. 계기는 게이트가 아니라 관측이고,
# 관측 대수가 줄면 "무엇을 보았는가"가 아니라 "몇 대가 살아남았는가"가 결과를 흔든다.
# 과반 규칙은 그 흔들림을 기계가 조용히 흡수해 버렸다 — 3대만 살아도 판정이 나왔고,
# 그 판정이 5대 판정과 같은 이름으로 기록되었다.
# 그래서 미달의 처분은 기계 강등이 아니라 Owner 상신이다: 표본이 줄어든 채로 진행할지는
# 계기가 정할 문제가 아니다(D15 — 자문 층은 점수를 발행하지 않는다).
# ---------------------------------------------------------------------------
instrument_quorum:
  ruling: 재정 2026-08-18 P-6
  rule: "정족수 5/5 — 유효 응답이 probe.n 과 같아야 한다."
  dead_instance_retry:
    scope: "죽은 인스턴스만"          # 살아있는 응답은 보존한다(재실행으로 갈아치우지 않는다)
    max_attempts: 2                   # 총괄 재량(재정이 상한을 총괄에 위임)
    discretion_note: "상한은 재정이 총괄 재량으로 남긴 값이다 — 변경에 재정 불요."
  on_exhausted: owner-escalation      # 기계 강등 금지
  owner_options: [대기, 결측 진행, 부분 인정]
  owner_options_note: "결측 진행·부분 인정은 육성 봉투가 필요하다."
  excluded_from_correlation: "결측·부분 런은 계기 상관 점검 표본에서 제외한다."
  adjustable_scope_note: >-
    조정 가능 파라미터는 4종 그대로다 — 정족수는 probe.n 의 파생 규율이고,
    max_attempts 는 총괄 재량 값이며, 둘 다 adjustable 에 등재하지 않는다.

# ---------------------------------------------------------------------------
# k 불일치 로그 (재정 R9)
# k=3 에서 2:1 이 나오면 다수결을 채택하되 불일치를 반드시 기록한다.
# 특정 검사 항목의 반복 불일치 = 술어 모호 신호이며 배치 리뷰의 개선 사료다.
# ---------------------------------------------------------------------------
disagreement_log:
  required: true
  location: "50-gate/<variant>/l1.json 의 disagreement_log[]"
  row_fields: [rule, locus, for, against]
  purpose: "술어 모호 신호의 수집. 삭제·요약 금지 — 배치 리뷰에서 원자료로 읽는다."

# ---------------------------------------------------------------------------
# 계기 집계 규율 (재정 R9)
# 임계 필터 없이 걸림 지점을 횟수와 함께 전량 보고한다. 엔진이 필터·요약하지 않으며,
# 해석은 소견(Fable) 몫이다. 예: {"locus": {"tweet": 6}, "issue": "term", "count": 3, "n": 5}
# ---------------------------------------------------------------------------
instrument_reporting:
  threshold_filter: none
  report_all_loci: true
  row_fields: [locus, issue, count, n]
  location: "60-probe/score.json"
  interpretation_owner: critique   # 해석은 소견 몫. 엔진은 집계만 한다.
